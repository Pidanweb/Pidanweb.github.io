<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QRスライム配置テスト</title>
<style>
  :root{ --bg:#0a1110; --cyan:#7ae7ff; --gold:#ffd35a; --panel:#000c; --btn:#0d2a30; color-scheme:dark; }
  [hidden]{display:none !important}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;font:14px "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
  #stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:100vw;height:100vh;background:#000}
  #stage video,#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #stage video{object-fit:fill}
  #stage.mir>*{transform:scaleX(-1)}
  #ui{position:fixed;top:10px;right:10px;z-index:20;text-align:right}
  button,select{font:inherit}
  .btn{background:var(--btn);color:var(--cyan);border:1px solid #7ae7ff88;border-radius:6px;padding:6px 10px;cursor:pointer}
  .panel{margin-top:6px;margin-left:auto;padding:10px;background:var(--panel);border:1px solid #7ae7ff55;border-radius:8px;width:290px;text-align:left;max-height:calc(100vh - 80px);overflow-y:auto;box-sizing:border-box}
  .panel label{display:block;margin-top:8px}
  .panel select,.panel input[type=range]{width:100%;margin-top:4px}
  .panel small{display:block;color:#9fdcea;font-size:11px;margin-top:2px}
  .panel b{color:var(--gold)}
  .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  #camInfo{margin-top:8px;font-size:12px;color:var(--gold);word-break:break-all}
  #stat{position:fixed;left:10px;top:10px;z-index:20;padding:6px 10px;background:#000a;border:1px solid #7ae7ff44;border-radius:6px;font:12px/1.5 monospace;color:#9fffb0;white-space:pre}
  #logBox{position:fixed;left:10px;bottom:10px;z-index:20;width:min(560px,calc(100vw - 20px));background:#000d;border:1px solid #7ae7ff55;border-radius:8px;box-sizing:border-box}
  #logHead{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;border-bottom:1px solid #7ae7ff33;color:var(--gold);font-size:12px}
  #logHead .btn{padding:2px 8px;font-size:12px}
  #log{margin:0;padding:6px 8px;height:170px;overflow-y:auto;font:11px/1.45 monospace;white-space:pre-wrap;word-break:break-all;color:#cfe}
  #log .w{color:var(--gold)} #log .e{color:#ff8a96} #log .ok{color:#9fffb0}
  #start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);text-align:center;padding:20px;box-sizing:border-box}
  #start h1{margin:0;color:var(--gold);font-size:26px}
  #start p{margin:0;color:#9fdcea;line-height:1.7;max-width:30em}
  #start .btn{font-size:18px;padding:12px 28px}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div id="start">
  <h1>QRスライム配置テスト</h1>
  <p>印刷したQRコード（0〜3）をカメラに映すと、その上にスライムが乗ります。<br>使うカメラは右上の「📷 カメラ設定」で選べます。</p>
  <button class="btn" id="startBtn">カメラを開始</button>
</div>

<div id="stage"><video id="vid" autoplay playsinline muted></video></div>

<div id="ui">
  <button class="btn" id="camBtn">📷 カメラ設定</button>
  <button class="btn" id="panelBtn">⚙ 表示設定</button>
  <button class="btn" id="logBtn">📜 ログ</button>
  <div id="camPanel" class="panel" hidden>
    <label>使うカメラ <select id="camSel"><option value="">（まず「カメラを開始」を押してください）</option></select></label>
    <label>解像度 <select id="resSel"><option value="1280x720" selected>1280×720</option><option value="1920x1080">1920×1080</option><option value="640x480">640×480</option></select></label>
    <div class="row"><button class="btn" id="camApply">▶ このカメラで開く</button><button class="btn" id="camRefresh">🔄 再検出</button></div>
    <div id="camInfo"></div>
  </div>
  <div id="panel" class="panel" hidden>
    <label>スライムを出すQR
      <select id="target"><option value="*">すべてのQR</option><option value="0">QR 0</option><option value="1">QR 1</option><option value="2">QR 2</option><option value="3">QR 3</option></select>
    </label>
    <label>スライムの大きさ <b id="sizeV">1.4</b>×QR
      <input type="range" id="size" min="0.4" max="4" step="0.1" value="1.4">
    </label>
    <label>カメラの画角 <b id="fovV">65</b>°
      <input type="range" id="fov" min="35" max="110" step="1" value="65">
      <small>スライムが傾く・浮く・沈むときに調整（一般的なWebカメラは60〜78°）</small>
    </label>
    <label><input type="checkbox" id="mirror"> 映像を左右反転（見た目だけ）</label>
    <label><input type="checkbox" id="dbg" checked> 検出枠と番号を表示</label>
  </div>
</div>
<div id="stat" hidden>待機中</div>
<div id="logBox">
  <div id="logHead"><span>システムログ</span><span><button class="btn" id="logCopy">コピー</button> <button class="btn" id="logClear">消去</button></span></div>
  <pre id="log"></pre>
</div>

<script>
// ===== システムログ（最初に読み込み、以降のエラーをすべて拾う）=====
const LOG = document.getElementById('log');
function log(msg, cls = ''){
  const d = new Date(), ts = d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0');
  const line = document.createElement('div'); if (cls) line.className = cls;
  line.textContent = `[${ts}] ${msg}`; LOG.appendChild(line);
  while (LOG.childNodes.length > 400) LOG.removeChild(LOG.firstChild);
  LOG.scrollTop = LOG.scrollHeight;
}
const fmt = a => a.map(x => x instanceof Error ? `${x.name}: ${x.message}` : typeof x === 'object' ? (() => { try { return JSON.stringify(x); } catch (e) { return String(x); } })() : String(x)).join(' ');
for (const [k, cls] of [['log', ''], ['info', ''], ['warn', 'w'], ['error', 'e']]){
  const orig = console[k].bind(console);
  console[k] = (...a) => { orig(...a); log(fmt(a), cls); };
}
addEventListener('error', e => {
  if (e.target && e.target !== window && e.target.src) log(`読み込み失敗: ${e.target.src}`, 'e');
  else log(`エラー: ${e.message} (${(e.filename || '').split('/').pop()}:${e.lineno})`, 'e');
}, true);
addEventListener('unhandledrejection', e => log(`未処理のエラー: ${e.reason && (e.reason.name + ': ' + e.reason.message) || e.reason}`, 'e'));
log(`ページ読み込み: ${location.protocol}//${location.host || '(ローカルファイル)'}  secureContext=${window.isSecureContext}`);
log(`ブラウザ: ${navigator.userAgent}`);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="scanLib">
// ===== QRスキャナ（Workerでもnodeでも使う）=====
const TILES = (() => {
  const t = [[0, 0, 1, 1]];
  for (const y of [0, .4]) for (const x of [0, .4]) t.push([x, y, .6, .6]);
  for (const y of [0, .275, .55]) for (const x of [0, .275, .55]) t.push([x, y, .45, .45]);
  return t;
})();
function crop(d, w, h, x0, y0, cw, ch){
  const c = new Uint8ClampedArray(cw*ch*4);
  for (let y = 0; y < ch; y++) c.set(d.subarray(((y0+y)*w + x0)*4, ((y0+y)*w + x0 + cw)*4), y*cw*4);
  return c;
}
function maskQuad(d, w, h, c, grow){
  const cx = (c[0].x+c[1].x+c[2].x+c[3].x)/4, cy = (c[0].y+c[1].y+c[2].y+c[3].y)/4;
  const p = c.map(q => ({ x:cx + (q.x-cx)*grow, y:cy + (q.y-cy)*grow }));
  const x0 = Math.max(0, Math.floor(Math.min(...p.map(q => q.x)))), x1 = Math.min(w-1, Math.ceil(Math.max(...p.map(q => q.x))));
  const y0 = Math.max(0, Math.floor(Math.min(...p.map(q => q.y)))), y1 = Math.min(h-1, Math.ceil(Math.max(...p.map(q => q.y))));
  const sg = Math.sign((p[1].x-p[0].x)*(p[2].y-p[0].y) - (p[1].y-p[0].y)*(p[2].x-p[0].x)) || 1;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++){
    let ok = true;
    for (let i = 0; i < 4; i++){ const a = p[i], b = p[(i+1)%4]; if (sg*((b.x-a.x)*(y-a.y) - (b.y-a.y)*(x-a.x)) < 0){ ok = false; break; } }
    if (ok){ const i = (y*w + x)*4; d[i] = d[i+1] = d[i+2] = 255; }
  }
}
function readRect(jsQR, d, w, h, x0, y0, cw, ch){
  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
  cw = Math.min(w - x0, Math.floor(cw)); ch = Math.min(h - y0, Math.floor(ch));
  if (cw < 40 || ch < 40) return null;
  const r = jsQR(crop(d, w, h, x0, y0, cw, ch), cw, ch, { inversionAttempts:'dontInvert' });
  if (!r) return null;
  const L = r.location;
  return { data:r.data, c:[L.topLeftCorner, L.topRightCorner, L.bottomRightCorner, L.bottomLeftCorner].map(p => ({ x:p.x + x0, y:p.y + y0 })) };
}
// rois: 追跡中のQRの4隅 / tile: 今回探す新規発見用タイル番号
function scanFrame(jsQR, d, w, h, rois, tile){
  const found = [], seen = new Set();
  for (const c of rois){
    const xs = c.map(p => p.x), ys = c.map(p => p.y);
    const mx = Math.min(...xs), Mx = Math.max(...xs), my = Math.min(...ys), My = Math.max(...ys);
    const s = Math.max(Mx - mx, My - my), cx = (mx+Mx)/2, cy = (my+My)/2, half = s*1.1;
    const r = readRect(jsQR, d, w, h, cx - half, cy - half, half*2, half*2);
    if (r && !seen.has(r.data)){ seen.add(r.data); found.push(r); }
  }
  // 見つけ済みのQRを白く塗りつぶしてから、新規発見用のタイルを探す
  for (const r of found) maskQuad(d, w, h, r.c, 1.3);
  const [tx, ty, tw, th] = TILES[tile % TILES.length];
  for (let k = 0; k < 2; k++){
    const r = readRect(jsQR, d, w, h, tx*w, ty*h, tw*w, th*h);
    if (!r || seen.has(r.data)) break;
    seen.add(r.data); found.push(r); maskQuad(d, w, h, r.c, 1.3);
  }
  return found;
}
</script>
<script>
if (!window.THREE) log('three.js を読み込めませんでした。インターネット接続を確認してください', 'e');
// ===== QRスライム配置テスト =====
// 流れ: カメラ映像 → Worker(jsQR)でQRの4隅を検出 → 4隅からQRの傾き・距離を計算 → その上にスライムを立たせる
const $ = id => document.getElementById(id);
const vid = $('vid'), stage = $('stage');
const DET_MAX = 960;          // 検出に使う映像の最大幅（大きいほど遠くのQRも読めるが重い）
const LOST_MS = 600;          // この時間見失ったらスライムを引っ込める

// ---------- three.js ----------
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const dbgCv = document.createElement('canvas'); stage.appendChild(dbgCv);
const dbg = dbgCv.getContext('2d');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 16/9, .01, 500);   // 原点に固定（実カメラと同じ位置）
scene.add(new THREE.HemisphereLight(0xcfeaff, 0x203020, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, .9); sun.position.set(2, 6, 3); scene.add(sun);

function canvasTex(w, h, fn){ const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return new THREE.CanvasTexture(c); }
const shadowTex = canvasTex(128, 128, (x, w, h) => { const g = x.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(0,0,0,.6)'); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0,0,w,h); });
function mkLabel(text){
  const t = canvasTex(256, 96, (x, w, h) => {
    x.font = 'bold 56px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.lineWidth = 10; x.strokeStyle = '#000c'; x.strokeText(text, w/2, h/2); x.fillStyle = '#ffd35a'; x.fillText(text, w/2, h/2);
  });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:t, transparent:true, depthTest:false }));
  s.scale.set(.8, .3, 1); s.renderOrder = 20; return s;
}

// ---------- スライム（Connectworld_sord.html のジャイアントスライムと同じ作り）----------
function createSlime(){
  const root = new THREE.Group();                 // QRの面に沿った座標（+Yが床から上）
  const body = new THREE.Group(); root.add(body); // 向き・弾み用
  const geo = new THREE.SphereGeometry(1, 40, 28), base = geo.attributes.position.array.slice();
  const mat = new THREE.MeshStandardMaterial({ color:0x5fe07a, roughness:.12, transparent:true, opacity:.86, emissive:0x0a3a18 });
  body.add(new THREE.Mesh(geo, mat));
  const core = new THREE.Mesh(new THREE.SphereGeometry(.32, 16, 12), new THREE.MeshStandardMaterial({ color:0x1d9a44, emissive:0x0a5a20 }));
  core.position.set(0, -.1, -.1); body.add(core);
  const eyes = [];
  for (const s of [-1, 1]){
    const w = new THREE.Mesh(new THREE.SphereGeometry(.15, 12, 10), new THREE.MeshBasicMaterial({ color:0xffffff }));
    w.position.set(s*.33, .22, .86);
    const p = new THREE.Mesh(new THREE.SphereGeometry(.07, 10, 8), new THREE.MeshBasicMaterial({ color:0x111111 }));
    p.position.set(0, 0, .12); w.add(p); body.add(w); eyes.push(w);
  }
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2.4).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({ map:shadowTex, transparent:true, depthWrite:false }));
  shadow.position.y = .01; root.add(shadow);
  const jiggle = (t, amp) => {
    const p = geo.attributes.position.array;
    for (let i = 0; i < p.length; i += 3){
      const x = base[i], y = base[i+1], z = base[i+2], k = 1 + amp*Math.sin(t*7 + x*4 + y*3)*Math.cos(t*5 + z*4);
      p[i] = x*k; p[i+1] = y*k; p[i+2] = z*k;
    }
    geo.attributes.position.needsUpdate = true; geo.computeVertexNormals();
  };
  return { root, body, eyes, shadow, jiggle };
}

// ---------- QRごとの追跡データ ----------
// marker: QRの位置・傾き（カメラ座標）/ stand: QRの面を床として+Yを上に向けた座標
const tracks = new Map();
function getTrack(id){
  if (tracks.has(id)) return tracks.get(id);
  const marker = new THREE.Group(); marker.matrixAutoUpdate = false; scene.add(marker);
  const stand = new THREE.Group(); stand.rotation.x = -Math.PI/2; marker.add(stand);
  const slime = createSlime(); stand.add(slime.root);
  const label = mkLabel('QR ' + id); stand.add(label);
  const t = { id, marker, stand, slime, label, corners:null, seen:-1e9, pos:new THREE.Vector3(), quat:new THREE.Quaternion(),
              tPos:new THREE.Vector3(), tQuat:new THREE.Quaternion(), fresh:true, appear:0, yaw:0, time:Math.random()*10, blinkAt:0 };
  tracks.set(id, t); return t;
}

// ---------- 4隅 → 姿勢（ホモグラフィ分解）----------
function solve(A, b){
  const n = b.length;
  for (let i = 0; i < n; i++){
    let m = i; for (let k = i+1; k < n; k++) if (Math.abs(A[k][i]) > Math.abs(A[m][i])) m = k;
    [A[i], A[m]] = [A[m], A[i]]; [b[i], b[m]] = [b[m], b[i]];
    const p = A[i][i]; if (Math.abs(p) < 1e-12) return null;
    for (let k = i+1; k < n; k++){ const f = A[k][i]/p; for (let j = i; j < n; j++) A[k][j] -= f*A[i][j]; b[k] -= f*b[i]; }
  }
  const x = new Array(n);
  for (let i = n-1; i >= 0; i--){ let s = b[i]; for (let j = i+1; j < n; j++) s -= A[i][j]*x[j]; x[i] = s/A[i][i]; }
  return x;
}
const MODEL = [[-.5,-.5], [.5,-.5], [.5,.5], [-.5,.5]];   // QRの1辺 = 1 として扱う
function homography(dst){
  const A = [], b = [];
  for (let i = 0; i < 4; i++){
    const [x, y] = MODEL[i], [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -u*x, -u*y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v*x, -v*y]); b.push(v);
  }
  const h = solve(A, b); return h && [...h, 1];
}
const vlen = v => Math.hypot(v[0], v[1], v[2]), vnorm = v => { const m = vlen(v); return v.map(x => x/m); };
const vdot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const vcross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
// 戻り値: three.js のカメラ座標でのQRの行列（null=計算不能）
function poseFromCorners(c, w, h, f, retry = true){
  const H = homography(c.map(p => [p.x, p.y])); if (!H) return null;
  const cx = w/2, cy = h/2, k = (a, b, cc) => [(a - cx*cc)/f, (b - cy*cc)/f, cc];
  const k1 = k(H[0], H[3], H[6]), k2 = k(H[1], H[4], H[7]), k3 = k(H[2], H[5], H[8]);
  let l = 2/(vlen(k1) + vlen(k2)); if (k3[2]*l < 0) l = -l;
  let r1 = vnorm(k1.map(v => v*l)), r2 = vnorm(k2.map(v => v*l)); const t = k3.map(v => v*l);
  // r1, r2 を対称に直交化
  const bis = vnorm(r1.map((v, i) => v + r2[i])), n0 = vnorm(vcross(r1, r2)), perp = vnorm(vcross(n0, bis)), s = Math.SQRT1_2;
  r1 = bis.map((v, i) => s*(v - perp[i])); r2 = bis.map((v, i) => s*(v + perp[i]));
  const r3 = vcross(r1, r2);
  // QRの「上」(-r3) がカメラ側を向いていなければ、4隅の並びが鏡像なので並べ替えて再計算
  if (vdot(r3, t) < 0 && retry) return poseFromCorners([c[0], c[3], c[2], c[1]], w, h, f, false);
  // OpenCV系(x右,y下,z前) → three.js系(x右,y上,z後ろ)
  return new THREE.Matrix4().set(
     r1[0],  r2[0],  r3[0],  t[0],
    -r1[1], -r2[1], -r3[1], -t[1],
    -r1[2], -r2[2], -r3[2], -t[2],
     0, 0, 0, 1);
}

// ---------- 設定 ----------
const cfg = { target:'*', size:1.4, hfov:65, dbg:true };
const toggle = (id, others) => { const p = $(id); p.hidden = !p.hidden; if (!p.hidden) others.forEach(o => $(o).hidden = true); };
$('camBtn').onclick = () => { toggle('camPanel', ['panel']); if (!$('camPanel').hidden) listCams(); };
$('panelBtn').onclick = () => toggle('panel', ['camPanel']);
$('logBtn').onclick = () => { $('logBox').hidden = !$('logBox').hidden; };
$('logClear').onclick = () => { LOG.innerHTML = ''; };
$('logCopy').onclick = () => navigator.clipboard.writeText(LOG.innerText).then(() => log('ログをクリップボードにコピーしました', 'ok'), e => log('コピー失敗: ' + e.message, 'e'));
$('target').onchange = e => { cfg.target = e.target.value; log('スライムを出すQR: ' + (cfg.target === '*' ? 'すべて' : cfg.target)); };
$('size').oninput = e => { cfg.size = +e.target.value; $('sizeV').textContent = cfg.size.toFixed(1); };
$('fov').oninput = e => { cfg.hfov = +e.target.value; $('fovV').textContent = cfg.hfov; layout(); };
$('mirror').onchange = e => stage.classList.toggle('mir', e.target.checked);
$('dbg').onchange = e => cfg.dbg = e.target.checked;

// ---------- カメラ ----------
let stream = null, running = false;
async function openCam(deviceId){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    throw new Error('このブラウザ/開き方ではカメラが使えません（HTTPS か localhost で開いてください）');
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  const [rw, rh] = $('resSel').value.split('x').map(Number);
  const video = deviceId ? { deviceId:{ exact:deviceId }, width:{ ideal:rw }, height:{ ideal:rh } }
                         : { facingMode:{ ideal:'environment' }, width:{ ideal:rw }, height:{ ideal:rh } };
  log(`カメラを要求: ${deviceId ? 'deviceId=' + deviceId.slice(0, 8) + '…' : '既定(背面優先)'} ${rw}×${rh}`);
  stream = await navigator.mediaDevices.getUserMedia({ video, audio:false });
  const tr = stream.getVideoTracks()[0], st = tr.getSettings();
  log(`カメラ取得OK: 「${tr.label || '名前なし'}」 ${st.width}×${st.height} ${st.frameRate ? Math.round(st.frameRate) + 'fps' : ''}`, 'ok');
  tr.onended = () => log('カメラが切断されました（他のアプリが使用中、またはケーブル抜け）', 'e');
  tr.onmute = () => log('カメラ映像が止まりました（mute）', 'w');
  tr.onunmute = () => log('カメラ映像が再開しました');
  vid.srcObject = stream;
  try { await vid.play(); } catch (e){ log('映像の再生に失敗: ' + e.name + ' ' + e.message, 'e'); }
  $('camInfo').textContent = `使用中: ${tr.label || '名前なし'}（${st.width}×${st.height}）`;
  layout(); listCams();
}
async function listCams(){
  if (!navigator.mediaDevices) return;
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const cur = stream && stream.getVideoTracks()[0].getSettings().deviceId, sel = $('camSel');
  sel.innerHTML = '';
  if (!devs.length){ sel.innerHTML = '<option value="">カメラが見つかりません</option>'; log('カメラが1台も見つかりません', 'e'); return; }
  devs.forEach((d, i) => { const o = document.createElement('option'); o.value = d.deviceId; o.textContent = d.label || 'カメラ ' + (i+1) + '（許可前は名前が出ません）'; o.selected = d.deviceId === cur; sel.appendChild(o); });
}
async function startWith(deviceId){
  try {
    await openCam(deviceId);
    $('start').hidden = true; $('stat').hidden = false;
    if (!running){ running = true; requestAnimationFrame(loop); log('描画ループ開始', 'ok'); }
  } catch (err){
    log(`カメラを開けません: ${err.name} ${err.message}`, 'e');
    if (err.name === 'NotAllowedError') log('→ ブラウザのアドレスバー左のカメラ許可を確認してください', 'w');
    if (err.name === 'NotReadableError') log('→ 他のアプリ（Zoom・Teams・別タブなど）がカメラを使っていないか確認してください', 'w');
    if (err.name === 'OverconstrainedError') log('→ この解像度に対応していない可能性があります。解像度を下げてください', 'w');
  }
}
$('startBtn').onclick = () => startWith($('camSel').value || null);
$('camApply').onclick = () => startWith($('camSel').value || null);
$('camRefresh').onclick = async () => { await listCams(); log(`カメラ再検出: ${$('camSel').options.length}台`); };
listCams().catch(() => {});
vid.addEventListener('loadedmetadata', () => { log(`映像サイズ: ${vid.videoWidth}×${vid.videoHeight}`); layout(); });
vid.addEventListener('playing', () => log('映像の再生開始', 'ok'));

// ---------- 画面サイズ（映像と3Dのズレを防ぐため、映像と同じ縦横比で表示）----------
const det = document.createElement('canvas'), dctx = det.getContext('2d', { willReadFrequently:true });
let focal = 1;
function layout(){
  const vw = vid.videoWidth, vh = vid.videoHeight; if (!vw) return;
  const sc = Math.min(innerWidth/vw, innerHeight/vh), W = Math.round(vw*sc), H = Math.round(vh*sc);
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  renderer.setSize(W, H, false); dbgCv.width = W; dbgCv.height = H;
  const ds = Math.min(1, DET_MAX/vw); det.width = Math.round(vw*ds); det.height = Math.round(vh*ds);
  focal = (det.width/2)/Math.tan(cfg.hfov*Math.PI/360);
  camera.aspect = det.width/det.height;
  camera.fov = 2*Math.atan((det.height/2)/focal)*180/Math.PI;
  camera.updateProjectionMatrix();
}
addEventListener('resize', layout);

// ---------- QR検出（Worker。読み込めない環境ではメインスレッドで代行）----------
const JSQR_URL = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
let busy = false, tile = 0, detFps = 0, detN = 0, detT = performance.now(), mode = 'init', worker = null;
function startWorker(){
  try {
    const code = `try{importScripts('${JSQR_URL}');postMessage({ready:true});}catch(e){postMessage({fail:String(e)});}\n`
      + $('scanLib').textContent
      + `\nonmessage=e=>{const{buf,w,h,rois,tile}=e.data;postMessage({found:scanFrame(jsQR,new Uint8ClampedArray(buf),w,h,rois,tile)});};`;
    worker = new Worker(URL.createObjectURL(new Blob([code], { type:'text/javascript' })));
    worker.onerror = e => { log('Workerエラー: ' + (e.message || '不明'), 'e'); e.preventDefault(); fallbackMain(); };
    worker.onmessage = e => {
      if (e.data.ready){ mode = 'worker'; log('QR検出エンジン(Worker)の準備完了', 'ok'); return; }
      if (e.data.fail){ log('Workerで jsQR を読み込めません: ' + e.data.fail, 'e'); fallbackMain(); return; }
      onFound(e.data.found);
    };
    log('QR検出エンジンを読み込み中…');
  } catch (e){ log('Workerを作れません: ' + e.message, 'w'); fallbackMain(); }
}
function fallbackMain(){
  if (mode === 'main' || mode === 'loading') return;
  if (worker){ worker.terminate(); worker = null; }
  mode = 'loading'; busy = false;
  log('メインスレッドでQR検出します（少し重くなります）', 'w');
  const s = document.createElement('script'); s.src = JSQR_URL;
  s.onload = () => { mode = 'main'; log('QR検出エンジン(メイン)の準備完了', 'ok'); };
  s.onerror = () => { mode = 'dead'; log('jsQR を読み込めません。インターネット接続を確認してください: ' + JSQR_URL, 'e'); };
  document.head.appendChild(s);
}
startWorker();
let frames = 0;
function pump(){
  if (busy || !vid.videoWidth || vid.readyState < 2 || (mode !== 'worker' && mode !== 'main')) return;
  dctx.drawImage(vid, 0, 0, det.width, det.height);
  const img = dctx.getImageData(0, 0, det.width, det.height), now = performance.now();
  const rois = [...tracks.values()].filter(t => now - t.seen < LOST_MS && t.corners).map(t => t.corners);
  tile = (tile + 1) % TILES.length; if (rois.length && tile === 0) tile = 1;   // 追跡中は重い全画面タイルを飛ばす
  if (++frames === 1) log(`QR検出を開始（解析サイズ ${det.width}×${det.height}）`, 'ok');
  if (mode === 'worker'){
    busy = true;
    worker.postMessage({ buf:img.data.buffer, w:det.width, h:det.height, rois, tile }, [img.data.buffer]);
  } else {
    try { onFound(scanFrame(jsQR, img.data, det.width, det.height, rois, tile)); } catch (e){ log('検出エラー: ' + e.message, 'e'); }
  }
}
function onFound(found){
  busy = false; detN++;
  const now = performance.now();
  for (const f of found){
    const m = poseFromCorners(f.c, det.width, det.height, focal);
    if (!m){ log(`QR ${f.data}: 姿勢を計算できません（角度が急すぎる）`, 'w'); continue; }
    const isNew = !tracks.has(f.data), t = getTrack(f.data);
    if (isNew || now - t.seen > LOST_MS) log(`QR「${f.data}」を${isNew ? '発見' : '再発見'}`, 'ok');
    t.corners = f.c; t.seen = now; t.lostLogged = false;
    m.decompose(t.tPos, t.tQuat, new THREE.Vector3());
    if (t.fresh){ t.pos.copy(t.tPos); t.quat.copy(t.tQuat); t.fresh = false; }
  }
}

// ---------- 描画ループ ----------
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(x-1, 3) + c1*Math.pow(x-1, 2); };
const ONE = new THREE.Vector3(1, 1, 1), ORIGIN = new THREE.Vector3();
let last = performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now = performance.now(), dt = Math.min(.1, (now - last)/1000); last = now;
  pump();

  const a = 1 - Math.exp(-dt*14);   // 揺れを抑える平滑化
  for (const t of tracks.values()){
    const visible = now - t.seen < LOST_MS && (cfg.target === '*' || cfg.target === t.id);
    t.appear = Math.max(0, Math.min(1, t.appear + (visible ? dt/.5 : -dt/.2)));
    if (now - t.seen >= LOST_MS && !t.lostLogged){ t.lostLogged = true; log(`QR「${t.id}」を見失いました`, 'w'); }
    if (!visible && t.appear === 0){ t.marker.visible = false; t.fresh = true; continue; }
    t.marker.visible = true;
    t.pos.lerp(t.tPos, a); t.quat.slerp(t.tQuat, a);
    t.marker.matrix.compose(t.pos, t.quat, ONE); t.marker.matrixWorldNeedsUpdate = true;

    // スライムの動き（待機中のぷるぷる＋カメラの方を向く）
    const s = t.slime, R = cfg.size/2, k = Math.max(.001, easeOutBack(t.appear));
    t.time += dt;
    const sy = 1 + Math.sin(t.time*3)*.06, sx = 1/Math.sqrt(sy);
    s.jiggle(t.time, .035);
    s.body.scale.set(R*sx*k, R*sy*k, R*sx*k);
    s.body.position.y = R*sy*k;
    s.shadow.scale.setScalar(R*k);
    t.stand.updateWorldMatrix(true, false);
    const cam = t.stand.worldToLocal(ORIGIN.clone());
    const want = Math.atan2(cam.x, cam.z);
    let d = want - t.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); t.yaw += d*Math.min(1, dt*6);
    s.body.rotation.y = t.yaw;
    if (now > t.blinkAt) t.blinkAt = now + 2000 + Math.random()*3000;
    const blink = t.blinkAt - now < 110 ? .15 : 1; s.eyes.forEach(e => e.scale.y = blink);
    t.label.visible = cfg.dbg; t.label.position.y = R*2*k + .35;
  }
  renderer.render(scene, camera);

  // デバッグ: 検出したQRの枠
  dbg.clearRect(0, 0, dbgCv.width, dbgCv.height);
  if (cfg.dbg){
    const sc = dbgCv.width/det.width;
    for (const t of tracks.values()){
      if (now - t.seen > LOST_MS || !t.corners) continue;
      dbg.strokeStyle = '#7ae7ff'; dbg.lineWidth = 3; dbg.beginPath();
      t.corners.forEach((p, i) => i ? dbg.lineTo(p.x*sc, p.y*sc) : dbg.moveTo(p.x*sc, p.y*sc)); dbg.closePath(); dbg.stroke();
      dbg.fillStyle = '#ffd35a'; dbg.beginPath(); dbg.arc(t.corners[0].x*sc, t.corners[0].y*sc, 5, 0, 7); dbg.fill();
    }
  }

  if (now - detT > 1000){ detFps = detN*1000/(now - detT); detN = 0; detT = now; }
  const live = [...tracks.values()].filter(t => now - t.seen < LOST_MS).map(t => t.id).sort();
  $('stat').textContent = `エンジン: ${({worker:'Worker',main:'メイン',loading:'読込中',init:'読込中',dead:'読込失敗'})[mode]}\n検出中のQR: ${live.length ? live.join(', ') : 'なし'}\n検出 ${detFps.toFixed(1)} 回/秒  解析 ${det.width}×${det.height}`;
}
</script>
</body>
</html>
