<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connectworld Wizard</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a1110}
  canvas{display:block;cursor:crosshair;touch-action:none}
  #ui{position:fixed;top:10px;right:10px;z-index:5;font:14px sans-serif;color:#fff;text-align:right}
  #ui button{background:#0d2a30cc;color:#7ae7ff;border:1px solid #7ae7ff88;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
  #camPanel{margin-top:6px;padding:10px;background:#000c;border:1px solid #7ae7ff55;border-radius:8px;width:280px;text-align:left}
  #camPanel select{width:100%;margin:4px 0 8px;padding:4px;font:inherit}
  #camPanel div{margin-top:6px}
  #camStat{font-size:12px;color:#ffd35a;word-break:break-all}
  #v,#fv{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
  #facePrev{position:fixed;left:10px;bottom:10px;z-index:5;width:240px;height:180px;border:2px solid #7ae7ff88;border-radius:8px;background:#000;pointer-events:none;display:none}
  #faceBadge{margin-top:6px;font-size:12px;color:#7ae7ff;text-shadow:0 0 4px #000}
  #camPanel input[type=range]{width:100%}
  #menu{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(260px,44vw);z-index:9;background:#061418cc;border:1px solid #7ae7ff88;border-radius:12px;padding:16px;display:none;flex-direction:column;gap:12px;justify-content:center;font:15px sans-serif;color:#fff;text-align:center;box-sizing:border-box}
  #menu.on{display:flex} #menu{overflow-y:auto;gap:8px} #menu>:first-child{margin-top:auto} #menu>:last-child{margin-bottom:auto} #jobs{display:none;flex-direction:column;gap:6px} #jobs.on{display:flex} #menu button:disabled{opacity:.45;cursor:not-allowed} #menu button{background:#0d2a30;color:#7ae7ff;border:1px solid #7ae7ff88;border-radius:8px;padding:10px;font:inherit;cursor:pointer}
  #chant{position:fixed;left:10px;top:10px;z-index:6;display:flex;flex-direction:column;gap:6px;width:min(340px,44vw);pointer-events:none;font:13px/1.55 "Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;color:#fff}
  .ult{position:relative;padding:6px 10px 9px;background:#020a10d9;border:1px solid var(--c);border-radius:8px;overflow:hidden;transition:opacity .3s}
  .ult .hd{display:flex;justify-content:space-between;align-items:baseline;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
  .ult .hd b{color:var(--c);font-size:14px;letter-spacing:.04em} .ult .hd span{font-size:12px;color:#ffffffaa}
  .ult .ph{margin-top:2px;color:#ffffff59}
  .ult .cp{color:#ffffffb0;border-bottom:1px dashed #ffffff55;padding:0 1px;transition:color .2s,text-shadow .2s}
  .ult .cp.lit{color:#fff;border-bottom:1px solid var(--c);text-shadow:0 0 6px var(--c),0 0 14px var(--c),0 0 22px var(--c)}
  .ult .cdb{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--c)}
  .ult.cd{opacity:.45} .ult.near{box-shadow:0 0 12px var(--c)}
  #castUI{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font:13px sans-serif;text-align:center;max-width:94vw}
  #spells{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:560px} .sp{position:relative;overflow:hidden;padding:3px 7px;border:1px solid;border-radius:5px;background:#000a} .sp i{position:absolute;left:0;top:0;bottom:0;background:#fff5}
  #castSay{min-height:1.3em;color:#ffd35a;text-shadow:0 0 4px #000} #castUI .row{display:flex;gap:8px}
  #castUI button{background:#2a0d3acc;color:#e6b8ff;border:1px solid #c07aff;border-radius:10px;padding:12px 16px;font:inherit;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer} #castUI button.on{background:#c07aff;color:#fff}
  #micMeter{height:8px;margin:2px 0 6px;background:#ffffff1f;border-radius:4px;overflow:hidden} #micLv{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ee08a,#ffd35a 70%,#ff4d5e)}
  #ui{z-index:7} #camPanel{max-height:calc(100vh - 70px);overflow-y:auto;box-sizing:border-box}
  #micStat,#micSay{font-size:12px;color:#ffd35a;word-break:break-all} #micSay{color:#e6b8ff}
  #hCur{position:fixed;left:0;top:0;z-index:20;width:22px;height:22px;margin:-11px 0 0 -11px;border:3px solid #ffd35a;border-radius:50%;background:#ffd35a33;box-shadow:0 0 10px #ffd35a;pointer-events:none;display:none}
  #palmRing{position:fixed;left:50%;top:50%;z-index:19;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;display:none;place-items:center;font-size:40px;pointer-events:none;
    background:radial-gradient(#061418dd 58%,transparent 60%),conic-gradient(#ffd35a var(--p,0deg),#7ae7ff33 0);box-shadow:0 0 16px #ffd35a66}
  #palmRing.on{display:grid}
  #hCur.on{display:block} #hCur.down{background:#ffd35acc;border-color:#fff}
  #menu .hHover{outline:2px solid #ffd35a;outline-offset:2px;box-shadow:0 0 12px #ffd35a88}
  /* 隠し必殺：呪文全文の表示 */
  #secret{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;display:none;text-align:center;width:max-content;max-width:92vw;max-height:86vh;overflow:hidden;padding:2.2vh 5vw;
    background:radial-gradient(closest-side,#000b,#0006 70%,transparent);font:clamp(13px,2.3vh,22px)/1.65 "Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;color:#fff;text-shadow:0 0 3px #000,0 0 10px var(--c),0 0 18px var(--c)}
  #secret.on{display:block} #secret.out{opacity:0;transition:opacity .9s}
  #secret small{display:block;font:12px sans-serif;color:var(--c);letter-spacing:.2em;margin-bottom:.5em;opacity:.9}
  #secret p{margin:0;opacity:0;animation:secLn .45s ease-out forwards}
  #secret h2{margin:.35em 0 0;font-size:2.1em;letter-spacing:.12em;color:#fff;opacity:0;animation:secTi .5s ease-out forwards}
  @keyframes secLn{from{opacity:0;transform:translateY(.5em);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
  @keyframes secTi{from{opacity:0;transform:scale(1.8);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
  #secret.live h2{margin:.1em 0 .25em} #secret .lines p{animation-duration:.3s}
  #secret b{color:var(--c);font-weight:bold;text-shadow:0 0 6px #000,0 0 14px var(--c),0 0 26px var(--c)}
  #secret p.zz{font-size:1.6em;margin:.15em 0}
  #hcList{font-size:12px;color:#e6b8ff;white-space:pre-line}
</style>
</head>
<body>
<div id="ui"><button id="camBtn">📷 カメラ設定</button> <button id="viewBtn">👁 一人称</button> <button id="ctrlBtn">🖱 マウス</button> <button id="menuBtn">☰</button>
  <div id="camPanel" hidden>
    <label>使うカメラ<select id="camSel"></select></label>
    <label><input type="checkbox" id="mir"> 左右反転</label>
    <div><button id="camApply">このカメラを使う</button> <button id="camRefresh">一覧を更新</button></div>
    <div id="camStat">USBカメラは接続後「一覧を更新」</div>
    <hr style="border:0;border-top:1px solid #7ae7ff44;margin:10px 0 4px">
    <label><input type="checkbox" id="faceOn" checked> 顔の動きで視点・照準を操作</label>
    <label>顔認識に使うカメラ<select id="faceSel"><option value="">自動（インカメラ）</option><option value="user">フロント</option><option value="environment">バック</option></select></label>
    <label>カメラの種類 <select id="faceType"><option value="auto">自動判定</option><option value="front">フロント（鏡像）</option><option value="back">バック（非鏡像）</option></select></label> <button id="faceFlip">🔄 前/後 切替</button>
    <label>感度 <input type="range" id="faceGain" min="0.5" max="3" step="0.1" value="1.5"></label>
    <label><input type="checkbox" id="facePrevOn" checked> 認識プレビューを表示</label>
    <div><button id="faceStart">顔認識を開始/再起動</button> <button id="faceCal">中心リセット (C)</button></div>
    <div id="faceStat" style="font-size:12px;color:#ffd35a"></div>
    <hr style="border:0;border-top:1px solid #7ae7ff44;margin:10px 0 4px">
    <label>🎙 詠唱に使うマイク<select id="micSel"><option value="">既定のマイク</option></select></label>
    <div id="micMeter"><i id="micLv"></i></div>
    <div><button id="micApply">このマイクを使う</button> <button id="micRefresh">一覧を更新</button></div>
    <div><button id="micTest">🎙 押している間 認識テスト</button></div>
    <div id="micStat">マイクはゲーム開始時にも自動で起動します</div>
    <div id="micSay"></div>
    <hr style="border:0;border-top:1px solid #7ae7ff44;margin:10px 0 4px">
    <label>📜 隠し呪文ファイル（.txt・複数可／画面にドロップでも可）<input type="file" id="hcFile" accept=".txt,text/plain" multiple style="width:100%;margin-top:4px"></label>
    <div><button id="hcClear">読み込んだ呪文を消す</button></div>
    <div id="hcList">まだ読み込まれていません</div>
  </div>
  <div id="faceBadge"></div><div id="wiiStat" style="margin-top:4px;font-size:12px;color:#ffd35a;text-shadow:0 0 4px #000"></div></div>
<div id="menu"><h3 style="margin:0">MENU</h3>
  <button id="mClose">▶ 再開</button><button id="mView">👁 視点: 一人称</button><button id="mFace">🔄 顔カメラ: フロント</button><button id="mCtrl">🖱 操作: マウス</button>
  <button id="jobBtn">🔁 ジョブチェンジ</button>
  <div id="jobs"><button id="jSword">⚔ 剣士</button><button id="jWiz">🪄 魔法使い</button><button id="jGun" disabled>🔫 ガンナー（準備中）</button></div>
  <label>効果音 <input type="range" id="mVol" min="0" max="1" step=".1" value=".8"></label><label>BGM <input type="range" id="mBgm" min="0" max="1" step=".05" value=".5"></label><label>Wii振り感度 <input type="range" id="mWiiTh" min="1.2" max="4" step=".1" value="2.2"><br><small style="color:#9fdcea">左ほど敏感</small></label>
  <button id="mRestart">↻ リスタート</button><button id="mTitle">⌂ タイトルへ</button>
  <small style="color:#9fdcea">✌ ピースを約1秒キープで開く / 指先でカーソル → Aで決定（スライダーはAを押したまま左右）/ M キーで開閉</small></div>
<div id="hCur"></div><div id="palmRing">✌</div>
<div id="chant"></div><div id="secret"></div>
<div id="castUI"><div id="spells"></div><div id="castSay">ボタン / Space / Wiiの十字キー↓ を押している間に呪文を唱える</div>
  <div class="row"><button id="castJa">🎙 詠唱（長押し / Space / Wii ↓）</button></div></div>
<canvas id="facePrev" width="320" height="240"></canvas>
<video id="v" autoplay playsinline muted></video>
<video id="fv" autoplay playsinline muted></video>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== GIANT SLIME RAID =====
// 詠唱: ボタン/Space/Wii十字↓を押しながら呪文 / 左クリック長押し: ガード / 右クリック: パリィ / 紫の攻撃はパリィ不可→ガード / Wii: B+振り上げ=パリィ, A長押し=ガード / A,D: 左右に回避 / V: VR(左右分割)モード切替 / 視点・照準: 顔の動き(マウスでも可) / C: 顔の中心リセット
const FONT = '"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif';
const vid = document.getElementById('v');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(70, 1, .05, 100);
camera.rotation.order = 'YXZ'; scene.add(camera);
const EYE = 1.6, HOVER = -8.5, R = 1.8;
let W, H;
function resize(){ W = innerWidth; H = innerHeight; renderer.setSize(W, H); }
resize(); addEventListener('resize', resize);
addEventListener('contextmenu', e => e.preventDefault());
scene.background = new THREE.Color(0x0b1622);
scene.add(new THREE.HemisphereLight(0xcfeaff, 0x203020, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, .9); sun.position.set(3, 8, 4); scene.add(sun);

function canvasTex(w, h, fn){ const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return new THREE.CanvasTexture(c); }
function mkSprite(text, hex, sc){
  const t = canvasTex(384, 128, (x, w, h) => {
    let f = 60; do { x.font = `bold ${f}px ${FONT}`; f -= 4; } while (x.measureText(text).width > 360 && f > 16);
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineWidth = 10; x.strokeStyle = '#000c';
    x.strokeText(text, w/2, h/2); x.fillStyle = hex; x.fillText(text, w/2, h/2);
  });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:t, transparent:true, depthTest:false }));
  s.scale.set(3*sc, sc, 1); s.renderOrder = 20; return s;
}

// ===== 床（ARでは映像の上に半透明グリッド）=====
const gridTex = canvasTex(256, 256, (x, w, h) => { x.strokeStyle = 'rgba(122,231,255,.6)'; x.lineWidth = 4; x.strokeRect(0, 0, w, h); });
gridTex.wrapS = gridTex.wrapT = THREE.RepeatWrapping; gridTex.repeat.set(10, 20);
const floorMat = new THREE.MeshBasicMaterial({ map:gridTex, transparent:true, opacity:.5, depthWrite:false });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 40), floorMat);
floor.rotation.x = -Math.PI/2; floor.position.set(0, 0, -16); scene.add(floor);
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({
  map:canvasTex(128, 128, (x, w, h) => { const g = x.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(0,0,0,.6)'); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0,0,w,h); }),
  transparent:true, depthWrite:false }));
shadow.rotation.x = -Math.PI/2; shadow.position.y = .02; scene.add(shadow);
const lane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color:0xff3a4a, transparent:true, opacity:.3, depthWrite:false }));
lane.rotation.x = -Math.PI/2; lane.visible = false; scene.add(lane);

// ===== ボス：ジャイアントスライム =====
const bossG = new THREE.Group(); scene.add(bossG);
const bGeo = new THREE.SphereGeometry(1, 40, 28), bBase = bGeo.attributes.position.array.slice();
const bMat = new THREE.MeshStandardMaterial({ color:0x5fe07a, roughness:.12, transparent:true, opacity:.86, emissive:0x0a3a18 });
bossG.add(new THREE.Mesh(bGeo, bMat));
const core = new THREE.Mesh(new THREE.SphereGeometry(.32, 16, 12), new THREE.MeshStandardMaterial({ color:0x1d9a44, emissive:0x0a5a20 }));
core.position.set(0, -.1, -.1); bossG.add(core);
const eyes = [], pupils = [];
for (const s of [-1, 1]){
  const w = new THREE.Mesh(new THREE.SphereGeometry(.15, 12, 10), new THREE.MeshBasicMaterial({ color:0xffffff }));
  w.position.set(s*.33, .22, .86);
  const p = new THREE.Mesh(new THREE.SphereGeometry(.07, 10, 8), new THREE.MeshBasicMaterial({ color:0x111111 }));
  p.position.set(0, 0, .12); w.add(p); bossG.add(w); eyes.push(w); pupils.push(p);
}
const stars = new THREE.Group(); stars.position.y = 1.35; bossG.add(stars);
for (let i = 0; i < 3; i++){ const m = new THREE.Mesh(new THREE.SphereGeometry(.12, 8, 6), new THREE.MeshBasicMaterial({ color:0xffd35a })); m.position.set(Math.cos(i*2.09)*.6, 0, Math.sin(i*2.09)*.6); stars.add(m); }
function jiggle(t, amp){
  const p = bGeo.attributes.position.array;
  for (let i = 0; i < p.length; i += 3){
    const x = bBase[i], y = bBase[i+1], z = bBase[i+2], k = 1 + amp*Math.sin(t*7 + x*4 + y*3)*Math.cos(t*5 + z*4);
    p[i] = x*k; p[i+1] = y*k; p[i+2] = z*k;
  }
  bGeo.attributes.position.needsUpdate = true; bGeo.computeVertexNormals();
}

// ===== エフェクト =====
const NP = 500, pp = new Float32Array(NP*3), pc = new Float32Array(NP*3), pv = new Float32Array(NP*3), pl = new Float32Array(NP); let pn = 0;
const pg = new THREE.BufferGeometry();
pg.setAttribute('position', new THREE.BufferAttribute(pp, 3)); pg.setAttribute('color', new THREE.BufferAttribute(pc, 3));
const pts = new THREE.Points(pg, new THREE.PointsMaterial({ size:.16, vertexColors:true, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
pts.frustumCulled = false; scene.add(pts);
function burst(v, hex, n, sp){
  const c = new THREE.Color(hex);
  for (let k = 0; k < n; k++){
    const i = pn++ % NP, a = Math.random()*6.28, b = Math.random()*3.14 - 1.57, s = sp*(.3 + Math.random());
    pp.set([v.x, v.y, v.z], i*3); pc.set([c.r, c.g, c.b], i*3); pl[i] = .4 + Math.random()*.6;
    pv.set([Math.cos(a)*Math.cos(b)*s, Math.sin(b)*s + 1, Math.sin(a)*Math.cos(b)*s], i*3);
  }
}
const rings = [], pops = [];
function ring(v, r1, hex, life = .45){
  const m = new THREE.Mesh(new THREE.RingGeometry(.85, 1, 48), new THREE.MeshBasicMaterial({ color:hex, transparent:true, blending:THREE.AdditiveBlending, depthTest:false, side:THREE.DoubleSide }));
  m.position.copy(v); m.quaternion.copy(camera.quaternion); m.renderOrder = 15; scene.add(m);
  rings.push({ m, r1, life, max:life });
}
function popup(text, hex, pos, sc = .8, life = .9, parent = scene){
  const s = mkSprite(text, hex, sc); s.position.copy(pos); parent.add(s); pops.push({ s, life, max:life, parent });
}
const popCam = (text, hex, sc = 1, life = .9) => popup(text, hex, new THREE.Vector3(0, .5, -3), sc, life, camera);
function updFX(dt){
  for (let i = 0; i < NP; i++){
    if (pl[i] <= 0){ pp[i*3+1] = -999; continue; }
    pl[i] -= dt; pv[i*3+1] -= 6*dt;
    for (let j = 0; j < 3; j++){ pp[i*3+j] += pv[i*3+j]*dt; pc[i*3+j] *= 1 - dt*1.2; }
  }
  pg.attributes.position.needsUpdate = true; pg.attributes.color.needsUpdate = true;
  for (let i = rings.length - 1; i >= 0; i--){
    const r = rings[i]; r.life -= dt; const k = Math.max(0, r.life/r.max);
    r.m.scale.setScalar(.1 + r.r1*(1-k)); r.m.material.opacity = k;
    if (r.life <= 0){ scene.remove(r.m); r.m.geometry.dispose(); r.m.material.dispose(); rings.splice(i, 1); }
  }
  for (let i = pops.length - 1; i >= 0; i--){
    const p = pops[i]; p.life -= dt; p.s.position.y += .6*dt; p.s.material.opacity = Math.min(1, p.life/p.max*2);
    if (p.life <= 0){ p.parent.remove(p.s); p.s.material.map.dispose(); p.s.material.dispose(); pops.splice(i, 1); }
  }
}

// ===== 一人称の大剣 =====
const sword = new THREE.Group(); camera.add(sword);
const steel = new THREE.MeshStandardMaterial({ color:0xdff6ff, metalness:.8, roughness:.2, emissive:0x2a6f88 });
const gold = new THREE.MeshStandardMaterial({ color:0xd8a23a, metalness:.7, roughness:.3, emissive:0x3a2a08 });
const blade = new THREE.Mesh(new THREE.BoxGeometry(.28, 3.4, .07), steel); blade.position.y = 2.1;
const edge = new THREE.Mesh(new THREE.BoxGeometry(.05, 3.4, .09), new THREE.MeshBasicMaterial({ color:0x7ae7ff })); edge.position.y = 2.1;
const tip = new THREE.Mesh(new THREE.ConeGeometry(.2, .6, 4), steel); tip.position.y = 4.1; tip.rotation.y = Math.PI/4; tip.scale.z = .25;
const guard = new THREE.Mesh(new THREE.BoxGeometry(1.3, .16, .24), gold); guard.position.y = .35;
const grip = new THREE.Mesh(new THREE.CylinderGeometry(.08, .08, .8, 10), new THREE.MeshStandardMaterial({ color:0x4a2a1a })); grip.position.y = -.1;
const pommel = new THREE.Mesh(new THREE.SphereGeometry(.14, 12, 10), gold); pommel.position.y = -.55;
sword.add(blade, edge, tip, guard, grip, pommel);
for (const o of [blade, edge, tip, guard]) o.visible = false;   // 剣 → 杖
const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.07, .09, 3.4, 10), new THREE.MeshStandardMaterial({ color:0x6a4426 })); shaft.position.y = 1.4;
const orb = new THREE.Mesh(new THREE.SphereGeometry(.3, 16, 12), new THREE.MeshBasicMaterial({ color:0x8fe4ff })); orb.position.y = 3.35;
const claw = new THREE.Mesh(new THREE.TorusGeometry(.38, .05, 8, 20), gold); claw.position.y = 3.35; claw.rotation.x = 1.2;
sword.add(shaft, orb, claw);
sword.position.set(.9, -1.1, -1.9); sword.rotation.set(-.95, 0, .3);
const shield = new THREE.Group(); shield.position.z = -2.3; shield.visible = false; camera.add(shield);
shield.add(new THREE.Mesh(new THREE.CircleGeometry(.9, 32), new THREE.MeshBasicMaterial({ color:0xffd35a, transparent:true, opacity:.25, blending:THREE.AdditiveBlending, depthTest:false })));
shield.add(new THREE.Mesh(new THREE.RingGeometry(.85, .95, 40), new THREE.MeshBasicMaterial({ color:0xffd35a, transparent:true, blending:THREE.AdditiveBlending, depthTest:false })));

function bossAI(dt){

    }
  } else if (B.s === 'wind'){
    if (B.t > .3) B.x += (P.x - B.x)*Math.min(1, dt*5);
    if (B.t <= 0){ B.s = 'charge'; B.hit = false; }
  } else if (B.s === 'charge'){
    B.z += [17, 20, 24][ph-1]*dt;

}

function onWii(e){

  const pressStart = (A && !wii.pA) || (plus && !wii.pPlus), pressHome = home && !wii.pHome;
  wii.pA = A; wii.pPlus = plus; wii.pHome = home; wii.a = A; wii.b = Bb;

  if (pressA && menuOn) hcClick();   // 指先カーソルで指している項目を決定
  // 加速度（0g=128, 1g≒26）
  const x = (d.getUint8(2) - 128)/26, y = (d.getUint8(3) - 128)/26, z = (d.getUint8(4) - 128)/26, m = Math.hypot(x, y, z);

  const gl = Math.hypot(wii.gx, wii.gy, wii.gz) || 1;

  const upTh = wii.th*.65;
  if (up < -upTh*.7) wii.lastNeg = now;   // 直前に下向きの勢いがあった = 振り下ろしの減速なので除外

// ===== 隠し必殺：呪文ファイルから読み込む長詠唱 =====
// 呪文の本文はHTMLに埋め込まず、プレイヤーが用意した .txt を読み込む（ブラウザに保存して次回も使う）
// 1つのファイルに複数パターンがある時の区切り：
//   ・「エクスプロージョン！」だけの行があれば、その行までで1パターン
//   ・「---」だけの行があれば、そこで区切る
//   ・空行で区切った各ブロックが3行以上なら、ブロックごとに1パターン（短いブロックばかりなら全体で1つ）
// 前から順に3行（他のパターンと冒頭が同じなら、違いが出る行まで）聞き取れたら発動。1行だけなら聞き漏らしてもOK
const HC_KEY = 'cw_hidden_chants', HC_MULT = 2, HC_CD = 60;
let hcFiles = [], SECRETS = [];
const hnorm = t => t.normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '')
  .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 96)).replace(/[ーぁぃぅぇぉっゃゅょ]/g, '');
function grams(t, n){ const m = new Map(); if (t.length < n){ if (t) m.set(t, 1); return [m, t ? 1 : 0]; }
  for (let i = 0; i + n <= t.length; i++){ const g = t.substr(i, n); m.set(g, (m.get(g) || 0) + 1); } return [m, t.length - n + 1]; }
function dice(A, B){ let x = 0; for (const [k, v] of B[0]){ const a = A[0].get(k); if (a) x += Math.min(a, v); } return 2*x/(A[1] + B[1] || 1); }
// 認識結果は漢字/かなの揺れがあるので、2文字単位と1文字単位の一致度を半々で見る
const lnSim = (ln, w) => .5*dice(ln.bi, grams(w, 2)) + .5*dice(ln.uni, grams(w, 1));
let hcScore = 0;   // 一致した行の似ている度合いの合計（冒頭が同じパターンの見分けに使う）
function findLine(full, from, ln){
  const L = ln.s.length; if (!L) return from;
  const th = L <= 4 ? .56 : L <= 8 ? .5 : .46, lo = Math.max(1, Math.round(L*.6)), hi = Math.round(L*1.4) + 1;
  for (let st = from; st + lo <= full.length; st++){
    let bs = 0, be = -1;
    for (let len = lo; len <= hi && st + len <= full.length; len++){ const sc = lnSim(ln, full.substr(st, len)); if (sc > bs){ bs = sc; be = st + len; } }
    if (bs >= th){ hcScore += bs; return be; }
  }
  return -1;
}
function hcMatch(c, full){
  let pos = 0, got = 0, skip = 0; hcScore = 0;
  for (let i = 0; i < c.L.length && got < c.need; i++){
    const r = findLine(full, pos, c.L[i]);
    if (r < 0){ if (++skip > 1) break; continue; }
    got++; pos = r;
  }
  return got + hcScore/100;   // 行数が同じなら、より似ている方を選ぶ
}
function hiddenCheck(s){
  if (!SECRETS.length) return false;
  let full = '';
  for (let k = s.ign; k < s.txt.length; k++){
    const a = s.txt[k]; if (!a || !a[0]) continue;
    let t = hnorm(a[0]);
    if (k === s.ign && s.hpre){ if (!t.startsWith(s.hpre)) continue; t = t.slice(s.hpre.length); }
    full += t;
  }
  full = full.slice(-260);
  if (full.length < 2) return false;
  let best = null, bm = 0, mx = 0;
  for (const c of SECRETS){
    const m = hcMatch(c, full); mx = Math.max(mx, Math.floor(m));
    if (Math.floor(m) >= c.need && m > bm){ best = c; bm = m; }
  }
  s.hp = mx;
  if (!best && mx >= 2 && !s.hint){ s.hint = 1; popCam('…何かが共鳴している', '#e6b8ff', .7, 1.2); burst(orbPos(), 0xe6b8ff, 20, 2); }
  if (!best) return false;
  chantCut(s);
  if (CD[best.id] > 0){ popCam(best.title + ' 待機中 ' + Math.ceil(CD[best.id]) + 's', '#aaaaaa', .6, .9); return true; }
  castHidden(best); return true;
}

// ---- 呪文ファイルの読み込み ----
function hcSplit(text){
  const ls = text.replace(/^\uFEFF/, '').replace(/\r/g, '').split('\n').map(l => l.replace(/^[\s\u3000]+|[\s\u3000]+$/g, ''));
  const isEx = l => /^エクスプロージョン[!！]*$/.test(l.normalize('NFKC').replace(/\s/g, ''));
  let out = [];
  if (ls.some(l => /^-{3,}$/.test(l))){ let cur = []; for (const l of ls){ if (/^-{3,}$/.test(l)){ out.push(cur); cur = []; } else if (l) cur.push(l); } out.push(cur); }
  else if (ls.some(isEx)){ let cur = []; for (const l of ls){ if (!l) continue; cur.push(l); if (isEx(l)){ out.push(cur); cur = []; } } out.push(cur); }
  else {
    const bl = []; let cur = []; for (const l of ls){ if (l) cur.push(l); else if (cur.length){ bl.push(cur); cur = []; } } if (cur.length) bl.push(cur);
    out = bl.length > 1 && bl.every(b => b.length >= 3) ? bl : [bl.flat()];
  }
  return out.filter(c => c.length);
}
function hcType(lines, all){
  const t = lines.join('');
  if (/エクスプロージョン/.test(t)) return { fx:'explosion', title:'エクスプロージョン', hex:0xff3a1a };
  if (/黒棺/.test(all)) return { fx:'coffin', title:'黒棺', hex:0xb04dff };
  if (/剣|blade/i.test(all)) return { fx:'swords', title:'Unlimited Blade Works', hex:0xb8d0ff };
  return { fx:'generic', title:null, hex:0xffd35a };
}
function hcBuild(){
  SECRETS = [];
  for (const f of hcFiles){
    const base = f.name.replace(/\.[^.]+$/, '');
    hcSplit(f.text).forEach((lines, i) => {
      const ty = hcType(lines, f.text);
      SECRETS.push({ id:'hc_' + SECRETS.length, file:f.name, lines, title:ty.title || base, fx:ty.fx, hex:ty.hex,
        L:lines.map(l => { const s = hnorm(l); return { s, bi:grams(s, 2), uni:grams(s, 1) }; }) });
    });
  }
  for (const c of SECRETS){   // 冒頭が同じパターンがあれば、違いが出る行まで聞く
    let k = Math.min(3, c.L.length);
    const same = (o, n) => o !== c && o.L.length >= n && c.L.slice(0, n).every((l, j) => l.s === o.L[j].s);
    while (k < c.L.length && SECRETS.some(o => same(o, k))) k++;
    c.need = k; CD[c.id] = CD[c.id] || 0; CDMAX[c.id] = HC_CD;
  }
  const by = {}; for (const c of SECRETS) by[c.file] = (by[c.file] || 0) + 1;
  $('hcList').textContent = SECRETS.length ? Object.entries(by).map(([f, n]) => `✔ ${f}：${n}パターン`).join('\n') + `\n合計 ${SECRETS.length} 個（威力は必殺の${HC_MULT}倍）` : 'まだ読み込まれていません';
}
function hcSave(){ try { localStorage.setItem(HC_KEY, JSON.stringify(hcFiles)); } catch (e){} }
function hcDecode(buf){
  let t = new TextDecoder('utf-8').decode(buf);
  if (t.includes('\uFFFD')){ try { t = new TextDecoder('shift_jis').decode(buf); } catch (e){} }
  return t;
}
async function hcLoad(files){
  for (const f of files){
    if (!/\.txt$/i.test(f.name) && f.type !== 'text/plain') continue;
    const text = hcDecode(await f.arrayBuffer());
    hcFiles = hcFiles.filter(x => x.name !== f.name).concat({ name:f.name, text });
  }
  hcBuild(); hcSave();
}
$('hcFile').onchange = e => { hcLoad([...e.target.files]); e.target.value = ''; };
$('hcClear').onclick = () => { hcFiles = []; hcBuild(); hcSave(); };
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) hcLoad([...e.dataTransfer.files]); });
try { const v = JSON.parse(localStorage.getItem(HC_KEY) || '[]'); if (Array.isArray(v)) hcFiles = v; } catch (e){}
hcBuild();

let secT = 0;
function hideSecret(){ clearTimeout(secT); const el = $('secret'); el.className = ''; el.innerHTML = ''; }
function showSecret(title, lines, hex, label){
  const el = $('secret'); clearTimeout(secT); el.className = ''; el.innerHTML = ''; void el.offsetWidth;
  el.style.setProperty('--c', hx(hex));
  const step = Math.min(.14, 1.8/Math.max(1, lines.length));
  if (label){ const sm = document.createElement('small'); sm.textContent = label; el.append(sm); }
  lines.forEach((l, i) => { const p = document.createElement('p'); p.textContent = l; p.style.animationDelay = (i*step) + 's'; el.append(p); });
  if (title){ const h = document.createElement('h2'); h.textContent = title; h.style.animationDelay = (lines.length*step + .1) + 's'; el.append(h); }
  el.classList.add('on');
  const stay = Math.min(10, 3 + lines.length*.35) * 1000;
  secT = setTimeout(() => { el.classList.add('out'); secT = setTimeout(hideSecret, 950); }, stay);
  return lines.length*step + .3;   // 全行が出そろうまでの秒数
}

function hiNode(tag, text, word, cls){
  const el = document.createElement(tag); if (cls) el.className = cls;
  const i = word ? text.indexOf(word) : -1;
  if (i < 0){ el.textContent = text; return el; }
  const b = document.createElement('b'); b.textContent = word;
  el.append(text.slice(0, i), b, text.slice(i + word.length)); return el;
}
function liveOpen(type, hex, label){
  hideSecret(); const el = $('secret'); el.style.setProperty('--c', hx(hex)); el.classList.add('on', 'live');
  const sm = document.createElement('small'); sm.textContent = label; el.append(sm);
  const ls = document.createElement('div'); ls.className = 'lines'; el.append(ls);
  live = { type, hex, el, ls, n:0, word:'', z:'', needName:false, tm:0 };
  liveTouch(); colR = hex; burst(orbPos(), hex, 30, 3);
}
function liveTouch(){ clearTimeout(live.tm); live.tm = setTimeout(() => { if (!live) return; popCam('詠唱が途切れた…', '#aaaaaa', .7, 1); liveEnd(); }, LIVE_IDLE); }
function liveEnd(){ if (!live) return; clearTimeout(live.tm); live = null; const el = $('secret'); el.classList.add('out'); clearTimeout(secT); secT = setTimeout(hideSecret, 950); }
function liveAdd(node){
  live.ls.append(node); while (live.ls.children.length > 7) live.ls.firstChild.remove();
  live.n++; burst(orbPos(), live.hex, 8, 2);
}
function liveBig(text, word, sc){   // でかい見出し（プレイヤーの言葉）
  const h = hiNode('h2', text, word); h.style.fontSize = sc + 'em'; live.el.insertBefore(h, live.ls); return h;
}
function liveSeg(s, k){
  if (state !== 'play' || menuOn) return false;
  const raw = (s.txt[k][0] || '').replace(/\s+/g, ''); if (!raw) return false;
  const h = hnorm(raw);
  if (!live){
    let m;
    if ((m = raw.match(/(?:我が|わが|吾が|我)(?:名|な)[はわ](.*)/))){
      if (CD.live_nanori > 0){ popCam('名乗り 待機中 ' + Math.ceil(CD.live_nanori) + 's', '#aaaaaa', .6, .8); return true; }
      liveOpen('nanori', 0xff3a1a, '名乗り');
      const name = m[1].split(/[、。！!？?]|随一/)[0].slice(0, 12);
      if (name) liveName(name, raw); else live.needName = true;
      return true;
    }
    if ((m = raw.match(/(?:体|身体|からだ)[はわ](.{1,10}?)で(?:でき|出来)て[いぃ]?る/))){
      if (CD.live_body > 0){ popCam('待機中 ' + Math.ceil(CD.live_body) + 's', '#aaaaaa', .6, .8); return true; }
      const w = m[1]; liveOpen('body', wordHex(w), '詠唱'); live.word = w; live.hex = wordHex(w);
      liveBig(raw, w, 1.7); popCam(w, hx(live.hex), 1.2, 1.2);
      return true;
    }
    return false;
  }
  liveTouch();
  if (live.type === 'nanori'){
    if (live.needName){ live.needName = false; liveName(raw.split(/[、。！!？?]|随一/)[0].slice(0, 12), raw); return true; }
    const bang = h.search(/えくすぷろ|くすぷろじょん|explosion/);
    const z = raw.match(/([^、。！!？?]{1,8}?)魔法/);
    const zw = z ? z[1].split(/[はがを]/).pop() : '';
    if (zw && !live.z && !/^[のな]|の$/.test(zw)){ live.z = zw; live.hex = wordHex(zw); live.el.style.setProperty('--c', hx(live.hex)); liveAdd(hiNode('p', raw, zw + '魔法', 'zz')); }
    else if (bang < 0 || h.length > 10) liveAdd(hiNode('p', raw, live.z));
    if (bang >= 0) liveFire();
    return true;
  }
  // body：終わりの「○○で出来ていた」
  const e = raw.match(/^(.*?)で(?:でき|出来)て[いぃ]?た/);
  if (e){
    const cap = e[1].split(/きっと|は/).pop(), a = hnorm(cap), b = hnorm(live.word);
    const ok = a && b && (a.includes(b) || b.includes(a) || dice(grams(a, 1), grams(b, 1)) >= .6);
    if (ok){ liveAdd(hiNode('p', raw, cap, 'zz')); liveFire(cap); }
    else { liveAdd(hiNode('p', raw, cap)); popCam(`「${cap}」…${live.word} じゃない！`, '#aaaaaa', .7, 1.2); }
    return true;
  }
  liveAdd(hiNode('p', raw, live.word));
  return true;
}
function liveName(name, raw){
  live.word = name;
  const h = document.createElement('h2'); h.textContent = name; h.style.fontSize = '3.2em'; live.el.insertBefore(h, live.ls);
  liveAdd(hiNode('p', raw, name));
  popCam(name, '#ffd35a', 1.4, 1.4); shake = Math.max(shake, .2);
}
function liveFire(endWord){
  const L = live, id = 'live_' + L.type; clearTimeout(L.tm); live = null;
  CD[id] = LIVE_CD; colR = L.hex; kick = .25; flash = .7; flashM.material.color.set(0xffffff); ring(orbPos(), 5, L.hex, .7); burst(orbPos(), L.hex, 90, 7); wiiRumble(300);
  if (L.type === 'nanori'){ const t = document.createElement('h2'); t.textContent = 'エクスプロージョン！'; t.style.fontSize = '2.6em'; L.el.append(t); }
  else { const t = document.createElement('h2'); t.textContent = endWord || L.word; t.style.fontSize = '3.4em'; L.el.append(t); }
  if (B.s !== 'dead'){ B.s = 'knock'; B.stun = true; B.t = 3.5; B.vz = 0; lane.visible = false; P.armed = false; }
  let d = ULTS[0].dmg*HC_MULT;
  if (P.counter > 0){ d += P.cBig; P.counter = 0; popup('COUNTER!!', '#ffd35a', V3(0, -.4, -3), 1.1, 1, camera); }
  later(500, () => {
    if (L.type === 'nanori') HC_FX.explosion(d);
    else if (isBlade(L.word)) HC_FX.swords(d);
    else wordRain(d, L.word, L.hex);
  });
  clearTimeout(secT); secT = setTimeout(() => { L.el.classList.add('out'); secT = setTimeout(hideSecret, 950); }, 4500);
}
// 剣以外なら、その言葉そのものがボスに降り注ぐ（例：体はプリンで出来ている → 「プリン」が降ってくる）
function wordRain(d, word, hex){
  const N = 30, dur = 3.2, g = new THREE.Group(), base = mkSprite(word, hx(hex), .9), geo = base.geometry.clone(), it = [];
  for (let i = 0; i < N; i++){
    const sp = new THREE.Sprite(base.material); sp.geometry = geo; sp.scale.copy(base.scale); sp.renderOrder = 16; sp.visible = false; g.add(sp);
    it.push({ sp, t0:i*.07 + Math.random()*.08, from:V3((Math.random()-.5)*10, 6 + Math.random()*4, 1 + Math.random()*2), off:V3((Math.random()-.5)*3.4, .5 + Math.random()*1.8, (Math.random()-.5)*2.4), hit:false, i });
  }
  addUfx(g, dur, 1, (k) => {
    const tt = k*dur;
    for (const s of it){
      const kk = (tt - s.t0)/.4; if (kk < 0) continue;
      const from = s.from.clone(); from.x += P.x; const to = V3(bossG.position.x, 0, bossG.position.z).add(s.off);
      s.sp.visible = kk < 1.6; s.sp.position.lerpVectors(from, to, Math.min(1, kk));
      if (kk >= 1 && !s.hit){ s.hit = true; burst(to, hex, 12, 4); if (s.i % 6 === 5){ ultHit(d/5, to); shake = Math.max(shake, .35); wiiRumble(120); } }
    }
  }, () => { ring(bossG.position, 8, hex, .6); burst(bossG.position, hex, 100, 10); });
}

function castUlt(u){
  CD[u.id] = u.cd; for (const c of u.cps){ c.lit = false; c.el.classList.remove('lit'); } ultDraw(u);
  colR = u.hex; kick = .25; flash = .6; flashM.material.color.set(0xffffff);
  popCam(u.n + '!!', hx(u.hex), 1.3, 2); popup(u.en, '#ffffff', V3(0, -.15, -3), .6, 1.8, camera);
  ring(orbPos(), 4, u.hex, .6); burst(orbPos(), u.hex, 60, 6);
  let d = u.dmg; if (P.counter > 0){ d += P.cBig; P.counter = 0; popup('COUNTER!!', '#ffd35a', V3(0, -.4, -3), 1.1, 1, camera); }
  ULT_FX[u.id](d); wiiRumble(250);
}
function disposeObj(o){ o.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); }); }
function clearFx(){
  for (const p of projs){ scene.remove(p.m); p.m.geometry.dispose(); p.m.material.dispose(); } projs.length = 0;
  for (const f of ufx){ scene.remove(f.o); disposeObj(f.o); } ufx.length = 0;
}
function wizReset(){
  clearFx(); for (const k in CD) CD[k] = 0;
  P.aias = 0; B.shy = 0; setAias(0); if (live){ clearTimeout(live.tm); live = null; } hideSecret();
  for (const u of ULTS){ for (const c of u.cps){ c.lit = false; c.el.classList.remove('lit'); } ultDraw(u); }
}
function wizUpdate(dt){
  const on = state === 'play' && !menuOn;
  if (state !== 'play' && (projs.length || ufx.length)) clearFx();
  for (const k in CD){ if (on) CD[k] = Math.max(0, CD[k] - dt); if (pills[k]) pills[k].style.width = (CD[k]/CDMAX[k]*100) + '%'; }
  for (const u of ULTS){ u.cdb.style.width = (CD[u.id]/u.cd*100) + '%'; ultDraw(u); }
  const c = P.counter > 0 ? 0xffd35a : colR; orb.material.color.setHex(c); orb.scale.setScalar(hold ? (1.3 + .2*Math.sin(performance.now()/100)) : 1);
  if (hold && Math.random() < .4) burst(orbPos(), c, 2, 1.5);
  if (!on) return;
  const to = bossAt();
  for (let i = projs.length - 1; i >= 0; i--){
    const p = projs[i]; p.t += dt; p.m.visible = p.t >= 0; if (p.t < 0) continue;
    const k = Math.min(1, p.t/p.dur); p.m.position.lerpVectors(p.from, to.clone().add(p.off), k); p.m.position.y += Math.sin(k*Math.PI);
    if (p.sp.blade) p.m.rotation.z += dt*25; burst(p.m.position, p.sp.hex, 1, 1);
    if (k >= 1){
      scene.remove(p.m); p.m.geometry.dispose(); p.m.material.dispose(); projs.splice(i, 1);
      if (B.s !== 'dead'){ const at = p.m.position.clone(); hurtBoss(p.dmg, at, !!p.sp.big); ring(at, p.sp.big ? 4 : 2.2, p.sp.hex, .4); burst(at, p.sp.hex, p.sp.big ? 40 : 18, 6); }
    }
  }
  for (let i = ufx.length - 1; i >= 0; i--){
    const f = ufx[i]; f.t += dt; const k = Math.min(1, f.t/f.dur); f.step(k, f.o);
    if (!f.hit && k >= f.hitK){ f.hit = true; f.onHit(); }
    if (k >= 1){ scene.remove(f.o); disposeObj(f.o); ufx.splice(i, 1); }
  }
}

// ===== マイク（カメラ設定パネル内）=====
// 音声認識は選んだマイクの音声トラックを渡して開始する。ブラウザが未対応ならOS既定のマイクが使われる
let micStream = null, micCtx = null, micSrc = null, micAn = null, micBuf = null;
const micSel = $('micSel');
async function listMics(){
  try {
    const ds = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput'), cur = micSel.value;
    micSel.innerHTML = '<option value="">既定のマイク</option>';
    ds.filter(d => d.deviceId && d.deviceId !== 'default').forEach((d, i) => { const o = document.createElement('option'); o.value = d.deviceId; o.textContent = d.label || ('マイク ' + (i+1)); micSel.appendChild(o); });
    micSel.value = [...micSel.options].some(o => o.value === cur) ? cur : '';
  } catch (e){ $('micStat').textContent = 'マイク一覧を取得できません'; }
}
async function openMic(id){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ $('micStat').textContent = 'HTTPS か localhost で開いてください'; return false; }
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = null; if (micSrc){ try { micSrc.disconnect(); } catch (e){} micSrc = null; }
  try { micStream = await navigator.mediaDevices.getUserMedia({ audio:id ? { deviceId:{ exact:id } } : true, video:false }); }
  catch (e){ $('micStat').textContent = 'マイク起動失敗: ' + e.name + '（許可なし／他アプリが使用中）'; return false; }
  const tr = micStream.getAudioTracks()[0];
  $('micStat').textContent = '使用中: ' + (tr.label || 'マイク') + (SRc ? '' : '（このブラウザは音声認識に未対応）');
  try {
    micCtx = micCtx || new AudioContext(); if (micCtx.state === 'suspended') micCtx.resume();
    micSrc = micCtx.createMediaStreamSource(micStream); micAn = micCtx.createAnalyser(); micAn.fftSize = 512; micSrc.connect(micAn); micBuf = new Uint8Array(micAn.fftSize);
  } catch (e){}
  await listMics(); const did = tr.getSettings().deviceId; if (id && did) micSel.value = did;
  if (hold){ castUp(); castDown(); }   // 詠唱中に切り替えたら新しいマイクで聞き直す
  return true;
}
function micMeter(){
  if (!micAn || $('camPanel').hidden) return;
  micAn.getByteTimeDomainData(micBuf); let s = 0; for (const v of micBuf){ const x = (v - 128)/128; s += x*x; }
  $('micLv').style.width = Math.min(100, Math.sqrt(s/micBuf.length)*400) + '%';
}
function recStart(r){
  const tr = micStream && micStream.getAudioTracks()[0];
  if (tr && tr.readyState === 'live'){ try { r.start(tr); return; } catch (e){} }
  try { r.start(); } catch (e){}
}
$('micApply').onclick = () => openMic(micSel.value || null);
$('micRefresh').onclick = () => micStream ? listMics() : openMic(null);
{ const f = $('camBtn').onclick; $('camBtn').onclick = () => { f(); if (!$('camPanel').hidden) listMics(); }; }

// ===== 詠唱（押している間だけ音声認識）=====
// 通常魔法は区切りごとに照合。必殺のチェックポイントは途中経過(interim)でもすぐ光らせる
function say(t){ $('castSay').textContent = t; $('micSay').textContent = t; }
function castDown(){
  if (hold) return;
  if (!SRc){ say('このブラウザは音声認識に未対応です（Chrome / Edge を使用）'); return; }
  hold = true; $('castJa').classList.add('on');
  const s = { txt:[], done:{}, tm:{}, base:0, ign:0, pre:null, hpre:null, hp:0, hint:0 }, r = rec = new SRc();
  r.lang = 'ja-JP'; r.continuous = true; r.interimResults = true; r.maxAlternatives = 3;
  r.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++){
      const k = s.base + i; s.txt[k] = [...e.results[i]].map(a => a.transcript); clearTimeout(s.tm[k]);
      if (e.results[i].isFinal) evalSeg(s, k); else s.tm[k] = setTimeout(() => evalSeg(s, k), 450);
    }
    chantCheck(s);
    say('🎙 ' + s.txt.map(a => a && a[0]).filter(Boolean).join(' '));
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') say('マイクを許可してください');
    else if (e.error === 'audio-capture') say('マイクが見つかりません（📷カメラ設定 → マイク）');
    else if (e.error === 'network') say('音声認識サーバーに接続できません（ネット接続を確認）');
  };
  r.onend = () => { if (hold && rec === r){ s.base = s.txt.length; recStart(r); } };
  say('🎙 聞いています…'); recStart(r);
}
function evalSeg(s, k){
  if (s.done[k] || !s.txt[k]) return; s.done[k] = 1;
  if (k < s.ign) return;
  if (liveSeg(s, k)) return;   // 名乗り爆裂 / 体は○○ の自由詠唱中
  const t = s.txt[k].map(norm);
  if (t.some(y => ALLRX.some(rx => rx.test(y)))) return;   // 必殺の詠唱中の言葉は通常魔法にしない
  if (s.hp > 0) return;   // 隠し呪文を唱えている途中も通常魔法にしない
  const sp = SPm.find(x => t.some(y => x.rx.test(y))); if (sp) cast(sp);
}
function castUp(){ hold = false; $('castJa').classList.remove('on'); const r = rec; rec = null; try { r && r.stop(); } catch (e){} }
for (const id of ['castJa', 'micTest']){
  const b = $(id); b.onpointerdown = e => { e.preventDefault(); b.setPointerCapture(e.pointerId); castDown(); };
  b.onpointerup = b.onpointercancel = () => castUp();
}
addEventListener('keydown', e => { if (e.repeat || menuOn) return; if (e.code === 'Space'){ e.preventDefault(); castDown(); } });
addEventListener('keyup', e => { if (e.code === 'Space') castUp(); });
// ボタンをクリックした後にフォーカスが残ると Space が効かなくなるので外す
addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b) b.blur(); });

function startBattle(){ reset(); state = 'play'; setMsg(null); bgmPlay(true); }
function startGame(){
  (async () => { if (!camStream) await openCam(camSel.value || null); if (!micStream) await openMic(micSel.value || null); if (face.on && !face.stream) startFace(); else faceRecenter(); })();
  startBattle();
}
addEventListener('mousedown', e => {
  if (state === 'play' && bgm.paused && !menuOn) bgmPlay();
  if (menuOn) return;
  setMouse(e);
  if (state !== 'play'){
    if (state !== 'title' && performance.now() - endAt < 600) return;
    startGame(); return;
  }
  if (ctl.mode !== 'mouse') return;   // Wiiモード中はクリックで戦闘操作しない
  if (e.button === 0){ mdn.on = true; mdn.t = performance.now(); }   // 長押し=ガード（魔法使いは左クリックで攻撃しない）
  else if (e.button === 2) parry();
});
addEventListener('mouseup', e => {
  if (e.button !== 0 || !mdn.on) return;
  mdn.on = false;
});

let last = performance.now();
function loop(now){
  const dt = Math.min(.033, (now - last)/1000); last = now;
  faceStep(now); handStep(now); hcStep(now, dt); palmUI(now); faceDraw(); micMeter(); update(dt); render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// タイトル画面(parytitle.html)から ?start=1 で来たら自動スタート
if (/[?&]start=1/.test(location.search)) setTimeout(() => dispatchEvent(new MouseEvent('mousedown', { button:0, clientX:innerWidth/2, clientY:innerHeight/2 })), 500);
