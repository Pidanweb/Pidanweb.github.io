<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRM アバターカラオケライブ</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .bar{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:rgba(0,0,0,.55);z-index:5;align-items:center;font-size:13px}
  button,label.btn{background:#2b2f3a;color:#fff;border:1px solid #555;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
  button:hover,label.btn:hover{background:#3a4050}
  button:disabled{opacity:.4;cursor:default}
  #rec.on{background:#c0202a;border-color:#ff6b6b}
  input[type=file]{display:none}
  #panel{position:fixed;left:8px;bottom:8px;z-index:5;background:rgba(0,0,0,.55);padding:8px;border-radius:10px;font-size:12px;max-width:340px}
  #video{width:240px;display:block;border-radius:6px;transform:scaleX(-1);background:#000}
  #panel audio{width:240px;margin-top:6px}
  #panel div{margin-top:4px}
  #status{margin-left:auto;opacity:.85}
  select{background:#2b2f3a;color:#fff;border:1px solid #555;border-radius:8px;padding:6px 8px;font-size:13px;max-width:220px}
  .seg{display:inline-flex;gap:2px}
  .seg button.act{background:#4a5bd0;border-color:#8fa0ff}
  #vwrap{position:relative;width:240px}
  #overlay{position:absolute;left:0;top:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}
  #legend{font-size:11px;opacity:.8}
  #dl{display:none;color:#8fd;font-weight:bold}
  input[type=text]{background:#2b2f3a;color:#fff;border:1px solid #555;border-radius:8px;padding:7px 10px;font-size:13px;width:260px}
  #ytbox{margin-top:6px}
  #panel{max-height:calc(100% - 80px);overflow:auto}
  #drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:9;font-size:24px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="drop">VRMファイルをドロップ</div>

<div class="bar">
  <label class="btn">① VRM選択<input type="file" id="vrmFile" accept=".vrm"></label>
  <button id="camBtn">② カメラ＆マイク開始</button>
  <select id="camSel" title="カメラ選択"><option value="">既定のカメラ</option></select>
  <select id="micSel" title="マイク選択"><option value="">既定のマイク</option></select>
  <label>負荷 <select id="perfSel" title="重いときは軽量に"><option value="high">高精度</option><option value="std" selected>標準</option><option value="low">軽量</option></select></label>
  <label class="btn">③ 伴奏ファイル<input type="file" id="bgmFile" accept="audio/*"></label>
  <input type="text" id="urlIn" placeholder="伴奏URL (mp3/ogg/mp4の直リンク or YouTube)">
  <button id="urlBtn">URL読込</button>
  <button id="tabAudio" style="display:none" title="YouTubeの音をマイクと一緒に録画へ入れます(Chrome/Edge)">🔊 YouTube音声を録画に入れる</button>
  <button id="rec" disabled>● 録画開始</button>
  <a id="dl" href="#">⬇ 録画を保存</a>
  <label><input type="checkbox" id="mirror"> 左右反転</label>
  <span class="seg" title="トラッキング範囲"><button id="modeUpper">上半身</button><button id="modeFull" class="act">全身</button></span>
  <label><input type="checkbox" id="showBones" checked> カメラ映像にボーン</label>
  <label><input type="checkbox" id="showAvBones"> アバターのボーン</label>
  <label><input type="checkbox" id="handTrack" checked> ハンドトラッキング</label>
  <label>背景 <input type="color" id="bgColor" value="#1b1030"></label>
  <label class="btn">背景画像<input type="file" id="bgImg" accept="image/*"></label>
  <span id="status">VRMを読み込んでください</span>
</div>

<div id="panel">
  <div id="vwrap"><video id="video" playsinline muted></video><canvas id="overlay"></canvas></div>
  <div id="legend">ボーンの色: 緑=信頼高 / 黄=中 / 赤=低 / 水色=手</div>
  <div id="ytbox" style="display:none"><div id="ytplayer"></div></div>
  <audio id="bgm" controls></audio>
  <audio id="bgmPlain" controls style="display:none"></audio>
  <div>伴奏音量 <input type="range" id="bgmVol" min="0" max="1" step="0.01" value="0.7"></div>
  <div>マイク音量 <input type="range" id="micVol" min="0" max="2" step="0.01" value="1"></div>
  <div>🎤 <span id="micInfo">未接続</span> <button id="micBtn" style="padding:3px 8px">マイク接続</button></div>
  <div style="height:6px;background:#333;border-radius:3px;overflow:hidden;margin-top:3px"><div id="micLvl" style="height:100%;width:0;background:#4f8"></div></div>
  <div><label><input type="checkbox" id="monitor"> マイクを自分で聞く(イヤホン必須)</label></div>
  <div><label><input type="checkbox" id="zoomOn" checked> 近づくとアバターがアップ</label></div>
  <div>寄り感度 <input type="range" id="zoomGain" min="0.5" max="3" step="0.1" value="1.5"> <button id="zoomCal" style="padding:3px 8px">基準位置を今に</button></div>
  <div id="zoomInfo">距離: -</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.0/lib/three-vrm.module.min.js"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { PoseLandmarker, FaceLandmarker, HandLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const $ = id => document.getElementById(id);
const statusEl = $('status');
const say = t => statusEl.textContent = t;

/* ---------- three.js ---------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color($('bgColor').value);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
// フレーミング(全身 / 上半身)
const FRAME = { full: { pos: [0, 0.95, 4.4], look: [0, 0.85, 0] }, upper: { pos: [0, 1.3, 2.2], look: [0, 1.25, 0] } };
let mode = 'full';
const camPos = new THREE.Vector3(...FRAME.full.pos), camLook = new THREE.Vector3(...FRAME.full.look);
const tgtPos = camPos.clone(), tgtLook = camLook.clone();
camera.position.copy(camPos); camera.lookAt(camLook);
scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const dl = new THREE.DirectionalLight(0xffffff, 2.2); dl.position.set(1, 2, 3); scene.add(dl);
const stage = new THREE.Mesh(new THREE.CircleGeometry(1.1, 48),
  new THREE.MeshStandardMaterial({ color: 0x3a2a6a, emissive: 0x2a1a5a, roughness: .5 }));
stage.rotation.x = -Math.PI / 2; stage.position.y = -0.005; scene.add(stage);

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  // 横長でも縦長でも全身が収まるようにFOV調整
  camera.fov = camera.aspect < 0.7 ? 2 * Math.atan(Math.tan(15 * Math.PI / 180) * 0.7 / camera.aspect) * 180 / Math.PI : 30;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- 負荷プリセット ---------- */
// dpr: 描画解像度の上限 / skip: Nフレームに1回だけ検出 / alt: ポーズと手を交互に検出 / frameMs: 描画FPS上限(0=無制限)
const PERF = { high: { dpr: 2, skip: 1, alt: false, frameMs: 0 }, std: { dpr: 1.5, skip: 1, alt: true, frameMs: 0 }, low: { dpr: 1, skip: 2, alt: true, frameMs: 33 } };
let P = PERF.std, lastRender = 0, detN = 0;
function applyPerf(k) { P = PERF[k] || PERF.std; renderer.setPixelRatio(Math.min(devicePixelRatio, P.dpr)); resize(); }
$('perfSel').onchange = e => applyPerf(e.target.value);
applyPerf('std');

$('bgColor').oninput = e => scene.background = new THREE.Color(e.target.value);
$('bgImg').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  new THREE.TextureLoader().load(URL.createObjectURL(f), t => { t.colorSpace = THREE.SRGBColorSpace; scene.background = t; });
};

/* ---------- VRM読み込み ---------- */
let vrm = null;
const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));
function loadVRM(url, quiet) {
  loader.load(url, gltf => {
    if (vrm) { scene.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); }
    vrm = gltf.userData.vrm;
    VRMUtils.removeUnnecessaryVertices(gltf.scene); VRMUtils.combineSkeletons?.(gltf.scene);
    VRMUtils.rotateVRM0(vrm);
    scene.add(vrm.scene);
    buildAvatarBones();
    say('VRM読み込み完了。カメラを開始してください');
  }, undefined, err => { if (!quiet) say('VRM読み込み失敗'); console.warn(err); });
}
$('vrmFile').onchange = e => { const f = e.target.files[0]; if (f) loadVRM(URL.createObjectURL(f)); };
loadVRM('avatar.vrm', true); // 同じフォルダに avatar.vrm があれば自動読み込み
addEventListener('dragover', e => { e.preventDefault(); $('drop').style.display = 'flex'; });
addEventListener('dragleave', () => $('drop').style.display = 'none');
addEventListener('drop', e => {
  e.preventDefault(); $('drop').style.display = 'none';
  const f = e.dataTransfer.files[0]; if (f && /\.vrm$/i.test(f.name)) loadVRM(URL.createObjectURL(f));
});

/* ---------- モード切替 / ボーン表示 ---------- */
let showCamBones = true, showAvBones = false, avBones = null;
const _p = new THREE.Vector3();
const modeHint = () => mode === 'full'
  ? 'トラッキング中。全身がカメラに映る位置に立ってください'
  : 'トラッキング中(上半身モード)。腰から上が映っていればOKです';
function setMode(m) {
  mode = m;
  $('modeFull').classList.toggle('act', m === 'full'); $('modeUpper').classList.toggle('act', m === 'upper');
  if (tracking && !(recorder && recorder.state === 'recording')) say(modeHint());
}
$('modeFull').onclick = () => setMode('full');
$('modeUpper').onclick = () => setMode('upper');

// (1) カメラ映像に重ねるトラッキング結果の骨格
const ov = $('overlay'), octx = ov.getContext('2d');
const CONN_UP = [[11,12],[11,13],[13,15],[12,14],[14,16],[15,17],[15,19],[15,21],[17,19],[16,18],[16,20],[16,22],[18,20]];
const CONN_LOW = [[11,23],[12,24],[23,24],[23,25],[25,27],[27,29],[29,31],[27,31],[24,26],[26,28],[28,30],[30,32],[28,32]];
const visCol = v => v > 0.7 ? '#33ff88' : v > 0.4 ? '#ffdd33' : '#ff5555';
const HAND_CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHands(w, h) {
  const H = handRes?.landmarks; if (!H) return;
  const lw = Math.max(1.5, w / 260);
  octx.lineWidth = lw; octx.strokeStyle = '#44ddff'; octx.fillStyle = '#ffffff';
  for (const P of H) {
    octx.beginPath();
    for (const [a, b] of HAND_CONN) { octx.moveTo(P[a].x * w, P[a].y * h); octx.lineTo(P[b].x * w, P[b].y * h); }
    octx.stroke();
    for (const q of P) { octx.beginPath(); octx.arc(q.x * w, q.y * h, lw * 1.2, 0, Math.PI * 2); octx.fill(); }
  }
}
function drawOverlay() {
  const w = $('video').videoWidth, h = $('video').videoHeight; if (!w) return;
  if (ov.width !== w || ov.height !== h) { ov.width = w; ov.height = h; }
  octx.clearRect(0, 0, w, h);
  const P = poseRes?.landmarks?.[0];
  if (!showCamBones) return;
  drawHands(w, h);
  if (!P) return;
  const conns = mode === 'full' ? CONN_UP.concat(CONN_LOW) : CONN_UP;   // 上半身モードでは下半身は描かない
  const lw = Math.max(2, w / 150);
  octx.lineWidth = lw; octx.lineCap = 'round';
  for (const [a, b] of conns) {
    octx.strokeStyle = visCol(Math.min(P[a].visibility ?? 0, P[b].visibility ?? 0));
    octx.beginPath(); octx.moveTo(P[a].x * w, P[a].y * h); octx.lineTo(P[b].x * w, P[b].y * h); octx.stroke();
  }
  const ids = new Set(conns.flat()); ids.add(0);
  for (const i of ids) {
    octx.fillStyle = visCol(P[i].visibility ?? 0);
    octx.beginPath(); octx.arc(P[i].x * w, P[i].y * h, lw * 1.4, 0, Math.PI * 2); octx.fill();
  }
}
$('showBones').onchange = e => { showCamBones = e.target.checked; if (!showCamBones) octx.clearRect(0, 0, ov.width, ov.height); };

// (2) 3D画面上のアバター側ボーン(録画には映らない)
$('showAvBones').onchange = e => showAvBones = e.target.checked;
function buildAvatarBones() {
  if (avBones) { scene.remove(avBones.group); avBones.group.traverse(o => o.geometry?.dispose()); avBones = null; }
  const g = n => n && vrm.humanoid.getNormalizedBoneNode(n);
  const segs = [], link = (a, b) => { if (g(a) && g(b)) segs.push([g(a), g(b)]); };
  const chain = ['hips', 'spine', 'chest', 'upperChest', 'neck', 'head'].filter(g);
  chain.slice(1).forEach((n, i) => link(chain[i], n));
  const top = ['upperChest', 'chest', 'spine'].find(g);
  for (const s of ['left', 'right']) {
    const arm = [s + 'Shoulder', s + 'UpperArm', s + 'LowerArm', s + 'Hand'].filter(g);
    link(top, arm[0]); arm.slice(1).forEach((n, i) => link(arm[i], n));
    const leg = [s + 'UpperLeg', s + 'LowerLeg', s + 'Foot', s + 'Toes'].filter(g);
    link('hips', leg[0]); leg.slice(1).forEach((n, i) => link(leg[i], n));
  }
  const pos = new Float32Array(segs.length * 6);
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const line = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: 0x00ff99, depthTest: false }));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffee33, size: 0.025, depthTest: false }));
  line.renderOrder = pts.renderOrder = 999; line.frustumCulled = pts.frustumCulled = false;
  const group = new THREE.Group(); group.add(line, pts); scene.add(group);
  avBones = { group, segs, pos, geo };
}
function updateAvatarBones() {
  if (!avBones) return;
  const rec = recorder && recorder.state === 'recording';
  avBones.group.visible = showAvBones && !rec;   // 録画中は非表示
  if (!avBones.group.visible) return;
  vrm.scene.updateMatrixWorld(true);
  avBones.segs.forEach(([a, b], i) => {
    a.getWorldPosition(_p); _p.toArray(avBones.pos, i * 6);
    b.getWorldPosition(_p); _p.toArray(avBones.pos, i * 6 + 3);
  });
  avBones.geo.attributes.position.needsUpdate = true;
}

/* ---------- モーションキャプチャ ---------- */
const video = $('video');
let pose = null, face = null, hand = null, tracking = false;
let poseRes = null, faceRes = null, handRes = null, lastT = -1;

async function initMediaPipe() {
  say('AIモデル読み込み中…');
  const fs = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const base = 'https://storage.googleapis.com/mediapipe-models/';
  pose = await PoseLandmarker.createFromOptions(fs, {
    baseOptions: { modelAssetPath: base + 'pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task', delegate: 'GPU' },
    runningMode: 'VIDEO', numPoses: 1
  });
  face = await FaceLandmarker.createFromOptions(fs, {
    baseOptions: { modelAssetPath: base + 'face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate: 'GPU' },
    runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true
  });
  try {
    hand = await HandLandmarker.createFromOptions(fs, {
      baseOptions: { modelAssetPath: base + 'hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: 'GPU' },
      runningMode: 'VIDEO', numHands: 2
    });
  } catch (e) { console.warn(e); hand = null; }
}

/* ---------- 音声(マイク＋伴奏をミックス) ---------- */
let actx, dest, micGain, bgmGain, monGain;
function initAudio() {
  actx = new (window.AudioContext || window.webkitAudioContext)();
  dest = actx.createMediaStreamDestination();
  micGain = actx.createGain(); micGain.connect(dest);
  monGain = actx.createGain(); monGain.gain.value = 0; micGain.connect(monGain); monGain.connect(actx.destination);
  bgmGain = actx.createGain(); bgmGain.gain.value = +$('bgmVol').value;
  const src = actx.createMediaElementSource($('bgm'));
  src.connect(bgmGain); bgmGain.connect(dest); bgmGain.connect(actx.destination);
}
/* ---------- 伴奏: ファイル / URL / YouTube ---------- */
const bgm = $('bgm'), bgmPlain = $('bgmPlain');
let yt = null, ytApi = null;
const bgmVolVal = () => +$('bgmVol').value;
function stopAllBgm() { bgm.pause(); bgmPlain.pause(); try { yt?.pauseVideo?.(); } catch {} }
function showPlayer(which) {   // 'bgm' | 'plain' | 'yt'
  bgm.style.display = which === 'bgm' ? '' : 'none';
  bgmPlain.style.display = which === 'plain' ? '' : 'none';
  $('ytbox').style.display = which === 'yt' ? 'block' : 'none';
  $('tabAudio').style.display = which === 'yt' ? '' : 'none';
}
$('bgmFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  stopAllBgm(); showPlayer('bgm'); bgm.onerror = null;
  bgm.crossOrigin = 'anonymous'; bgm.src = URL.createObjectURL(f);
};
function ytId(u) {
  try {
    const x = new URL(u);
    if (x.hostname === 'youtu.be') return x.pathname.slice(1, 12);
    if (/(^|\.)youtube\.com$/.test(x.hostname)) {
      if (x.searchParams.get('v')) return x.searchParams.get('v');
      const m = x.pathname.match(/\/(embed|shorts|live)\/([\w-]{11})/); if (m) return m[2];
    }
  } catch {}
  return null;
}
function loadYTApi() {
  return ytApi ||= new Promise(res => {
    if (window.YT?.Player) return res();
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  });
}
async function playYT(id) {
  stopAllBgm(); showPlayer('yt'); say('YouTube読込中…');
  await loadYTApi();
  if (yt) { yt.loadVideoById(id); return; }
  yt = new YT.Player('ytplayer', {
    width: 320, height: 180, videoId: id, playerVars: { playsinline: 1, rel: 0, autoplay: 1 },
    events: {
      onReady: e => { e.target.setVolume(bgmVolVal() * 100); say('YouTube再生。録画に音を入れるには「YouTube音声を録画に入れる」を押してください'); },
      onStateChange: e => { if (e.data === 1) try { e.target.setPlaybackQuality('hd720'); } catch {} },   // 小さい画面だと低画質/低ビットレートが選ばれがちなので高めを要求
      onError: e => say('YouTube再生エラー(' + e.data + '): 埋め込み禁止の動画、または file:// で開いている可能性があります')
    }
  });
}
function playUrl(u) {
  stopAllBgm();
  const id = ytId(u); if (id) return playYT(id);
  showPlayer('bgm');
  bgm.onerror = () => {   // CORS非対応など → 録画には入らない通常再生にフォールバック
    bgm.onerror = null; bgm.pause(); showPlayer('plain');
    bgmPlain.onerror = () => say('読み込めません。音声/動画ファイルへの直リンクか確認してください');
    bgmPlain.volume = bgmVolVal(); bgmPlain.src = u; bgmPlain.play().catch(() => {});
    say('このURLはCORS非対応のため再生のみ(録画には伴奏が入りません)');
  };
  bgm.crossOrigin = 'anonymous'; bgm.src = u; bgm.play().catch(() => {});
}
$('urlBtn').onclick = () => { const u = $('urlIn').value.trim(); if (u) playUrl(u); };
$('urlIn').onkeydown = e => { if (e.key === 'Enter') $('urlBtn').click(); };
// YouTubeの音はWeb Audioに取り込めないので、タブ音声の共有で録画ミックスに入れる
$('tabAudio').onclick = async () => {
  try {
    if (!actx) initAudio(); await actx.resume();
    const ds = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, preferCurrentTab: true, selfBrowserSurface: 'include' });
    const a = ds.getAudioTracks(); ds.getVideoTracks().forEach(t => t.stop());
    if (!a.length) return say('音声が共有されていません(「タブの音声も共有」にチェックしてください)');
    actx.createMediaStreamSource(new MediaStream(a)).connect(dest);
    say('YouTubeの音声を録画に追加しました');
  } catch (e) { say('タブ音声の取得に失敗: ' + e.message); }
};
$('bgmVol').oninput = e => {
  const v = +e.target.value;
  bgmGain && (bgmGain.gain.value = v); bgmPlain.volume = v;

/* ---------- リターゲット ---------- */
const QI = new THREE.Quaternion(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
const X = new THREE.Vector3(1, 0, 0), NX = new THREE.Vector3(-1, 0, 0), DOWN = new THREE.Vector3(0, -1, 0);
let mirror = false; $('mirror').onchange = e => mirror = e.target.checked;
let LM = null;
const lm = i => LM[mirror && i >= 11 ? (i % 2 ? i + 1 : i - 1) : i];
const visOK = (t, ...ids) => ids.every(i => (lm(i).visibility ?? 0) > t);
const dirOf = (a, b) => V.set((lm(b).x - lm(a).x) * (mirror ? -1 : 1), -(lm(b).y - lm(a).y), -(lm(b).z - lm(a).z)).normalize().clone();

// 正規化ボーンの待機姿勢のワールド回転。VRM1なら単位回転、VRM0は rotateVRM0 により Y軸180°回転になっている。
// 「ワールド基準の回転」をボーンのローカル回転に直すとき、この分を補正しないと上下・前後が反転する。
const restQ = () => vrm.scene.getWorldQuaternion(new THREE.Quaternion());
// ワールド基準の回転 Qw(待機姿勢からの回転)をボーンに適用
function setWorldRot(name, Qw, k = 0.5) {
  const n = vrm.humanoid.getNormalizedBoneNode(name); if (!n) return;
  const parentW = n.parent.getWorldQuaternion(new THREE.Quaternion());
  n.quaternion.slerp(parentW.invert().multiply(Qw).multiply(restQ()), k);
  n.updateMatrixWorld(true);
}
// ボーンが rest 方向を向いている状態から dir 方向へ向ける
function setDir(name, rest, dir, k = 0.5) { setWorldRot(name, new THREE.Quaternion().setFromUnitVectors(rest, dir), k); }
// ワールド基準の累積回転 q をローカルに直して適用(hips→spine のように親子で使っても整合する)
function setRot(name, q, k = 0.5) {
  const n = vrm.humanoid.getNormalizedBoneNode(name); if (!n) return;
  const R0 = restQ();
  n.quaternion.slerp(R0.clone().invert().multiply(q).multiply(R0), k); n.updateMatrixWorld(true);
}
// ローカル回転をそのまま適用(指など)
function setLocal(name, q, k = 0.5) {
  const n = vrm.humanoid.getNormalizedBoneNode(name); if (n) n.quaternion.slerp(q, k);
}

function applyPose() {
  const I = () => new THREE.Quaternion();
  const armDown = (side) => {  // 未検出時は腕を下ろす
    const s = side === 'left' ? 1 : -1, rest = side === 'left' ? X : NX;
    const d = new THREE.Vector3(s * 0.18, -1, 0).normalize();
    setDir(side + 'UpperArm', rest, d, 0.15); setDir(side + 'LowerArm', rest, d, 0.15);
  };
  const resetLegs = k => { for (const s of ['left', 'right']) { setRot(s + 'UpperLeg', I(), k); setRot(s + 'LowerLeg', I(), k); } };
  // 肩が見えない → 待機姿勢(腰は判定に使わない: 上半身だけ映っていても腕を追従させるため)
  if (!LM || !visOK(0.5, 11, 12)) {
    setRot('hips', I(), 0.1); setRot('spine', I(), 0.1);
    armDown('left'); armDown('right'); resetLegs(0.1);
    return;
  }
  const useHips = mode === 'full' && visOK(0.5, 23, 24);
  if (useHips) {
    // 腰の向き(ヨー)
    const hv = dirOf(24, 23);
    const yaw = THREE.MathUtils.clamp(Math.atan2(-hv.z, hv.x), -1.2, 1.2);
    const hipsQ = new THREE.Quaternion().setFromAxisAngle(UP, yaw);
    setRot('hips', hipsQ, 0.4);
    // 上半身の傾き
    const mid = (a, b) => ({ x: (lm(a).x + lm(b).x) / 2, y: (lm(a).y + lm(b).y) / 2, z: (lm(a).z + lm(b).z) / 2 });
    const sh = mid(11, 12), hp = mid(23, 24), mx = mirror ? -1 : 1;
    const torso = new THREE.Vector3((sh.x - hp.x) * mx, -(sh.y - hp.y), -(sh.z - hp.z)).normalize();
    const tilt = new THREE.Quaternion().setFromUnitVectors(UP, torso);
    setRot('spine', hipsQ.clone().invert().multiply(tilt), 0.4);
  } else {
    // 上半身モード: 腰・脚は固定。肩のラインから胴体のひねり(ヨー)と傾き(ロール)だけ推定
    const sv = dirOf(12, 11);
    const yaw = THREE.MathUtils.clamp(Math.atan2(-sv.z, sv.x), -1.2, 1.2);
    const roll = THREE.MathUtils.clamp(Math.atan2(sv.y, Math.hypot(sv.x, sv.z)), -0.5, 0.5);
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, roll, 'YXZ'));
    setRot('hips', I(), 0.2);
    setRot('spine', I().slerp(q, 0.7), 0.4);
  }

  // 腕
  for (const [side, sh_, el, wr] of [['left', 11, 13, 15], ['right', 12, 14, 16]]) {
    const rest = side === 'left' ? X : NX;
    if (visOK(0.4, sh_, el)) setDir(side + 'UpperArm', rest, dirOf(sh_, el)); else armDown(side);
    if (visOK(0.4, el, wr)) setDir(side + 'LowerArm', rest, dirOf(el, wr)); else if (!visOK(0.4, sh_, el)) {}
  }
  // 脚(全身モードで映っているときだけ。上半身モードは常に直立)
  if (mode !== 'full') { resetLegs(0.2); return; }
  for (const [side, hi, kn, an] of [['left', 23, 25, 27], ['right', 24, 26, 28]]) {
    if (visOK(0.7, hi, kn, an)) {
      setDir(side + 'UpperLeg', DOWN, dirOf(hi, kn)); setDir(side + 'LowerLeg', DOWN, dirOf(kn, an));
    } else { setRot(side + 'UpperLeg', I(), .1); setRot(side + 'LowerLeg', I(), .1); }
  }
}

/* ---------- ハンドトラッキング ---------- */
// [指, 使うランドマーク(関節3つ), VRMのボーン名, 曲げの上限(rad)]
const FINGERS = [
  ['Thumb',  [1, 2, 3],    ['Metacarpal', 'Proximal', 'Distal'],      [0.8, 1.0, 1.3]],
  ['Index',  [5, 6, 7],    ['Proximal', 'Intermediate', 'Distal'],    [1.5, 1.9, 1.4]],
  ['Middle', [9, 10, 11],  ['Proximal', 'Intermediate', 'Distal'],    [1.5, 1.9, 1.4]],
  ['Ring',   [13, 14, 15], ['Proximal', 'Intermediate', 'Distal'],    [1.5, 1.9, 1.4]],
  ['Little', [17, 18, 19], ['Proximal', 'Intermediate', 'Distal'],    [1.5, 1.9, 1.4]]
];
const _s1 = new THREE.Vector3(), _s2 = new THREE.Vector3();
const seg = (W, i, j, out) => out.set(W[j].x - W[i].x, W[j].y - W[i].y, W[j].z - W[i].z).normalize();
const flexion = (W, p, a, b) => { seg(W, p, a, _s1); seg(W, a, b, _s2); return Math.acos(THREE.MathUtils.clamp(_s1.dot(_s2), -1, 1)); };

// 検出した手 → アバターの左右 に割り当て(手首の位置がポーズの手首に近い方。取れなければ MediaPipe のラベル)
function assignHands() {
  const out = {}, H = handRes;
  if (!H?.landmarks?.length) return out;
  const P = poseRes?.landmarks?.[0];
  H.landmarks.forEach((lmk, i) => {
    let person = null, dist = 1;
    if (P) {
      const dl = P[15] && (P[15].visibility ?? 0) > 0.2 ? Math.hypot(lmk[0].x - P[15].x, lmk[0].y - P[15].y) : 9;
      const dr = P[16] && (P[16].visibility ?? 0) > 0.2 ? Math.hypot(lmk[0].x - P[16].x, lmk[0].y - P[16].y) : 9;
      if (Math.min(dl, dr) < 0.25) { person = dl < dr ? 'left' : 'right'; dist = Math.min(dl, dr); }
    }
    if (!person) {   // ラベルは「鏡像入力」前提なので、反転していない映像では左右が逆
      const label = H.handedness?.[i]?.[0]?.categoryName;
      if (!label) return;
      person = label === 'Left' ? 'right' : 'left';
    }
    const side = mirror ? (person === 'left' ? 'right' : 'left') : person;
    if (!out[side] || dist < out[side].dist) out[side] = { i, dist };
  });
  return out;
}

function restBasis(side) {
  const f0 = side === 'left' ? X : NX, s0 = new THREE.Vector3(0, 0, -1);
  return new THREE.Matrix4().makeBasis(f0, s0, f0.clone().cross(s0));
}

function applyHands() {
  const assigned = (hand && $('handTrack').checked) ? assignHands() : {};
  const mx = mirror ? -1 : 1, R0inv = restQ().invert();
  for (const side of ['left', 'right']) {
    const a = assigned[side];
    if (!a) {   // 手が見えない → 手首と指をゆっくり戻す
      setRot(side + 'Hand', QI, 0.1);
      for (const [f, , bones] of FINGERS) for (const b of bones) setLocal(side + f + b, QI, 0.15);
      continue;
    }
    const W = handRes.worldLandmarks[a.i];
    // 手首の向き: 手首→中指の付け根(前方)と、人差し指側→小指側(横)から姿勢を作る
    const v = i => new THREE.Vector3(W[i].x * mx, -W[i].y, -W[i].z);
    const f = v(9).sub(v(0)).normalize();
    const s = v(17).sub(v(5)); s.addScaledVector(f, -s.dot(f)).normalize();
    const M = new THREE.Matrix4().makeBasis(f, s, f.clone().cross(s));
    const Qw = new THREE.Quaternion().setFromRotationMatrix(M.multiply(restBasis(side).invert()));
    setWorldRot(side + 'Hand', Qw, 0.4);
    // 指の曲げ: 関節ごとの屈曲角(手の向きに依存しない)を、手のひら側へ曲がる軸まわりに適用
    for (const [f_, js, bones, maxs] of FINGERS) {
      const thumb = f_ === 'Thumb';
      const axisW = thumb ? new THREE.Vector3(0, side === 'left' ? 0.8 : -0.8, side === 'left' ? -0.6 : 0.6)
                          : new THREE.Vector3(0, 0, side === 'left' ? -1 : 1);
      const axis = axisW.applyQuaternion(R0inv);
      const pts = [0, js[0], js[1], js[2], js[2] + 1];
      for (let k = 0; k < 3; k++) {
        const ang = THREE.MathUtils.clamp(flexion(W, pts[k], pts[k + 1], pts[k + 2]), 0, maxs[k]);
        setLocal(side + f_ + bones[k], new THREE.Quaternion().setFromAxisAngle(axis, ang), 0.5);
      }
    }
  }
}

const bsMap = {};
function applyFace() {
  if (!faceRes || !faceRes.faceBlendshapes?.length) { setRot('neck', QI, 0.1); setRot('head', QI, 0.1); return; }
  const m = new THREE.Matrix4().fromArray(faceRes.facialTransformationMatrixes[0].data);
  const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
  m.decompose(p, q, s);
  const e = new THREE.Euler().setFromQuaternion(q, 'YXZ');
  const sg = mirror ? -1 : 1;
  const hq = new THREE.Quaternion().setFromEuler(new THREE.Euler(
    THREE.MathUtils.clamp(e.x, -.7, .7), THREE.MathUtils.clamp(e.y * sg, -1, 1), THREE.MathUtils.clamp(e.z * sg, -.6, .6), 'YXZ'));
  const n = new THREE.Quaternion().identity().slerp(hq, 0.35);
  setRot('neck', n, 0.5);
  setRot('head', new THREE.Quaternion().identity().slerp(hq, 0.65), 0.5);

  for (const c of faceRes.faceBlendshapes[0].categories) bsMap[c.categoryName] = c.score;
  const g = k => bsMap[k] || 0, em = vrm.expressionManager; if (!em) return;
  const set = (n, v) => { if (em.getExpression(n)) em.setValue(n, THREE.MathUtils.clamp(v, 0, 1)); };
  const bl = g(mirror ? 'eyeBlinkRight' : 'eyeBlinkLeft'), br = g(mirror ? 'eyeBlinkLeft' : 'eyeBlinkRight');
  const bh = x => x > 0.5 ? 1 : x * 1.2;
  set('blinkLeft', bh(bl)); set('blinkRight', bh(br));
  const jaw = g('jawOpen');
  set('aa', jaw * 1.4 * (1 - g('mouthFunnel')));
  set('oh', g('mouthFunnel') * 1.2); set('ou', g('mouthPucker') * 1.2);
  set('ee', g('mouthStretchLeft') * .6 + g('mouthStretchRight') * .6);
  set('happy', (g('mouthSmileLeft') + g('mouthSmileRight')) * 0.7);
}

};

/* ---------- 接近ズーム ---------- */
// 顔の姿勢行列のz平行移動(カメラまでの距離, cm相当)から「近づいた倍率」を出し、カメラをアバターの顔に寄せる
let distBase = null, distCur = null, calBuf = [], zoomT = 0, lastFaceT = 0, lastInfo = '';
const closePos = new THREE.Vector3(0, 1.5, 1.4), closeLook = new THREE.Vector3(0, 1.45, 0);
function updateDist() {
  const M = faceRes?.facialTransformationMatrixes?.[0]; if (!M) return;
  const d = Math.abs(M.data[14]); if (!(d > 5)) return;
  lastFaceT = performance.now();
  distCur = distCur == null ? d : distCur + (d - distCur) * 0.3;
  if (distBase == null) {   // 最初の30フレームの中央値を基準位置にする
    calBuf.push(d);
    if (calBuf.length >= 30) { calBuf.sort((a, b) => a - b); distBase = calBuf[15]; calBuf = []; }
  }
}
$('zoomCal').onclick = () => { if (distCur != null) { distBase = distCur; zoomT = 0; } };
function stepZoom(dt) {
  let target = 0, info = '距離: -';
  if (distCur != null && distBase != null) {
    const near = distBase / distCur;   // 1.0=基準位置、大きいほど近い
    const raw = THREE.MathUtils.clamp((near - 1.12) * +$('zoomGain').value, 0, 1);
    target = raw * raw * (3 - 2 * raw);
    info = '近さ ×' + near.toFixed(2) + ' / アップ ' + Math.round(zoomT * 100) + '%';
  } else if (distCur != null) info = '基準位置を測定中…(離れた位置で静止)';
  if (!$('zoomOn').checked || performance.now() - lastFaceT > 2000) target = 0;   // 顔を見失ったら2秒後に引く
  zoomT += (target - zoomT) * (1 - Math.exp(-dt * 4));
  if (info !== lastInfo) { lastInfo = info; $('zoomInfo').textContent = info; }
}
function updateCloseTargets() {
  const h = vrm.humanoid.getNormalizedBoneNode('head'); if (!h) return;
  h.getWorldPosition(_p);
  closePos.set(0, _p.y + 0.03, 1.4); closeLook.set(0, _p.y - 0.04, 0);
}

/* ---------- メインループ ---------- */
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  if (P.frameMs && now - lastRender < P.frameMs - 1.5) return;   // 軽量モード: 描画を約30fpsに制限
  lastRender = now;
  const dt = Math.min(clock.getDelta(), 0.1);
  if (vrm) updateCloseTargets();
  stepZoom(dt);
  const fr = FRAME[mode];   // 全身/上半身の基本フレーミング → 接近ズームでアップ位置へ合成
  tgtPos.set(...fr.pos).lerp(closePos, zoomT); tgtLook.set(...fr.look).lerp(closeLook, zoomT);
  const kc = 1 - Math.exp(-dt * 6);   // カメラ移動を滑らかに
  camPos.lerp(tgtPos, kc); camLook.lerp(tgtLook, kc);
  camera.position.copy(camPos); camera.lookAt(camLook);
  if (vrm) {
    if (tracking && video.readyState >= 2 && video.currentTime !== lastT) {
      lastT = video.currentTime;
      if (++detN % P.skip === 0) {
        const ts = performance.now(), turn = (detN / P.skip) | 0, useHand = hand && $('handTrack').checked;
        try {
          faceRes = face.detectForVideo(video, ts);   // 表情・口パクは毎回
          // 標準/軽量: ポーズと手を交互に検出して1フレームあたりの負荷を半分に
          if (!P.alt || !useHand || (turn & 1) === 0) { poseRes = pose.detectForVideo(video, ts); LM = poseRes.worldLandmarks?.[0] || null; }
          if (useHand) { if (!P.alt || (turn & 1) === 1) handRes = hand.detectForVideo(video, ts); } else handRes = null;
          drawOverlay(); updateDist();
        } catch (e) { console.warn(e); }
      }
    }
    applyPose();
    applyHands(); applyFace();   // 検出結果が無いときは手・頭が待機姿勢へ戻る
    vrm.update(dt);
    updateAvatarBones();
  }
  renderer.render(scene, camera);
}
loop();
</script>
