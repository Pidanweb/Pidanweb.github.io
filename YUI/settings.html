<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>APIキー設定 - YUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3e9;
    --panel: #ffffff;
    --panel-edge: #e6ddc8;
    --ink: #2c2f36;
    --ink-dim: #7c8288;
    --scan: #2fae90;
    --scan-soft: rgba(47, 174, 144, 0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 20px 40px;
  }
  #back_btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 18px;
  }
  h1 {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 800;
    font-size: 20px;
    margin: 0 0 6px;
  }
  p.desc {
    color: var(--ink-dim);
    font-size: 13.5px;
    line-height: 1.8;
    margin: 0 0 20px;
  }
  a.link {
    color: var(--scan);
  }
  textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    border-radius: 14px;
    padding: 14px;
    font-size: 14px;
    font-family: monospace;
    resize: none;
    height: 100px;
  }
  #status_msg {
    font-size: 13px;
    color: var(--scan);
    height: 18px;
    margin-top: 8px;
  }
  button.primary {
    width: 100%;
    background: var(--scan);
    color: #ffffff;
    border: none;
    border-radius: 14px;
    padding: 15px 0;
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    margin-top: 14px;
  }
  button.secondary {
    width: 100%;
    background: rgba(0,0,0,0.045);
    color: var(--ink);
    border: none;
    border-radius: 14px;
    padding: 13px 0;
    font-family: inherit;
    font-size: 14px;
    margin-top: 10px;
  }
  .note_box {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 13px;
    color: var(--ink-dim);
    line-height: 1.8;
    margin-top: 22px;
  }
</style>
</head>
<body>
<div id="app">
  <a id="back_btn" href="index.html">← ホームに戻る</a>
  <h1>Gemini APIキー</h1>
  <p class="desc">
    <a class="link" href="https://aistudio.google.com/" target="_blank" rel="noopener">Google AI Studio</a>で発行したAPIキーを貼り付けてください。<br>
    このキーはGemini APIへのリクエストを認証するためだけに使われます。それ以外の送信先はなく、この端末内(localStorage)に保存されます。
  </p>

  <textarea id="key_input" placeholder="AQ.xxxxxxxxxxxxxxxxxxxxxxxx"></textarea>
  <div id="status_msg"></div>

  <button class="primary" id="save_btn">保存する</button>
  <button class="secondary" id="clear_btn">キーを削除する</button>

  <div class="note_box">
    保存したキーは、この「APIキー設定」ページ・「お話しする」画面・「カメラで質問する」画面すべてで共通して使われます。
  </div>
</div>

<script>
(() => {
  const API_KEY_STORAGE = 'yui_api_key';
  const keyInput = document.getElementById('key_input');
  const statusMsg = document.getElementById('status_msg');

  keyInput.value = localStorage.getItem(API_KEY_STORAGE) || '';

  document.getElementById('save_btn').addEventListener('click', () => {
    localStorage.setItem(API_KEY_STORAGE, keyInput.value.trim());
    statusMsg.textContent = '保存しました';
    setTimeout(() => { statusMsg.textContent = ''; }, 2000);
  });

  document.getElementById('clear_btn').addEventListener('click', () => {
    localStorage.removeItem(API_KEY_STORAGE);
    keyInput.value = '';
    statusMsg.textContent = '削除しました';
    setTimeout(() => { statusMsg.textContent = ''; }, 2000);
  });
})();
</script>
</body>
</html>
