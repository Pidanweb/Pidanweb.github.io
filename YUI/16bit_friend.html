<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ドット絵作成 & QR交換 - YUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root {
    --bg: #f7f3e9;
    --panel: #ffffff;
    --panel-edge: #e6ddc8;
    --ink: #2c2f36;
    --ink-dim: #7c8288;
    --scan: #2fae90;
    --scan-soft: rgba(47, 174, 144, 0.14);
    --danger: #e74c3c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 20px 40px;
  }
  #back_btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 18px;
  }
  h1 {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 800;
    font-size: 20px;
    margin: 0 0 6px;
  }
  p.desc {
    color: var(--ink-dim);
    font-size: 13.5px;
    line-height: 1.8;
    margin: 0 0 18px;
  }

  /* タブ切替ナビ */
  #tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .tab_btn {
    flex: 1;
    background: rgba(0,0,0,0.045);
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    border-radius: 14px;
    padding: 12px 0;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .tab_btn.active {
    background: var(--scan);
    border-color: var(--scan);
    color: #ffffff;
  }

  .tab_panel { display: none; }
  .tab_panel.active { display: block; }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 14px;
  }

  /* --- 描画キャンバス関連 --- */
  .canvas_container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 16px;
  }
  #editor_canvas {
    width: 280px;
    height: 280px;
    image-rendering: pixelated;
    border-radius: 12px;
    border: 2px solid var(--panel-edge);
    background-color: #ffffff;
    touch-action: none; /* スマホスクロール防止 */
    cursor: crosshair;
  }

  /* パレット & ツール */
  .palette_box {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
  }
  .color_dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid #ffffff;
    box-shadow: 0 0 0 1px var(--panel-edge);
    cursor: pointer;
  }
  .color_dot.active {
    transform: scale(1.15);
    box-shadow: 0 0 0 2px var(--scan);
  }
  #color_picker_input {
    width: 32px;
    height: 32px;
    padding: 0;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    background: none;
  }

  .tool_group {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .tool_btn {
    flex: 1;
    background: rgba(0,0,0,0.045);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    border-radius: 10px;
    padding: 10px 0;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .tool_btn.active {
    background: var(--ink);
    color: #ffffff;
    border-color: var(--ink);
  }

  /* --- QRコード表示・読み取り関連 --- */
  #qr_output {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 240px;
    margin: 6px 0 4px;
  }
  #qr_output img, #qr_output canvas, #qr_output table {
    border-radius: 10px;
  }

  #qr_size_info {
    font-size: 12px;
    color: var(--ink-dim);
    text-align: center;
  }

  video#scan_video {
    width: 100%;
    border-radius: 14px;
    background: #000;
    display: block;
  }

  #scan_status {
    font-size: 13px;
    color: var(--scan);
    min-height: 18px;
    margin-top: 10px;
    text-align: center;
  }

  #scan_result {
    display: none;
    text-align: center;
  }
  #scan_result.show { display: block; }
  #scan_result_img {
    width: 96px;
    height: 96px;
    object-fit: contain;
    border-radius: 12px;
    border: 2px solid #1a1a1a;
    background: #fff;
    margin-bottom: 10px;
    image-rendering: pixelated;
  }
  #scan_result_comment {
    background: var(--scan-soft);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13.5px;
    font-weight: 700;
    margin-bottom: 14px;
  }

  /* ボタン共通 */
  button.primary {
    width: 100%;
    background: var(--scan);
    color: #ffffff;
    border: none;
    border-radius: 14px;
    padding: 15px 0;
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    margin-top: 10px;
    cursor: pointer;
  }
  button.secondary {
    width: 100%;
    background: rgba(0,0,0,0.045);
    color: var(--ink);
    border: none;
    border-radius: 14px;
    padding: 13px 0;
    font-family: inherit;
    font-size: 14px;
    margin-top: 10px;
    cursor: pointer;
  }
  a.link_btn {
    display: block;
    text-align: center;
    width: 100%;
    background: var(--scan);
    color: #ffffff;
    border-radius: 14px;
    padding: 15px 0;
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    margin-top: 10px;
    text-decoration: none;
  }

  .note_box {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 12.5px;
    color: var(--ink-dim);
    line-height: 1.8;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div id="app">
  <a id="back_btn" href="index.html">← ホームに戻る</a>
  <h1>ドット絵作成 & QR交換</h1>
  <p class="desc">
    16×16のドット絵を描いて自分のキャラを作成したり、QRコードを使って友達とキャラを交換できます。
  </p>

  <div id="tabs">
    <button class="tab_btn active" id="tab_edit_btn">描く</button>
    <button class="tab_btn" id="tab_show_btn">見せる</button>
    <button class="tab_btn" id="tab_scan_btn">読み取る</button>
  </div>

  <!-- 1. 描くタブ -->
  <div class="tab_panel active" id="tab_edit_panel">
    <div class="card">
      <div class="canvas_container">
        <canvas id="editor_canvas" width="16" height="16"></canvas>
      </div>

      <!-- カラーパレット -->
      <div class="palette_box" id="palette_box">
        <div class="color_dot active" style="background:#000000" data-color="#000000"></div>
        <div class="color_dot" style="background:#ffffff" data-color="#ffffff"></div>
        <div class="color_dot" style="background:#e74c3c" data-color="#e74c3c"></div>
        <div class="color_dot" style="background:#e67e22" data-color="#e67e22"></div>
        <div class="color_dot" style="background:#f1c40f" data-color="#f1c40f"></div>
        <div class="color_dot" style="background:#2ecc71" data-color="#2ecc71"></div>
        <div class="color_dot" style="background:#1abc9c" data-color="#1abc9c"></div>
        <div class="color_dot" style="background:#3498db" data-color="#3498db"></div>
        <div class="color_dot" style="background:#9b59b6" data-color="#9b59b6"></div>
        <input type="color" id="color_picker_input" value="#2fae90" title="カスタムカラー">
      </div>

      <!-- ツール -->
      <div class="tool_group">
        <button class="tool_btn active" id="tool_pen_btn">ペン</button>
        <button class="tool_btn" id="tool_eraser_btn">消しゴム</button>
        <button class="tool_btn" id="tool_undo_btn">1つ戻す</button>
        <button class="tool_btn" id="tool_clear_btn">全消去</button>
      </div>

      <button class="primary" id="save_char_btn">描いたキャラを保存する</button>
    </div>
    <div class="note_box">
      保存すると「見せる」タブでQRコード化したり、ホーム画面のマイキャラとして反映されます。
    </div>
  </div>

  <!-- 2. 見せるタブ -->
  <div class="tab_panel" id="tab_show_panel">
    <div class="card">
      <div id="qr_output"></div>
      <div id="qr_size_info"></div>
    </div>
    <button class="secondary" id="qr_refresh_btn">QRコードを作り直す</button>
    <div class="note_box">
      キャラ画像は16×16pxの軽量形式で埋め込まれます。ひとことコメントは「設定」の自己紹介に書いた内容が使われます(未設定の場合は空になります)。
    </div>
  </div>

  <!-- 3. 読み取るタブ -->
  <div class="tab_panel" id="tab_scan_panel">
    <div class="card">
      <video id="scan_video" playsinline muted></video>
      <canvas id="scan_canvas" style="display:none;"></canvas>
      <div id="scan_status"></div>

      <div id="scan_result">
        <img id="scan_result_img" src="" alt="遊びに来たキャラ">
        <div id="scan_result_comment"></div>
        <a class="link_btn" href="index.html">ホームで確認する</a>
      </div>
    </div>
    <button class="primary" id="scan_start_btn">カメラを起動して読み取る</button>
    <div class="note_box">
      友だちのYUIの「見せる」画面をこのカメラに映してください。今のところ1人分だけ、ホーム画面に遊びに来ることができます(新しく読み取ると入れ替わります)。
    </div>
  </div>
</div>

<script>
(() => {
  const PROFILE_KEY = 'yui_profile';
  const CUSTOM_CHAR_KEY = 'yui_custom_char';
  const GUEST_CHAR_KEY = 'yui_guest_char';
  const DEFAULT_CHAR_SRC = 'chars/char_normal.png';

  // --- プロフィールデータ取得 ---
  function loadProfile() {
    try {
      const raw = localStorage.getItem(PROFILE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  // ============ バイナリ⇔文字列ヘルパー ============
  function uint8ToBinaryString(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return s;
  }
  function binaryStringToUint8(str) {
    const bytes = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
    return bytes;
  }
  function dataUrlToBytes(dataUrl) {
    const base64 = dataUrl.split(',')[1];
    return binaryStringToUint8(atob(base64));
  }
  function bytesToDataUrl(bytes, mime) {
    return `data:${mime};base64,${btoa(uint8ToBinaryString(bytes))}`;
  }
  function loadImageElement(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  // ============ データの組み立て・分解 ============
  function buildPayload(imgBytes, size, comment) {
    const commentBytes = new TextEncoder().encode(comment || '');
    const commentLen = Math.min(commentBytes.length, 255);
    const buf = new Uint8Array(1 + 1 + 1 + 2 + imgBytes.length + 1 + commentLen);
    let o = 0;
    buf[o++] = 1;
    buf[o++] = size;
    buf[o++] = size;
    buf[o++] = (imgBytes.length >> 8) & 0xff;
    buf[o++] = imgBytes.length & 0xff;
    buf.set(imgBytes, o); o += imgBytes.length;
    buf[o++] = commentLen;
    buf.set(commentBytes.slice(0, commentLen), o);
    return buf;
  }
  function parsePayload(buf) {
    let o = 0;
    const version = buf[o++];
    const width = buf[o++];
    const height = buf[o++];
    const imgLen = (buf[o++] << 8) | buf[o++];
    const imgBytes = buf.slice(o, o + imgLen); o += imgLen;
    const commentLen = buf[o++];
    const commentBytes = buf.slice(o, o + commentLen);
    const comment = new TextDecoder('utf-8').decode(commentBytes);
    return { version, width, height, imgBytes, comment };
  }

  // ============ 16x16 ドット絵エディタ処理 ============
  const editorCanvas = document.getElementById('editor_canvas');
  const ctx = editorCanvas.getContext('2d');
  let currentTool = 'pen'; // 'pen' or 'eraser'
  let currentColor = '#000000';
  let isDrawing = false;
  let undoHistory = [];

  // グリッドデータ（16x16、初期値は透明/白）
  let gridData = Array(16).fill(null).map(() => Array(16).fill('#ffffff'));

  function saveUndoState() {
    if (undoHistory.length > 10) undoHistory.shift();
    undoHistory.push(JSON.stringify(gridData));
  }

  function renderGrid() {
    ctx.clearRect(0, 0, 16, 16);
    for (let r = 0; r < 16; r++) {
      for (let c = 0; c < 16; c++) {
        ctx.fillStyle = gridData[r][c];
        ctx.fillRect(c, r, 1, 1);
      }
    }
  }

  // 初期化：保存されているカスタムキャラがあれば読み込む
  async function initEditor() {
    const saved = localStorage.getItem(CUSTOM_CHAR_KEY);
    if (saved) {
      try {
        const img = await loadImageElement(saved);
        ctx.drawImage(img, 0, 0, 16, 16);
        const imgData = ctx.getImageData(0, 0, 16, 16).data;
        for (let i = 0; i < 256; i++) {
          const r = Math.floor(i / 16);
          const c = i % 16;
          const idx = i * 4;
          const hex = `#${((1 << 24) + (imgData[idx] << 16) + (imgData[idx+1] << 8) + imgData[idx+2]).toString(16).slice(1)}`;
          gridData[r][c] = hex;
        }
      } catch (e) {
        console.error('画像読み込み失敗:', e);
      }
    }
    renderGrid();
    saveUndoState();
  }

  function getCanvasCoords(e) {
    const rect = editorCanvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const x = Math.floor(((clientX - rect.left) / rect.width) * 16);
    const y = Math.floor(((clientY - rect.top) / rect.height) * 16);
    return {
      c: Math.max(0, Math.min(15, x)),
      r: Math.max(0, Math.min(15, y))
    };
  }

  function drawPixel(e) {
    if (!isDrawing) return;
    const { r, c } = getCanvasCoords(e);
    const targetColor = currentTool === 'pen' ? currentColor : '#ffffff';
    if (gridData[r][c] !== targetColor) {
      gridData[r][c] = targetColor;
      renderGrid();
    }
  }

  // ポインターイベント設定
  editorCanvas.addEventListener('pointerdown', (e) => {
    isDrawing = true;
    saveUndoState();
    drawPixel(e);
  });
  editorCanvas.addEventListener('pointermove', drawPixel);
  window.addEventListener('pointerup', () => { isDrawing = false; });

  // パレット切り替え
  document.getElementById('palette_box').addEventListener('click', (e) => {
    const target = e.target.closest('.color_dot');
    if (target) {
      document.querySelectorAll('.color_dot').forEach(d => d.classList.remove('active'));
      target.classList.add('active');
      currentColor = target.dataset.color;
      currentTool = 'pen';
      updateToolButtons();
    }
  });

  document.getElementById('color_picker_input').addEventListener('input', (e) => {
    currentColor = e.target.value;
    currentTool = 'pen';
    updateToolButtons();
  });

  // ツール切り替えボタン
  const penBtn = document.getElementById('tool_pen_btn');
  const eraserBtn = document.getElementById('tool_eraser_btn');

  function updateToolButtons() {
    penBtn.classList.toggle('active', currentTool === 'pen');
    eraserBtn.classList.toggle('active', currentTool === 'eraser');
  }

  penBtn.addEventListener('click', () => { currentTool = 'pen'; updateToolButtons(); });
  eraserBtn.addEventListener('click', () => { currentTool = 'eraser'; updateToolButtons(); });

  document.getElementById('tool_undo_btn').addEventListener('click', () => {
    if (undoHistory.length > 1) {
      undoHistory.pop(); // 現在の状態
      const prev = undoHistory[undoHistory.length - 1];
      gridData = JSON.parse(prev);
      renderGrid();
    }
  });

  document.getElementById('tool_clear_btn').addEventListener('click', () => {
    if (confirm('キャンバスをクリアしますか？')) {
      saveUndoState();
      gridData = Array(16).fill(null).map(() => Array(16).fill('#ffffff'));
      renderGrid();
    }
  });

  // キャラ画像保存
  document.getElementById('save_char_btn').addEventListener('click', () => {
    const dataUrl = editorCanvas.toDataURL('image/png');
    localStorage.setItem(CUSTOM_CHAR_KEY, dataUrl);
    alert('描いたキャラを保存しました！');
  });

  // ============ 見せるタブ:QRコード生成 ============
  const qrOutput = document.getElementById('qr_output');
  const qrSizeInfo = document.getElementById('qr_size_info');
  const PX_PER_MODULE = 7;
  const MAX_RENDER_SIZE = 480;

  function measureModuleCount(text) {
    const tempDiv = document.createElement('div');
    tempDiv.style.cssText = 'position:absolute; left:-9999px; top:-9999px;';
    document.body.appendChild(tempDiv);
    let moduleCount = null;
    try {
      const tmp = new QRCode(tempDiv, { text, width: 10, height: 10, correctLevel: QRCode.CorrectLevel.M });
      moduleCount = (tmp._oQRCode && tmp._oQRCode.moduleCount) || null;
    } finally {
      document.body.removeChild(tempDiv);
    }
    if (!moduleCount) throw new Error('QRコードの計算に失敗しました');
    return moduleCount;
  }

  async function generateAndRenderQr() {
    qrOutput.innerHTML = '';
    qrSizeInfo.textContent = '作成中…';

    if (typeof QRCode === 'undefined') {
      qrSizeInfo.textContent = 'QRコード生成ライブラリを読み込めませんでした。';
      return;
    }

    const profile = loadProfile();
    const comment = (profile.self_intro || '').slice(0, 40);
    const avatarSrc = localStorage.getItem(CUSTOM_CHAR_KEY) || DEFAULT_CHAR_SRC;

    let img;
    try {
      img = await loadImageElement(avatarSrc);
    } catch (e) {
      img = await loadImageElement(DEFAULT_CHAR_SRC);
    }

    let size = 16; // 16x16ドット絵基準
    let quality = 0.5;

    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const cctx = canvas.getContext('2d');
    cctx.drawImage(img, 0, 0, size, size);

    const jpegDataUrl = canvas.toDataURL('image/jpeg', quality);
    const imgBytes = dataUrlToBytes(jpegDataUrl);
    const payloadBytes = buildPayload(imgBytes, size, comment);
    const base64Payload = btoa(uint8ToBinaryString(payloadBytes));

    try {
      const moduleCount = measureModuleCount(base64Payload);
      const renderSize = moduleCount * PX_PER_MODULE;

      qrOutput.innerHTML = '';
      new QRCode(qrOutput, {
        text: base64Payload,
        width: Math.min(renderSize, 280),
        height: Math.min(renderSize, 280),
        correctLevel: QRCode.CorrectLevel.M,
      });
      qrSizeInfo.textContent = `画像 ${size}×${size}px ・ QRマス目 ${moduleCount}×${moduleCount}`;
    } catch (e) {
      qrSizeInfo.textContent = 'QRコードの生成に失敗しました。';
    }
  }

  document.getElementById('qr_refresh_btn').addEventListener('click', generateAndRenderQr);

  // ============ 読み取るタブ:カメラ + jsQRスキャン ============
  const video = document.getElementById('scan_video');
  const canvas = document.getElementById('scan_canvas');
  const scanStatus = document.getElementById('scan_status');
  const scanResult = document.getElementById('scan_result');
  const scanStartBtn = document.getElementById('scan_start_btn');

  let mediaStream = null;
  let scanning = false;

  async function startScan() {
    scanResult.classList.remove('show');
    if (typeof jsQR === 'undefined') {
      scanStatus.textContent = 'QR読み取りライブラリを読み込めませんでした。';
      return;
    }
    scanStatus.textContent = 'カメラを起動しています…';
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false,
      });
    } catch (e) {
      scanStatus.textContent = 'カメラを使えませんでした。ブラウザの設定をご確認ください。';
      return;
    }
    video.srcObject = mediaStream;
    await video.play();
    scanning = true;
    scanStatus.textContent = '友だちのQRコードをカメラに映してください';
    requestAnimationFrame(scanLoop);
  }

  function stopScan() {
    scanning = false;
    if (mediaStream) {
      mediaStream.getTracks().forEach((t) => t.stop());
      mediaStream = null;
    }
  }

  function scanLoop() {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const cctx = canvas.getContext('2d');
      cctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = cctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code && code.data) {
        onScanSuccess(code.data);
        return;
      }
    }
    requestAnimationFrame(scanLoop);
  }

  function onScanSuccess(text) {
    stopScan();
    try {
      const bytes = binaryStringToUint8(atob(text));
      const parsed = parsePayload(bytes);
      const imgDataUrl = bytesToDataUrl(parsed.imgBytes, 'image/jpeg');
      const guest = { img: imgDataUrl, comment: parsed.comment, receivedAt: Date.now() };
      localStorage.setItem(GUEST_CHAR_KEY, JSON.stringify(guest));

      document.getElementById('scan_result_img').src = imgDataUrl;
      document.getElementById('scan_result_comment').textContent = parsed.comment || 'あそびにきたよ！';
      scanResult.classList.add('show');
      scanStatus.textContent = '読み取りました！';
    } catch (e) {
      scanStatus.textContent = 'YUIのQRコードとして読み取れませんでした。もう一度お試しください。';
      startScan();
    }
  }

  scanStartBtn.addEventListener('click', startScan);
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopScan(); });
  window.addEventListener('pagehide', stopScan);

  // ============ タブ切替 ============
  const tabEditBtn = document.getElementById('tab_edit_btn');
  const tabShowBtn = document.getElementById('tab_show_btn');
  const tabScanBtn = document.getElementById('tab_scan_btn');

  const tabEditPanel = document.getElementById('tab_edit_panel');
  const tabShowPanel = document.getElementById('tab_show_panel');
  const tabScanPanel = document.getElementById('tab_scan_panel');

  function activateTab(name) {
    tabEditBtn.classList.toggle('active', name === 'edit');
    tabShowBtn.classList.toggle('active', name === 'show');
    tabScanBtn.classList.toggle('active', name === 'scan');

    tabEditPanel.classList.toggle('active', name === 'edit');
    tabShowPanel.classList.toggle('active', name === 'show');
    tabScanPanel.classList.toggle('active', name === 'scan');

    if (name === 'show') {
      stopScan();
      generateAndRenderQr();
    } else {
      stopScan();
    }
  }

  tabEditBtn.addEventListener('click', () => activateTab('edit'));
  tabShowBtn.addEventListener('click', () => activateTab('show'));
  tabScanBtn.addEventListener('click', () => activateTab('scan'));

  // 初期化実行
  initEditor();
})();
</script>
</body>
</html>
