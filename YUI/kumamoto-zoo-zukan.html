<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>くまもと どうぶつ図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1ECDC;
    --paper-2:#E8E1CB;
    --ink:#26352B;
    --ink-soft:#4B5A4E;
    --forest:#2F4A3E;
    --forest-2:#3E6152;
    --gold:#C1902F;
    --gold-soft:#E7CC93;
    --line: rgba(38,53,43,0.18);
    --card-bg:#FBF9F1;
    --danger:#A6482E;
    --radius: 10px;
    --shadow: 0 2px 0 rgba(38,53,43,0.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B2420;
      --paper-2:#222D27;
      --ink:#EDE7D6;
      --ink-soft:#B9C3B7;
      --forest:#9FC2AE;
      --forest-2:#7FA890;
      --gold:#E3B85B;
      --gold-soft:#4A3E22;
      --line: rgba(237,231,214,0.16);
      --card-bg:#232E28;
      --danger:#E08464;
      --shadow: 0 2px 0 rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B2420;
    --paper-2:#222D27;
    --ink:#EDE7D6;
    --ink-soft:#B9C3B7;
    --forest:#9FC2AE;
    --forest-2:#7FA890;
    --gold:#E3B85B;
    --gold-soft:#4A3E22;
    --line: rgba(237,231,214,0.16);
    --card-bg:#232E28;
    --danger:#E08464;
    --shadow: 0 2px 0 rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 0 64px;}

  header.top{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:18px 20px 14px;
  }
  .eyebrow{
    font-size:12.5px;
    color:var(--forest-2);
    letter-spacing:.04em;
    margin:0 0 2px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:28px;
    margin:0 0 12px;
    color:var(--forest);
    line-height:1.3;
  }
  .progress-row{
    display:flex; align-items:center; gap:12px;
  }
  .progress-track{
    flex:1;
    height:9px;
    border-radius:6px;
    background:var(--paper-2);
    overflow:hidden;
    border:1px solid var(--line);
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--gold-soft), var(--gold));
    border-radius:6px;
    transition:width .5s ease;
  }
  .progress-label{
    font-size:13px;
    font-variant-numeric: tabular-nums;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .progress-label b{color:var(--forest);font-size:15px;}

  .controls{
    display:flex; flex-wrap:wrap; gap:8px;
    margin-top:14px;
  }
  .tab{
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--ink-soft);
    padding:7px 13px;
    border-radius:100px;
    font-size:13.5px;
    font-family:inherit;
    cursor:pointer;
  }
  .tab.active{
    background:var(--forest);
    border-color:var(--forest);
    color:var(--paper);
  }
  .search-row{
    display:flex; gap:8px; margin-top:10px;
  }
  input[type="search"]{
    flex:1;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--ink);
    padding:9px 12px;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
  }
  input[type="search"]:focus{outline:2px solid var(--forest-2); outline-offset:1px;}
  .add-btn{
    border:none;
    background:var(--forest);
    color:var(--paper);
    padding:9px 14px;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
  }
  .add-btn:active{transform:translateY(1px);}

  section.group{padding:22px 20px 0;}
  .group-title{
    display:flex; align-items:baseline; gap:8px;
    margin:0 0 12px;
  }
  .group-title h2{
    font-family:'Shippori Mincho', serif;
    font-size:18px; margin:0;
    color:var(--forest);
  }
  .group-title span{
    font-size:12.5px; color:var(--ink-soft);
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(140px,1fr));
    gap:10px;
  }

  .card{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
    cursor:pointer;
  }
  .card.unavailable{opacity:0.55;}
  .thumb{
    aspect-ratio:1/1;
    width:100%;
    background:var(--paper-2);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .emoji{font-size:38px; filter:grayscale(1); opacity:.55;}
  .stamp{
    position:absolute; top:6px; right:6px;
    width:26px; height:26px;
    border-radius:50%;
    background:var(--gold);
    color:#2b1c02;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .flag{
    position:absolute; top:6px; left:6px;
    background:var(--danger);
    color:#fff;
    font-size:10.5px;
    padding:2px 6px;
    border-radius:100px;
  }
  .cardbody{padding:8px 9px 10px;}
  .cname{font-size:13.5px; font-weight:700; line-height:1.3;}
  .ccat{font-size:11px; color:var(--ink-soft); margin-top:2px;}

  .empty{
    padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:14px;
  }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(20,24,20,.55);
    display:none; align-items:flex-end; justify-content:center;
    z-index:100;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--paper);
    width:100%; max-width:520px;
    border-radius:16px 16px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto;
    animation: slideup .22s ease;
  }
  @media (min-width:600px){
    .overlay{align-items:center;}
    .sheet{border-radius:16px; max-height:80vh;}
  }
  @keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}

  .sheet h3{
    font-family:'Shippori Mincho', serif;
    font-size:20px; margin:0 0 4px; color:var(--forest);
  }
  .sheet .sub{font-size:12.5px;color:var(--ink-soft); margin-bottom:16px;}
  .sheet-thumb{
    width:100%; aspect-ratio:4/3; border-radius:10px;
    background:var(--paper-2); border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden; margin-bottom:14px;
  }
  .sheet-thumb img{width:100%;height:100%;object-fit:cover;}
  .sheet-thumb .emoji{font-size:56px;opacity:.5;filter:grayscale(1);}
  .rowbtns{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .btn{
    flex:1;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--ink);
    padding:11px 12px;
    border-radius:9px;
    font-size:14px;
    font-family:inherit;
    text-align:center;
    cursor:pointer;
  }
  .btn.primary{background:var(--forest); border-color:var(--forest); color:var(--paper); font-weight:700;}
  .btn.ghost{background:transparent;}
  .btn.danger{color:var(--danger); border-color:var(--danger);}
  .field-label{
    font-size:12px; color:var(--ink-soft); margin:12px 0 5px;
  }
  textarea, .sheet input[type=text]{
    width:100%; border:1px solid var(--line); background:var(--card-bg);
    color:var(--ink); border-radius:8px; padding:9px 10px; font-size:14px;
    font-family:inherit; resize:vertical;
  }
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-top:1px solid var(--line); margin-top:12px;
  }
  .toggle-row span{font-size:13.5px;}
  .switch{
    width:42px; height:24px; border-radius:100px; background:var(--paper-2);
    border:1px solid var(--line); position:relative; cursor:pointer; flex-shrink:0;
  }
  .switch.on{background:var(--danger); border-color:var(--danger);}
  .switch .knob{
    position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
    background:var(--card-bg); transition:left .15s ease;
  }
  .switch.on .knob{left:20px; background:#fff;}
  .close-x{
    position:absolute; top:14px; right:16px;
    background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;
    line-height:1;
  }
  #fileInput{display:none;}

  footer.note{
    padding:26px 20px 10px; font-size:12px; color:var(--ink-soft); line-height:1.7;
  }
  footer.note a{color:var(--forest-2);}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <p class="eyebrow">熊本市動植物園</p>
    <h1>どうぶつ図鑑</h1>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-label"><b id="progressCount">0</b> / <span id="progressTotal">0</span> 記録</div>
    </div>
    <div class="controls" id="tabRow"></div>
    <div class="search-row">
      <input type="search" id="searchBox" placeholder="どうぶつの名前でさがす">
      <button class="add-btn" id="openAddBtn">＋ 追加</button>
    </div>
  </header>

  <div id="groups"></div>

  <footer class="note">
    どうぶつのリストは公式サイト（<a href="https://www.ezooko.jp/" target="_blank" rel="noopener">熊本市動植物園</a>）などをもとに作成した一覧なので、実際の展示と多少ずれている場合があります。園内で違いに気づいたら「＋追加」やカードの編集からその場で直せます。工事や体調不良、鳥インフルエンザ等の影響で観覧できない個体は、カードの「今は見られない」を切り替えるとグレー表示になり記録の対象から外れます。写真は端末の中だけに保存され、外部には送信されません。
  </footer>
</div>

<!-- Detail / capture sheet -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <button class="close-x" id="closeSheet">×</button>
    <h3 id="sheetName">-</h3>
    <p class="sub" id="sheetCat">-</p>
    <div class="sheet-thumb" id="sheetThumb"><span class="emoji">🐾</span></div>

    <input type="file" id="fileInput" accept="image/*" capture="environment">

    <div class="rowbtns">
      <button class="btn primary" id="takePhotoBtn">📷 写真を撮る／選ぶ</button>
    </div>
    <div class="rowbtns" id="retakeRow" style="display:none;">
      <button class="btn danger" id="removePhotoBtn">写真を消す</button>
    </div>

    <div class="field-label">メモ（任意）</div>
    <textarea id="noteField" rows="2" placeholder="見た場所・様子など"></textarea>

    <div class="toggle-row">
      <span>今は見られない（工事・体調・鳥インフル等）</span>
      <div class="switch" id="unavailSwitch"><div class="knob"></div></div>
    </div>

    <div class="rowbtns" style="margin-top:16px;">
      <button class="btn ghost" id="deleteEntryBtn">この項目を削除</button>
    </div>
  </div>
</div>

<!-- Add new animal sheet -->
<div class="overlay" id="addOverlay">
  <div class="sheet">
    <button class="close-x" id="closeAddSheet">×</button>
    <h3>どうぶつを追加</h3>
    <p class="sub">リストにない子を見つけたら、その場で追加できます</p>
    <div class="field-label">名前</div>
    <input type="text" id="newName" placeholder="例：レッサーパンダ">
    <div class="field-label">分類</div>
    <div class="controls" id="newCatRow"></div>
    <div class="rowbtns" style="margin-top:18px;">
      <button class="btn primary" id="confirmAddBtn">追加する</button>
    </div>
  </div>
</div>

<script>
const CATS = [
  {id:'mammal', label:'ほ乳類', emoji:'🦁'},
  {id:'bird', label:'鳥類', emoji:'🦚'},
  {id:'reptile', label:'は虫類', emoji:'🐢'},
  {id:'amphibian', label:'両生類', emoji:'🐸'},
];

// Base list compiled from the zoo's public information (official site categories +
// visitor/photo records). Treat as a helpful starting point, not a guaranteed exact roster.
const BASE_ANIMALS = [
  // 哺乳類
  ["アフリカゾウ","mammal"],["キリン","mammal"],["カバ","mammal"],["クロサイ","mammal"],
  ["ライオン","mammal"],["ユキヒョウ","mammal"],["ウンピョウ","mammal"],["ホッキョクグマ","mammal"],
  ["ツキノワグマ","mammal"],["ヒグマ","mammal"],["マレーグマ","mammal"],["キンシコウ","mammal"],
  ["チンパンジー","mammal"],["ニホンザル","mammal"],["マンドリル","mammal"],["シシオザル","mammal"],
  ["ワオキツネザル","mammal"],["スンダスローロリス","mammal"],["ボリビアリスザル","mammal"],
  ["カピバラ","mammal"],["オグロプレーリードッグ","mammal"],["アフリカタテガミヤマアラシ","mammal"],
  ["コウベモグラ","mammal"],["アカカンガルー","mammal"],["ホンドギツネ","mammal"],["ホンドタヌキ","mammal"],
  ["ニホンアナグマ","mammal"],["オタリア","mammal"],["エランド","mammal"],["グラントシマウマ","mammal"],
  ["ニホンジカ","mammal"],["シフゾウ","mammal"],["ダマジカ","mammal"],["ラマ","mammal"],
  ["レッサーパンダ","mammal"],["ヤギ","mammal"],["ヒツジ","mammal"],["モルモット","mammal"],
  // 鳥類
  ["インドクジャク","bird"],["シロクジャク","bird"],["キジ","bird"],["オナガキジ","bird"],
  ["ニジキジ","bird"],["サンケイ","bird"],["ベニジュケイ","bird"],["カンムリセイラン","bird"],
  ["キンケイ","bird"],["ギンケイ","bird"],["オウゴンキンケイ","bird"],["セキショクヤケイ","bird"],
  ["アオミミキジ","bird"],["オウギバト","bird"],["キンバト","bird"],["ミノバト","bird"],
  ["ムネアカカンムリバト","bird"],["ダチョウ","bird"],["ヒクイドリ","bird"],["イヌワシ","bird"],
  ["カササギ","bird"],["タンチョウ","bird"],["ホオジロカンムリヅル","bird"],["アメリカオシ","bird"],
  ["カナダガン","bird"],["ツクシガモ","bird"],["モモイロインコ","bird"],["フンボルトペンギン","bird"],
  // は虫類
  ["ミシシッピアカミミガメ","reptile"],["カミツキガメ","reptile"],["ニホンイシガメ","reptile"],
  ["リクガメ","reptile"],["ニホンカナヘビ","reptile"],["ヒバカリ","reptile"],["アオダイショウ","reptile"],
  ["ニホンヤモリ","reptile"],
  // 両生類
  ["ウシガエル","amphibian"],["ニホンアマガエル","amphibian"],["トノサマガエル","amphibian"],
  ["サンショウウオ","amphibian"],["アカハライモリ","amphibian"],["ツチガエル","amphibian"],
];

let animals = []; // {id, name, cat, custom}
let records = {}; // id -> {photo, note, unavailable}
let activeTab = 'all';
let activeId = null;
let db = null;

function slugify(name){
  return 'a_' + name.replace(/[^\p{L}\p{N}]/gu,'').toLowerCase();
}

function buildAnimals(){
  animals = BASE_ANIMALS.map(([name,cat]) => ({id: slugify(name), name, cat, custom:false}));
}

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('kumamoto-zoo-zukan', 1);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('records')) d.createObjectStore('records');
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
    };
    req.onsuccess = (e)=> resolve(e.target.result);
    req.onerror = (e)=> reject(e);
  });
}
function idbGet(store, key){
  return new Promise((resolve)=>{
    try{
      const tx = db.transaction(store,'readonly');
      const r = tx.objectStore(store).get(key);
      r.onsuccess = ()=> resolve(r.result || null);
      r.onerror = ()=> resolve(null);
    }catch(e){ resolve(null); }
  });
}
function idbSet(store, key, value){
  return new Promise((resolve)=>{
    try{
      const tx = db.transaction(store,'readwrite');
      tx.objectStore(store).put(value, key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> resolve(false);
    }catch(e){ resolve(false); }
  });
}
function idbDelete(store, key){
  return new Promise((resolve)=>{
    try{
      const tx = db.transaction(store,'readwrite');
      tx.objectStore(store).delete(key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> resolve(false);
    }catch(e){ resolve(false); }
  });
}
function idbGetAll(store){
  return new Promise((resolve)=>{
    try{
      const tx = db.transaction(store,'readonly');
      const os = tx.objectStore(store);
      const keysReq = os.getAllKeys();
      const valsReq = os.getAll();
      let keys, vals;
      keysReq.onsuccess = ()=>{ keys = keysReq.result; check(); };
      valsReq.onsuccess = ()=>{ vals = valsReq.result; check(); };
      function check(){
        if(keys && vals){
          const out = {};
          keys.forEach((k,i)=> out[k] = vals[i]);
          resolve(out);
        }
      }
      tx.onerror = ()=> resolve({});
    }catch(e){ resolve({}); }
  });
}

async function loadAll(){
  buildAnimals();
  const customList = await idbGet('meta','customAnimals');
  if(customList && Array.isArray(customList)){
    customList.forEach(a => animals.push(a));
  }
  records = await idbGetAll('records');
}

async function saveCustomAnimals(){
  const customs = animals.filter(a=>a.custom);
  await idbSet('meta','customAnimals', customs);
}

function catInfo(id){ return CATS.find(c=>c.id===id) || CATS[0]; }

function computeProgress(){
  const eligible = animals.filter(a => !(records[a.id] && records[a.id].unavailable));
  const done = eligible.filter(a => records[a.id] && records[a.id].photo);
  return {done: done.length, total: eligible.length};
}

function renderTabs(){
  const row = document.getElementById('tabRow');
  row.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'tab' + (activeTab==='all' ? ' active':'');
  allBtn.textContent = 'すべて';
  allBtn.onclick = ()=>{ activeTab='all'; render(); };
  row.appendChild(allBtn);
  CATS.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'tab' + (activeTab===c.id ? ' active':'');
    b.textContent = c.emoji + ' ' + c.label;
    b.onclick = ()=>{ activeTab=c.id; render(); };
    row.appendChild(b);
  });
}

function render(){
  renderTabs();
  const prog = computeProgress();
  document.getElementById('progressCount').textContent = prog.done;
  document.getElementById('progressTotal').textContent = prog.total;
  document.getElementById('progressFill').style.width = (prog.total? (prog.done/prog.total*100):0) + '%';

  const query = document.getElementById('searchBox').value.trim();
  const groupsEl = document.getElementById('groups');
  groupsEl.innerHTML = '';

  const cats = activeTab==='all' ? CATS.map(c=>c.id) : [activeTab];
  let anyShown = false;

  cats.forEach(catId=>{
    let list = animals.filter(a=>a.cat===catId);
    if(query) list = list.filter(a=>a.name.includes(query));
    if(list.length===0) return;
    anyShown = true;
    const info = catInfo(catId);
    const section = document.createElement('section');
    section.className = 'group';
    const doneInCat = list.filter(a=>records[a.id] && records[a.id].photo).length;
    section.innerHTML = `<div class="group-title"><h2>${info.emoji} ${info.label}</h2><span>${doneInCat}/${list.length}</span></div>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    list.forEach(a=>{
      const rec = records[a.id];
      const card = document.createElement('div');
      card.className = 'card' + (rec && rec.unavailable ? ' unavailable':'');
      card.onclick = ()=> openSheet(a.id);
      let thumbInner;
      if(rec && rec.photo){
        thumbInner = `<img src="${rec.photo}" alt="${a.name}">`;
      }else{
        thumbInner = `<span class="emoji">${catInfo(a.cat).emoji}</span>`;
      }
      card.innerHTML = `
        <div class="thumb">
          ${thumbInner}
          ${rec && rec.photo ? '<div class="stamp">✓</div>' : ''}
          ${rec && rec.unavailable ? '<div class="flag">見れない</div>' : ''}
        </div>
        <div class="cardbody">
          <div class="cname">${a.name}</div>
          <div class="ccat">${catInfo(a.cat).label}${a.custom ? '・追加' : ''}</div>
        </div>`;
      grid.appendChild(card);
    });
    section.appendChild(grid);
    groupsEl.appendChild(section);
  });

  if(!anyShown){
    groupsEl.innerHTML = '<div class="empty">見つかりませんでした</div>';
  }
}

// ---- Detail sheet ----
function openSheet(id){
  activeId = id;
  const a = animals.find(x=>x.id===id);
  const rec = records[id] || {};
  document.getElementById('sheetName').textContent = a.name;
  document.getElementById('sheetCat').textContent = catInfo(a.cat).label;
  const thumb = document.getElementById('sheetThumb');
  thumb.innerHTML = rec.photo ? `<img src="${rec.photo}">` : `<span class="emoji">${catInfo(a.cat).emoji}</span>`;
  document.getElementById('retakeRow').style.display = rec.photo ? 'flex' : 'none';
  document.getElementById('noteField').value = rec.note || '';
  setSwitch(document.getElementById('unavailSwitch'), !!rec.unavailable);
  document.getElementById('overlay').classList.add('open');
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
  activeId = null;
}
function setSwitch(el, on){
  el.classList.toggle('on', on);
  el.dataset.on = on ? '1' : '0';
}

async function persistCurrent(){
  if(!activeId) return;
  const cur = records[activeId] || {};
  await idbSet('records', activeId, cur);
  records[activeId] = cur;
}

document.getElementById('closeSheet').onclick = closeSheet;
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeSheet(); });

document.getElementById('takePhotoBtn').onclick = ()=> document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = async (e)=>{
  const file = e.target.files[0];
  if(!file || !activeId) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    const dataUrl = await downscaleImage(reader.result, 900);
    const cur = records[activeId] || {};
    cur.photo = dataUrl;
    records[activeId] = cur;
    await persistCurrent();
    document.getElementById('sheetThumb').innerHTML = `<img src="${dataUrl}">`;
    document.getElementById('retakeRow').style.display = 'flex';
    render();
  };
  reader.readAsDataURL(file);
  e.target.value = '';
};

function downscaleImage(dataUrl, maxSize){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      let {width,height} = img;
      if(width>height && width>maxSize){ height = height*(maxSize/width); width=maxSize; }
      else if(height>maxSize){ width = width*(maxSize/height); height=maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width=width; canvas.height=height;
      canvas.getContext('2d').drawImage(img,0,0,width,height);
      resolve(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = ()=> resolve(dataUrl);
    img.src = dataUrl;
  });
}

document.getElementById('removePhotoBtn').onclick = async ()=>{
  if(!activeId) return;
  const cur = records[activeId] || {};
  delete cur.photo;
  records[activeId] = cur;
  await persistCurrent();
  document.getElementById('sheetThumb').innerHTML = `<span class="emoji">🐾</span>`;
  document.getElementById('retakeRow').style.display = 'none';
  render();
};

document.getElementById('noteField').addEventListener('change', async (e)=>{
  if(!activeId) return;
  const cur = records[activeId] || {};
  cur.note = e.target.value;
  records[activeId] = cur;
  await persistCurrent();
});

document.getElementById('unavailSwitch').onclick = async ()=>{
  if(!activeId) return;
  const el = document.getElementById('unavailSwitch');
  const newVal = el.dataset.on !== '1';
  setSwitch(el, newVal);
  const cur = records[activeId] || {};
  cur.unavailable = newVal;
  records[activeId] = cur;
  await persistCurrent();
  render();
};

document.getElementById('deleteEntryBtn').onclick = async ()=>{
  if(!activeId) return;
  const a = animals.find(x=>x.id===activeId);
  if(!confirm(`「${a.name}」をリストから削除しますか？`)) return;
  animals = animals.filter(x=>x.id!==activeId);
  delete records[activeId];
  await idbDelete('records', activeId);
  await saveCustomAnimals();
  closeSheet();
  render();
};

// ---- Add sheet ----
let newCat = 'mammal';
function renderNewCatRow(){
  const row = document.getElementById('newCatRow');
  row.innerHTML = '';
  CATS.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'tab' + (newCat===c.id ? ' active':'');
    b.textContent = c.emoji + ' ' + c.label;
    b.onclick = ()=>{ newCat = c.id; renderNewCatRow(); };
    row.appendChild(b);
  });
}
document.getElementById('openAddBtn').onclick = ()=>{
  document.getElementById('newName').value='';
  newCat='mammal';
  renderNewCatRow();
  document.getElementById('addOverlay').classList.add('open');
};
document.getElementById('closeAddSheet').onclick = ()=> document.getElementById('addOverlay').classList.remove('open');
document.getElementById('addOverlay').addEventListener('click',(e)=>{ if(e.target.id==='addOverlay') document.getElementById('addOverlay').classList.remove('open'); });

document.getElementById('confirmAddBtn').onclick = async ()=>{
  const name = document.getElementById('newName').value.trim();
  if(!name) return;
  const id = slugify(name) + '_' + Date.now();
  animals.push({id, name, cat:newCat, custom:true});
  await saveCustomAnimals();
  document.getElementById('addOverlay').classList.remove('open');
  render();
};

document.getElementById('searchBox').addEventListener('input', render);

(async function init(){
  try{
    db = await openDB();
  }catch(e){ db = null; }
  await loadAll();
  render();
})();
</script>
