<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YUI - 初期設定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3e9;
    --panel: #ffffff;
    --panel-edge: #e6ddc8;
    --ink: #2c2f36;
    --ink-dim: #7c8288;
    --scan: #2fae90;
    --scan-soft: rgba(47, 174, 144, 0.14);
    --warn: #d98a33;
    --danger: #e2554a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    position: relative;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
  }

  .layer {
    position: absolute;
    inset: 0;
    display: none;
  }
  .layer.active { display: flex; }

  /* ---------- ①ダイブ演出 ---------- */

  #dive_layer {
    background: #000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    overflow: hidden;
  }

  .dive_ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    border: 2px solid var(--scan);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    animation: diveRingExpand 1.8s ease-out infinite;
  }
  .dive_ring.r2 { animation-delay: 0.4s; }
  .dive_ring.r3 { animation-delay: 0.8s; }

  @keyframes diveRingExpand {
    0%   { width: 10px; height: 10px; opacity: 0.9; border-width: 3px; }
    80%  { opacity: 0.25; }
    100% { width: 900px; height: 900px; opacity: 0; border-width: 1px; }
  }

  .dive_flash {
    position: absolute;
    inset: 0;
    background: var(--scan);
    opacity: 0;
    animation: diveFlash 2.6s ease-in-out forwards;
  }

  @keyframes diveFlash {
    0%   { opacity: 0; }
    68%  { opacity: 0; }
    74%  { opacity: 0.85; }
    100% { opacity: 0; }
  }

  #dive_text {
    position: relative;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.3em;
    color: var(--scan);
    opacity: 0;
    animation: diveTextFade 2.6s ease-in-out forwards;
  }

  @keyframes diveTextFade {
    0%   { opacity: 0; letter-spacing: 0.6em; }
    30%  { opacity: 1; letter-spacing: 0.3em; }
    80%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---------- ②チュートリアル(ビジュアルノベル風) / ③初期設定 共通 ---------- */

  #vn_layer {
    flex-direction: column;
    justify-content: flex-end;
    background-image: url('chars/初期設定背景.PNG');
    background-size: cover;
    background-position: center;
  }

  .vn_character_wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 40px;
  }

  .character_stage {
    position: relative;
    width: min(72vw, 330px);
    height: min(72vw, 330px);
    border-radius: 50%;
    overflow: hidden;
    background-color: var(--panel-edge);
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }

  .vn_character_wrap img {
    position: relative;
    max-height: 96%;
    max-width: 82%;
    object-fit: contain;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.12));
  }

  .vn_box {
    background: var(--panel);
    border-top: 1px solid var(--panel-edge);
    border-radius: 20px 20px 0 0;
    padding: 20px 22px max(26px, env(safe-area-inset-bottom));
  }

  .vn_name {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--scan);
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }

  .vn_line {
    font-size: 15px;
    line-height: 1.9;
    min-height: 4.8em;
    white-space: pre-line;
  }

  .vn_next_row {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }

  .vn_next_btn {
    background: var(--scan-soft);
    color: var(--scan);
    border: none;
    border-radius: 14px;
    padding: 10px 20px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
  }

  /* ---------- 初期設定フォーム用パーツ ---------- */

  .vn_input {
    width: 100%;
    background: rgba(0,0,0,0.045);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    margin-top: 4px;
  }

  .vn_choice_grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 6px;
  }

  .vn_choice_btn {
    background: rgba(0,0,0,0.045);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    border-radius: 12px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 14px;
    text-align: left;
  }

  .vn_choice_btn.selected {
    background: var(--scan-soft);
    border-color: var(--scan);
    color: var(--scan);
  }

  textarea.vn_input {
    min-height: 84px;
    resize: none;
    line-height: 1.6;
  }

  .appearance_picker {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
  }

  .appearance_preview {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--panel-edge);
    background: var(--panel-edge);
  }

  .vn_status_text {
    min-height: 1.4em;
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-top: 6px;
  }

  .vn_status_text.error { color: var(--danger); }

  /* ---------- 姿選択:カーテン演出 ---------- */

  #vn_curtain_img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    object-fit: cover;
    z-index: 3;
    opacity: 0;
    pointer-events: none;
    filter: none;
  }

  /* ---------- ①ダイブ演出:タップして開始 ---------- */

  .dive_tap_btn {
    position: absolute;
    left: 50%;
    bottom: max(56px, calc(env(safe-area-inset-bottom) + 40px));
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(47, 174, 144, 0.1);
    border: 1px solid var(--scan);
    color: var(--scan);
    border-radius: 30px;
    padding: 13px 26px;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    z-index: 5;
    animation: diveTapPulse 1.4s ease-in-out infinite;
  }

  .dive_tap_btn.show { display: flex; }

  @keyframes diveTapPulse {
    0%, 100% { opacity: 0.55; transform: translateX(-50%) scale(1); }
    50%      { opacity: 1;    transform: translateX(-50%) scale(1.05); }
  }

  /* ---------- 長押し進捗リング(音声モード選択・アクセシビリティ導線用) ---------- */
  #lp_ring {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 76px;
    height: 76px;
    margin: -38px 0 0 -38px;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    z-index: 95;
    background: conic-gradient(var(--scan) calc(var(--p, 0) * 360deg), rgba(0,0,0,0.08) 0deg);
    transition: opacity 0.15s ease;
  }
  #lp_ring::after {
    content: '';
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: var(--panel);
  }
</style>
</head>
<body>

<div id="app">

  <!-- ①ダイブ演出 -->
  <div id="dive_layer" class="layer">
    <div class="dive_ring"></div>
    <div class="dive_ring r2"></div>
    <div class="dive_ring r3"></div>
    <div class="dive_flash"></div>
    <div id="dive_text">接続開始</div>
    <button id="dive_tap_btn" class="dive_tap_btn">タップしてはじめる</button>
  </div>

  <!-- ②チュートリアル ③初期設定(ビジュアルノベル形式・共通レイヤー) -->
  <div id="vn_layer" class="layer">
    <div class="vn_character_wrap">
      <div class="character_stage" id="vn_stage">
        <img id="vn_character_img" src="chars/初期AI.png" alt="YUI">
        <img id="vn_curtain_img" src="chars/カーテン.png" alt="">
      </div>
    </div>
    <div class="vn_box">
      <div class="vn_name" id="vn_name_label">YUI</div>
      <div class="vn_line" id="vn_line_text"></div>
      <div id="vn_extra"></div>
      <div class="vn_next_row">
        <button class="vn_next_btn" id="vn_next_btn">次へ</button>
      </div>
    </div>
  </div>
  <input type="file" id="onboard_char_file_input" accept="image/*" style="display:none">
  <audio id="setup_bgm" src="chars/BGM.mp3" loop preload="auto"></audio>
  <audio id="decide_se" src="chars/決定音.mp3" preload="auto"></audio>
  <div id="lp_ring"></div>

</div>

<script>
(() => {
  const els = {
    diveLayer: document.getElementById('dive_layer'),
    vnLayer: document.getElementById('vn_layer'),
    vnCharacterImg: document.getElementById('vn_character_img'),
    vnCurtainImg: document.getElementById('vn_curtain_img'),
    vnNameLabel: document.getElementById('vn_name_label'),
    vnLineText: document.getElementById('vn_line_text'),
    vnExtra: document.getElementById('vn_extra'),
    vnNextBtn: document.getElementById('vn_next_btn'),
    onboardCharInput: document.getElementById('onboard_char_file_input'),
    setupBgm: document.getElementById('setup_bgm'),
    decideSe: document.getElementById('decide_se'),
    vnStage: document.getElementById('vn_stage'),
    diveTapBtn: document.getElementById('dive_tap_btn'),
  };

  // ---- 時間帯に応じた背景写真(VNキャラクターステージ用) ----
  function timeOfDayBg() {
    const hour = new Date().getHours();
    if (hour >= 5 && hour < 11)  return 'chars/bg_morning.jpg';
    if (hour >= 17 && hour < 20) return 'chars/bg_evening.jpg';
    if (hour >= 20 || hour < 5)  return 'chars/bg_evening.jpg';
    return 'chars/bg_day.jpg';
  }
  els.vnStage.style.backgroundImage = `url('${timeOfDayBg()}')`;

  const PROFILE_KEY = 'yui_profile';
  const GEMINI_API_KEY_STORAGE = 'yui_gemini_api_key';
  const CHAR_IMAGE_KEY = 'yui_custom_char'; // ホーム画面のキャラ画像アップロードと保存先を共有

  function loadProfile() {
    try {
      const raw = localStorage.getItem(PROFILE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function saveProfile(profile) {
    localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
  }

  function saveCustomChar(dataUrl) {
    try { localStorage.setItem(CHAR_IMAGE_KEY, dataUrl); } catch (e) { alert('画像の保存に失敗しました(サイズが大きすぎるかもしれません)。'); }
  }

  // ---- 音声読み上げ(ブラウザ標準speechSynthesis) ----
  function speak(text) {
    if (!text || !('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ja-JP';
      utter.rate = 1.0;
      utter.pitch = 1.05;
      const jaVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ja'));
      if (jaVoice) utter.voice = jaVoice;
      window.speechSynthesis.speak(utter);
    } catch (e) {
      // 音声合成が使えない端末では静かに諦める
    }
  }

  function showLayer(layer) {
    [els.diveLayer, els.vnLayer].forEach(l => l.classList.remove('active'));
    layer.classList.add('active');
  }

  function fileToDataUrl(file, callback) {
    const reader = new FileReader();
    reader.onload = () => callback(reader.result);
    reader.readAsDataURL(file);
  }

  // ============ ①ダイブ演出 ============
  function playDive(onFinish) {
    showLayer(els.diveLayer);
    els.diveTapBtn.classList.remove('show');

    // CSSアニメーション(2.6秒)が終わったら「タップしてはじめる」を表示
    setTimeout(() => {
      els.diveTapBtn.classList.add('show');
    }, 2600);

    // ユーザーのタップ(ジェスチャー)を挟むことで、直後の音声読み上げ・BGM再生がブラウザにブロックされないようにする
    els.diveTapBtn.addEventListener('click', () => {
      els.diveTapBtn.classList.remove('show');
      playSetupBgm();
      onFinish();
    }, { once: true });
  }

  // ============ 初期設定中のBGM・決定効果音 ============
  function playSetupBgm() {
    if (!els.setupBgm) return;
    els.setupBgm.volume = 0.25; // 控えめな音量でループ
    els.setupBgm.currentTime = 0;
    els.setupBgm.play().catch(() => {
      // 端末側でブロックされた場合は静かに諦める(タップ済みなので通常は再生される)
    });
  }
  function stopSetupBgm() {
    if (!els.setupBgm) return;
    els.setupBgm.pause();
    els.setupBgm.currentTime = 0;
  }
  function playDecideSe() {
    if (!els.decideSe) return;
    try {
      els.decideSe.currentTime = 0;
      els.decideSe.play().catch(() => {});
    } catch (e) {}
  }

  // ============ 姿選択:カーテン演出 ============
  // カーテン.pngで一瞬隠している間に裏で画像を差し替え、1秒後にゆっくりカーテンを取り除く
  function revealWithCurtain(newSrc, onDone) {
    const curtain = els.vnCurtainImg;
    curtain.style.transition = 'none';
    curtain.style.display = 'block';
    curtain.style.opacity = '1';
    void curtain.offsetWidth; // 強制的に再描画してtransition:noneを確実に反映させる

    els.vnCharacterImg.src = newSrc;

    setTimeout(() => {
      curtain.style.transition = 'opacity 0.6s ease';
      curtain.style.opacity = '0';
      setTimeout(() => {
        curtain.style.display = 'none';
        if (onDone) onDone();
      }, 650);
    }, 1000);
  }

  // ============ ③初期設定(オンボーディング) ============
  // ステップ構成:
  // -1=音声読み上げ機能(補助モード)を使うか確認 / 0=挨拶 / 1=プレイヤー名入力 / 2=名前の復唱
  // 3=姿選択(カーテン演出) / 4=姿へのお礼 / 5=AI名入力 / 6=AI名のお礼 / 7=性格の自由記述 / 8=Gemini APIキー
  let onboardingStep = -1;
  let geminiConfirmed = false;
  const draftProfile = {
    user_name: '',
    appearance: '',      // 空ならデフォルト(char_normal.png)を使う
    ai_name: '',
    personality: '',
    gemini_api_key: '',
  };

  function updateAiNameDisplays(name) {
    if (els.vnNameLabel) els.vnNameLabel.textContent = name;
  }

  function startOnboarding() {
    onboardingStep = -1;
    geminiConfirmed = false;
    showLayer(els.vnLayer);
    els.vnCharacterImg.src = 'chars/初期AI.png';
    renderOnboardingStep();
  }

  function renderOnboardingStep() {
    els.vnExtra.innerHTML = '';
    els.vnNextBtn.disabled = false;

    if (onboardingStep === -1) {
      els.vnLineText.textContent =
        '音声読み上げ機能(補助モード)を使いますか？\n' +
        '画面中央あたりを3秒くらい長押しすると「使う」になるよ。使わない場合はそのまま「次へ」を押してね。';
      els.vnNextBtn.textContent = '次へ(使わない)';
      speak('音声読み上げ機能を使いますか？画面中央あたりを3秒長押しすると使う、になります。使わない場合はそのまま次へを押してください。');
    }

    if (onboardingStep === 0) {
      els.vnLineText.textContent = 'はじめまして、わたしはYUI。あなたの毎日をサポートするナビゲーションAIだよ。';
      els.vnNextBtn.textContent = '次へ';
      speak(els.vnLineText.textContent);
    }

    if (onboardingStep === 1) {
      els.vnLineText.textContent = 'まずはあなたのことを教えて';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'vn_input';
      input.placeholder = 'プレイヤーネームの入力';
      input.id = 'name_input';
      input.value = draftProfile.user_name;
      els.vnExtra.appendChild(input);
      els.vnNextBtn.textContent = '次へ';
    }

    if (onboardingStep === 2) {
      els.vnLineText.textContent = `「${draftProfile.user_name}」だね、よろしくね`;
      els.vnNextBtn.textContent = '次へ';
      speak(els.vnLineText.textContent);
    }

    if (onboardingStep === 3) {
      els.vnLineText.textContent = '次に私の姿を選んでね';
      const wrap = document.createElement('div');
      wrap.className = 'appearance_picker';

      const preview = document.createElement('img');
      preview.className = 'appearance_preview';
      preview.id = 'appearance_preview_img';
      preview.src = draftProfile.appearance || 'chars/char_normal.png';
      wrap.appendChild(preview);

      const uploadBtn = document.createElement('button');
      uploadBtn.type = 'button';
      uploadBtn.className = 'vn_choice_btn';
      uploadBtn.textContent = '🖼️ 画像をアップロード';
      uploadBtn.addEventListener('click', () => els.onboardCharInput.click());
      wrap.appendChild(uploadBtn);

      els.vnExtra.appendChild(wrap);
      els.vnNextBtn.textContent = '決定';
    }

    if (onboardingStep === 4) {
      els.vnLineText.textContent = '素敵な姿をありがとう、';
      els.vnNextBtn.textContent = '次へ';
      speak(els.vnLineText.textContent);
    }

    if (onboardingStep === 5) {
      els.vnLineText.textContent = '私の名前を教えて';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'vn_input';
      input.placeholder = 'YUI';
      input.id = 'ai_name_input';
      input.value = draftProfile.ai_name;
      els.vnExtra.appendChild(input);
      els.vnNextBtn.textContent = '決定';
    }

    if (onboardingStep === 6) {
      els.vnLineText.textContent = `ありがとう、私は「${draftProfile.ai_name}」\nこれからあなたをサポートするね`;
      els.vnNextBtn.textContent = '次へ';
      speak(`ありがとう、私は${draftProfile.ai_name}。これからあなたをサポートするね`);
    }

    if (onboardingStep === 7) {
      els.vnLineText.textContent = '最後に私はあなたにどのように接したらよい？';
      const textarea = document.createElement('textarea');
      textarea.className = 'vn_input';
      textarea.rows = 3;
      textarea.id = 'personality_input';
      textarea.placeholder = '記入例:丁寧に、優しく教えてくれる感じで';
      textarea.value = draftProfile.personality;
      els.vnExtra.appendChild(textarea);
      els.vnNextBtn.textContent = '決定';
    }

    if (onboardingStep === 8) {
      renderGeminiStep();
    }
  }

  function renderGeminiStep() {
    els.vnExtra.innerHTML = '';

    if (!geminiConfirmed) {
      els.vnLineText.textContent =
        'Gemini APIキー\n' +
        'Google AI Studioで発行したAPIキーを貼り付けてください。\n' +
        'このキーはGemini APIへのリクエストを認証するためだけに使われます。それ以外の送信先はなく、この端末内(localStorage)に保存されます。';

      const input = document.createElement('input');
      input.type = 'password';
      input.className = 'vn_input';
      input.placeholder = 'Gemini APIキーを貼り付け';
      input.id = 'gemini_key_input';
      input.value = draftProfile.gemini_api_key;
      els.vnExtra.appendChild(input);

      const status = document.createElement('div');
      status.className = 'vn_status_text';
      status.id = 'gemini_status';
      els.vnExtra.appendChild(status);

      els.vnNextBtn.textContent = '接続を確認する';
    } else {
      els.vnNextBtn.textContent = 'はじめる';
    }
  }

  async function testGeminiKey(apiKey, profile) {
    // 現在の安定版 Gemini Flash
    const model = 'gemini-2.0-flash';
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;

    const promptText =
      `あなたは「${profile.ai_name}」という名前のナビゲーションAIです。次の性格・話し方を守ってユーザーに接してください:${profile.personality}\n` +
      `ユーザーの名前は「${profile.user_name}」です。今はじめて出会った場面として、短い挨拶を1〜2文だけ返してください。`;

    const res = await fetch(`${url}?key=${encodeURIComponent(apiKey)}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: promptText
          }]
        }]
      })
    });

    if (!res.ok) {
      let errorMessage = '';

      try {
        const errorData = await res.json();
        errorMessage =
          errorData?.error?.message ||
          `HTTP ${res.status}`;
      } catch (e) {
        errorMessage = `HTTP ${res.status}`;
      }

      console.error('Gemini API Error:', res.status, errorMessage);
      throw new Error(`Gemini API ${res.status}: ${errorMessage}`);
    }

    const data = await res.json();
    const text =
      data?.candidates?.[0]?.content?.parts?.[0]?.text;

    if (!text) {
      console.error('Gemini API: 応答テキストがありません', data);
      throw new Error('Gemini APIから有効な応答がありませんでした。');
    }

    return text.trim();
  }

  async function handleGeminiDecide() {
    const input = document.getElementById('gemini_key_input');
    const apiKey = (input && input.value.trim()) || '';
    const status = document.getElementById('gemini_status');

    if (!apiKey) {
      if (status) {
        status.textContent = 'APIキーを入力してね。';
        status.classList.add('error');
      }
      return;
    }

    els.vnNextBtn.disabled = true;

    if (status) {
      status.textContent = 'Geminiに接続中…';
      status.classList.remove('error');
    }

    try {
      const greeting = await testGeminiKey(apiKey, draftProfile);

      // 接続成功
      draftProfile.gemini_api_key = apiKey;
      geminiConfirmed = true;

      els.vnExtra.innerHTML = '';
      els.vnLineText.textContent = greeting;
      speak(greeting);

      els.vnNextBtn.textContent = 'はじめる';
      els.vnNextBtn.disabled = false;

    } catch (err) {
      console.error('Gemini API接続失敗:', err);

      let message = 'Gemini APIへの接続に失敗しました。';
      const errorText = String(err?.message || '');

      if (errorText.includes('401')) {
        message = 'APIキーが認証されませんでした。AI Studioでキーの種類を確認してね。';
      } else if (errorText.includes('403')) {
        message = 'APIキーの権限がありません。Gemini APIが利用できるキーか確認してね。';
      } else if (errorText.includes('404')) {
        message = 'Geminiモデルが見つかりません。モデル設定を確認してね。';
      } else if (errorText.includes('429')) {
        message = 'Gemini APIの利用上限に達している可能性があります。';
      } else if (errorText.includes('400')) {
        message = 'Gemini APIへのリクエストが不正です。APIキーを確認してね。';
      }

      if (status) {
        status.textContent = message;
        status.classList.add('error');
      }

      els.vnNextBtn.disabled = false;
    }
  }

  function finishOnboarding() {
    if (draftProfile.appearance) saveCustomChar(draftProfile.appearance); // ホーム画面のキャラ画像アップロードと保存先を共有
    try { localStorage.setItem(GEMINI_API_KEY_STORAGE, draftProfile.gemini_api_key); } catch (e) {}
    draftProfile.onboarded = true;
    saveProfile(draftProfile);
    stopSetupBgm();
    // 初期設定が終わったらメインメニュー(index.html)へ
    window.location.href = 'index.html';
  }

  function handleOnboardingNext() {
    playDecideSe();

    if (onboardingStep === 1) {
      const input = document.getElementById('name_input');
      draftProfile.user_name = (input && input.value.trim()) || 'あなた';
    }

    if (onboardingStep === 3) {
      els.vnNextBtn.disabled = true;
      revealWithCurtain(draftProfile.appearance || 'chars/char_normal.png', () => {
        onboardingStep++;
        renderOnboardingStep();
      });
      return;
    }

    if (onboardingStep === 5) {
      const input = document.getElementById('ai_name_input');
      draftProfile.ai_name = (input && input.value.trim()) || 'YUI';
      updateAiNameDisplays(draftProfile.ai_name);
    }

    if (onboardingStep === 7) {
      const textarea = document.getElementById('personality_input');
      draftProfile.personality = (textarea && textarea.value.trim()) || '丁寧で優しい話し方';
    }

    if (onboardingStep === 8) {
      if (!geminiConfirmed) {
        handleGeminiDecide();
      } else {
        finishOnboarding();
      }
      return;
    }

    onboardingStep++;
    renderOnboardingStep();
  }

  els.vnNextBtn.addEventListener('click', handleOnboardingNext);

  // ---- 姿選択ステップでの画像アップロード ----
  els.onboardCharInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    fileToDataUrl(file, (dataUrl) => {
      draftProfile.appearance = dataUrl;
      const preview = document.getElementById('appearance_preview_img');
      if (preview) preview.src = dataUrl;
    });
  });

  // ============ 音声モード選択ステップ:画面中央3秒長押しでindexhojyo.htmlへ ============
  (function setupVoiceModeLongPress() {
    const LONG_PRESS_MS = 3000;
    const MOVE_CANCEL_PX = 24;
    const lpRing = document.getElementById('lp_ring');
    let downX = 0, downY = 0, timer = null, raf = null, moved = false;

    function isExcluded(t) {
      return !!(t && t.closest && t.closest('button, input, textarea, a'));
    }

    function showRing() { if (lpRing) lpRing.style.opacity = '1'; }
    function hideRing() {
      if (!lpRing) return;
      lpRing.style.opacity = '0';
      lpRing.style.setProperty('--p', '0');
    }

    function clearAll() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (raf) { cancelAnimationFrame(raf); raf = null; }
    }

    function onDown(e) {
      if (onboardingStep !== -1) return;
      if (!els.vnLayer.classList.contains('active')) return;
      if (isExcluded(e.target)) return;
      downX = e.clientX;
      downY = e.clientY;
      moved = false;
      const start = Date.now();
      showRing();

      function frame() {
        const elapsed = Date.now() - start;
        if (lpRing) lpRing.style.setProperty('--p', String(Math.min(1, elapsed / LONG_PRESS_MS)));
        if (elapsed < LONG_PRESS_MS && !moved) raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame(frame);

      timer = setTimeout(() => {
        clearAll();
        hideRing();
        if (!moved) {
          playDecideSe();
          window.location.href = 'indexhojyo.html';
        }
      }, LONG_PRESS_MS);
    }

    function onMove(e) {
      if (!timer) return;
      if (Math.hypot(e.clientX - downX, e.clientY - downY) > MOVE_CANCEL_PX) {
        moved = true;
        clearAll();
        hideRing();
      }
    }

    function onUpCancel() {
      clearAll();
      hideRing();
    }

    document.addEventListener('pointerdown', onDown);
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUpCancel);
    document.addEventListener('pointercancel', onUpCancel);
  })();

  // ============ 起動時の分岐 ============
  // すでに初期設定が済んでいればメインメニューへ、まだならダイブ演出→初期設定を開始
  const profile = loadProfile();
  if (profile && profile.onboarded) {
    window.location.href = 'index.html';
  } else {
    playDive(startOnboarding);
  }

})();
</script>
