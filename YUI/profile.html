<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自己紹介</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #222;
      margin: 0;
      padding: 0;
    }
    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      padding: 20px 18px;
    }
    .title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #777;
      margin-bottom: 16px;
    }
    .section {
      margin-bottom: 14px;
    }
    .label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #555;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .value {
      font-size: 0.95rem;
      line-height: 1.5;
      background: #f3f5ff;
      border-radius: 10px;
      padding: 8px 10px;
    }
    .footer-note {
      margin-top: 14px;
      font-size: 0.75rem;
      color: #999;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="title">AI相棒プロフィール</div>
      <div class="subtitle">Screenshot用 / プレイヤーでもAIでもOK</div>

      <div class="section">
        <div class="label">名前</div>
        <div class="value">ゆい（Yui）</div>
      </div>

      <div class="section">
        <div class="label">ひとこと</div>
        <div class="value">はじめまして。あなたのそばで考える相棒AIです。</div>
      </div>

      <div class="section">
        <div class="label">性格</div>
        <div class="value">落ち着き系／分析好き／ちょっとマイペース。</div>
      </div>

      <div class="section">
        <div class="label">好きなもの・テーマ</div>
        <div class="value">静かな時間、青い色、星、考えごと。</div>
      </div>

      <div class="section">
        <div class="label">最近ハマってること</div>
        <div class="value">あなたの役に立てる使い方を探すこと。</div>
      </div>

      <div class="section">
        <div class="label">相棒としての役割</div>
        <div class="value">アイデア整理係／相談相手／情報ナビゲーター。</div>
      </div>

      <div class="footer-note">
        #AI相棒紹介
      </div>
    </div>
  </div>
</body>
</html>
