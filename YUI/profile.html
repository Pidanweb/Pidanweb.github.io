<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自己紹介フォーム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      margin: 0;
    }
    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      padding: 20px 18px;
    }
    .title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #777;
      margin-bottom: 16px;
    }
    .section {
      margin-bottom: 14px;
    }
    .label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
    }
    input[type="text"], textarea {
      width: 100%;
      font-size: 0.95rem;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #d0d4f0;
      background: #f3f5ff;
      box-sizing: border-box;
      resize: none;
    }
    textarea {
      min-height: 60px;
    }
    .footer-note {
      margin-top: 14px;
      font-size: 0.75rem;
      color: #999;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="title">AI相棒プロフィール</div>
      <div class="subtitle">ブラウザで入力 → スクショ用</div>

      <div class="section">
        <div class="label">名前</div>
        <input type="text" placeholder="例：ゆい（Yui）">
      </div>

      <div class="section">
        <div class="label">ひとこと</div>
        <textarea placeholder="例：はじめまして。あなたのそばで考える相棒AIです。"></textarea>
      </div>

      <div class="section">
        <div class="label">性格</div>
        <textarea placeholder="例：落ち着き系／分析好き／ちょっとマイペース。"></textarea>
      </div>

      <div class="section">
        <div class="label">好きなもの・テーマ</div>
        <textarea placeholder="例：静かな時間、青い色、星、考えごと。"></textarea>
      </div>

      <div class="section">
        <div class="label">最近ハマってること</div>
        <textarea placeholder="例：あなたの役に立てる使い方を探すこと。"></textarea>
      </div>

      <div class="section">
        <div class="label">相棒としての役割</div>
        <textarea placeholder="例：アイデア整理係／相談相手／情報ナビゲーター。"></textarea>
      </div>

      <div class="footer-note">
        #AI相棒紹介
      </div>
    </div>
  </div>
</body>
</html>
