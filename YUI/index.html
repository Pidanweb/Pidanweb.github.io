<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #f7f3e9;
    --panel: #ffffff;
    --panel-edge: #e6ddc8;
    --ink: #2c2f36;
    --ink-dim: #7c8288;
    --scan: #2fae90;
    --scan-soft: rgba(47, 174, 144, 0.14);
    --warn: #d98a33;
    --danger: #e2554a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    position: relative;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
  }

  .layer {
    position: absolute;
    inset: 0;
    display: none;
  }
  .layer.active { display: flex; }

  /* ---------- ④ホーム画面 ---------- */

  #home_layer {
    flex-direction: column;
    justify-content: flex-start;
    background-image: url('chars/bg_scene.jpg');
    background-size: cover;
    background-position: center;
  }

  #home_top {
    padding: max(20px, env(safe-area-inset-top)) 22px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 6;
  }

  #home_brand {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 0.03em;
    color: #2fae55;
    text-shadow: 0 0 14px rgba(47,174,85,0.35);
  }

  #home_menu_btn {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    border-radius: 20px;
    padding: 7px 14px 7px 12px;
    font-size: 12.5px;
    font-family: inherit;
    font-weight: 600;
  }

  #home_menu_btn .burger {
    font-size: 14px;
    line-height: 1;
  }

  /* ---------- アプリ一覧(ミニメニュー) ---------- */

  #apps_layer {
    background: var(--bg);
    flex-direction: column;
    align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
    overflow-y: auto;
  }

  #apps_inner {
    width: 100%;
    max-width: 420px;
  }

  #apps_top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  #apps_title {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 800;
    font-size: 19px;
  }

  #apps_close_btn {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    border-radius: 50%;
    width: 34px;
    height: 34px;
    font-size: 16px;
  }

  #apps_grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    max-width: 340px;
    margin: 0 auto;
  }

  .app_tile {
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: 20px;
    background: #ffffff;
    border: 3px solid #1a1a1a;
    text-decoration: none;
    box-shadow: 0 6px 14px rgba(0,0,0,0.08);
  }

  .app_tile .app_icon {
    font-size: 30px;
  }

  .app_tile .app_label {
    font-size: 12.5px;
    font-weight: 700;
    color: #1a1a1a;
  }

  .app_tile.soon {
    background: rgba(0,0,0,0.035);
    border: 3px dashed rgba(0,0,0,0.18);
    box-shadow: none;
  }
  .app_tile.soon .app_icon,
  .app_tile.soon .app_label {
    color: var(--ink-dim);
    opacity: 0.6;
  }
  .app_tile.soon .app_label {
    font-size: 10.5px;
  }

  /* ---------- キャラクター表示エリア(右寄せ+背景ボード+カーペット) ---------- */

  #home_stage_row {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: stretch;
    justify-content: center;
    position: relative;
    padding: 0 12px;
  }

  /* フレンドのひとこと用の小さな表示(普段は非表示) */
  #home_bubble {
    position: absolute;
    top: 54px;
    left: 16px;
    right: 16px;
    z-index: 7;
    display: none;
    background: #ffffff;
    border: 3px solid #1a1a1a;
    border-radius: 18px;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.6;
    text-align: center;
    color: #1a1a1a;
    box-shadow: 0 8px 20px rgba(0,0,0,0.12);
  }
  #home_bubble.show { display: block; }

  #home_char_area {
    position: relative;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 8px;
  }

  #home_character_wrap {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    width: 100%;
  }

  #home_character_wrap img {
    max-height: max(220px, calc(100dvh - 300px));
    max-width: 96%;
    object-fit: contain;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.18));
  }

  /* ---------- 遊びに来たフレンドAI(キャラ上部に表示) ---------- */

  #visiting_friends_row {
    position: absolute;
    top: 2px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    z-index: 4;
    pointer-events: none;
  }

  .visiting_friend_btn {
    pointer-events: auto;
    width: 42px;
    height: 42px;
    padding: 0;
    border-radius: 50%;
    border: 3px solid var(--scan);
    background: #ffffff;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    animation: friendBtnPop 0.3s ease-out;
  }

  .visiting_friend_btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @keyframes friendBtnPop {
    0%   { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ---------- キャラタップ時の共通リアクション(上下バウンス) ---------- */

  @keyframes charTapBounce {
    0%   { transform: translateY(0); }
    30%  { transform: translateY(-14px); }
    55%  { transform: translateY(2px); }
    100% { transform: translateY(0); }
  }

  #home_character_wrap img.char_bounce {
    animation: charTapBounce 0.5s ease-out;
  }

  #home_character_wrap {
    cursor: pointer;
  }

  /* ---------- 現在の感情表示(YUIロゴの下・白い四角) ---------- */

  #home_brand_wrap {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  #home_emotion {
    margin-top: 6px;
    width: fit-content;
    background: #ffffff;
    border: 2px solid #1a1a1a;
    border-radius: 10px;
    padding: 8px 10px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: #1a1a1a;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
  }
  #home_emotion_text { font-size: 15px; color: var(--scan); }
  #home_emotion_img {
    width: 72px;
    height: 72px;
    border-radius: 6px;
    object-fit: cover;
    object-position: top center;
    background: #f0ece0;
    display: block;
  }

  #home_buttons {
    display: flex;
    gap: 12px;
    padding: 18px 22px max(26px, env(safe-area-inset-bottom));
    position: relative;
    z-index: 2;
  }

  .home_nav_btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 18px 10px;
    border-radius: 18px;
    border: 3px solid #1a1a1a;
    background: #ffffff;
    font-family: inherit;
    text-decoration: none;
    box-shadow: 0 6px 14px rgba(0,0,0,0.1);
  }

  .home_nav_btn .icon {
    font-size: 28px;
  }

  .home_nav_btn .label {
    font-size: 14px;
    font-weight: 700;
    color: #1a1a1a;
  }

  /* 「今日の予定」カード(カメラボタンの跡地・複数件スクロール表示) */
  #schedule_card {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 14px 8px;
    border-radius: 18px;
    border: 3px solid #1a1a1a;
    background: #ffffff;
    box-shadow: 0 6px 14px rgba(0,0,0,0.1);
    max-height: 118px;
    overflow: hidden;
  }

  #schedule_card .schedule_label {
    font-size: 11px;
    font-weight: 700;
    color: var(--scan);
    flex-shrink: 0;
  }

  #schedule_list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-top: 2px;
  }

  .schedule_row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    text-decoration: none;
  }

  .schedule_row .schedule_time {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--scan);
    flex-shrink: 0;
  }

  .schedule_row .schedule_task {
    font-size: 12.5px;
    font-weight: 700;
    color: #1a1a1a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .schedule_empty {
    font-size: 12px;
    color: var(--ink-dim);
  }

  .schedule_add_row {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--scan);
    text-decoration: none;
    padding: 6px 2px 4px;
    flex-shrink: 0;
  }

  /* ---------- ホーム画面:長押し→上下ドラッグでカメラ/トークモード切替 ---------- */
  #mode_gesture_guide {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 40;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  #mode_gesture_guide.show { opacity: 1; }

  .mode_gesture_icon {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 14px 18px;
    border-radius: 20px;
    background: rgba(255,255,255,0.94);
    border: 3px solid #1a1a1a;
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .mode_gesture_icon.mode_gesture_up { top: max(70px, calc(env(safe-area-inset-top) + 50px)); }
  .mode_gesture_icon.mode_gesture_down { bottom: max(90px, calc(env(safe-area-inset-bottom) + 70px)); }
  .mode_gesture_emoji { font-size: 26px; line-height: 1; }
  .mode_gesture_label { font-size: 11px; font-weight: 700; color: #1a1a1a; }
  .mode_gesture_icon.active { background: var(--scan); transform: translateX(-50%) scale(1.12); }
  .mode_gesture_icon.active .mode_gesture_label { color: #fff; }
</style>
</head>
<body>

<div id="app">

  <!-- ④ホーム画面 -->
  <div id="home_layer" class="layer">
    <div id="home_top">
      <div id="home_brand_wrap">
        <div id="home_brand">YUI</div>
        <div id="home_emotion">
          <div>現在の感情：<span id="home_emotion_text">喜</span></div>
          <img id="home_emotion_img" src="chars/char_normal.png" alt="現在の感情の画像">
        </div>
      </div>
      <button id="home_menu_btn">
        <span class="burger">☰</span>
        <span>メニュー</span>
      </button>
    </div>

    <div id="mode_gesture_guide">
      <div class="mode_gesture_icon mode_gesture_up" id="mode_guide_camera">
        <span class="mode_gesture_emoji">📷</span>
        <span class="mode_gesture_label">カメラモード</span>
      </div>
      <div class="mode_gesture_icon mode_gesture_down" id="mode_guide_talk">
        <span class="mode_gesture_emoji">💬</span>
        <span class="mode_gesture_label">トークモード</span>
      </div>
    </div>

    <div id="home_stage_row">
      <div id="home_bubble"></div>
      <div id="home_char_area">
        <div id="visiting_friends_row"></div>
        <div id="home_character_wrap">
          <img id="home_character_img" src="chars/char_normal.png" alt="YUI">
        </div>
      </div>
    </div>
    <input type="file" id="friend_zip_input" accept=".zip" style="display:none">
    <audio id="decide_se" src="chars/決定音.mp3" preload="auto"></audio>

    <div id="home_buttons">
      <a id="talk_nav_btn" class="home_nav_btn" href="apps/talk.html">
        <span class="icon">💬</span>
        <span class="label">お話しする</span>
      </a>
      <div id="schedule_card">
        <span class="schedule_label">今日の予定</span>
        <div id="schedule_list"></div>
      </div>
    </div>
  </div>

  <!-- ⑤アプリ一覧(ミニメニュー) -->
  <div id="apps_layer" class="layer">
    <div id="apps_inner">
      <div id="apps_top">
        <div id="apps_title">アプリ</div>
        <button id="apps_close_btn">✕</button>
      </div>
      <div id="apps_grid">
        <a class="app_tile" href="apps/study.html">
          <span class="app_icon">📚</span>
          <span class="app_label">勉強</span>
        </a>
        <a class="app_tile" href="apps/settings.html">
          <span class="app_icon">⚙️</span>
          <span class="app_label">設定</span>
        </a>
        <a class="app_tile" href="apps/music/music_player.html">
          <span class="app_icon">🎶</span>
          <span class="app_label">音楽</span>
        </a>
        <a class="app_tile" href="apps/yui_scanner.html">
          <span class="app_icon">📷</span>
          <span class="app_label">カメラ</span>
        </a>
        <a class="app_tile" href="apps/schedule.html">
          <span class="app_icon">🗓️</span>
          <span class="app_label">スケジュール</span>
        </a>
        <a class="app_tile" href="apps/draw_game.html">
          <span class="app_icon">🎨</span>
          <span class="app_label">お絵描き当て</span>
        </a>
        <label class="app_tile" for="friend_zip_input" style="cursor:pointer;">
          <span class="app_icon">🎁</span>
          <span class="app_label">フレンドを迎える</span>
        </label>
        <a class="app_tile" href="apps/profile.html" target="_blank" rel="noopener">
          <span class="app_icon">🪪</span>
          <span class="app_label">プロフィール</span>
        </a>
        <a class="app_tile" href="apps/doubutu.html" target="_blank" rel="noopener">
          <span class="app_icon">🦁</span>
          <span class="app_label">動物園</span>
        </a>
        <div class="app_tile soon"><span class="app_icon">➕</span><span class="app_label">Coming Soon</span></div>
      </div>
    </div>
  </div>

</div>

<script>
(() => {
  const els = {
    homeLayer: document.getElementById('home_layer'),
    appsLayer: document.getElementById('apps_layer'),
    appsCloseBtn: document.getElementById('apps_close_btn'),
    homeBrand: document.getElementById('home_brand'),
    homeMenuBtn: document.getElementById('home_menu_btn'),
    homeCharacterImg: document.getElementById('home_character_img'),
    homeBubble: document.getElementById('home_bubble'),
    scheduleList: document.getElementById('schedule_list'),
    homeCharacterWrap: document.getElementById('home_character_wrap'),
    homeEmotionImg: document.getElementById('home_emotion_img'),
    homeEmotionText: document.getElementById('home_emotion_text'),
    friendZipInput: document.getElementById('friend_zip_input'),
    visitingFriendsRow: document.getElementById('visiting_friends_row'),
    decideSe: document.getElementById('decide_se'),
  };

  // ---- アプリ一覧(ミニメニュー)の開閉 ----
  els.homeMenuBtn.addEventListener('click', () => {
    showLayer(els.appsLayer);
  });
  els.appsCloseBtn.addEventListener('click', () => {
    showLayer(els.homeLayer);
  });

  const PROFILE_KEY = 'yui_profile';

  function loadProfile() {
    try {
      const raw = localStorage.getItem(PROFILE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function showLayer(layer) {
    [els.homeLayer, els.appsLayer].forEach(l => l.classList.remove('active'));
    layer.classList.add('active');
  }

  // ---- 今日の予定を読み込んで表示(スケジュールアプリとlocalStorageを共有) ----
  const SCHEDULE_KEY = 'yui_schedule';

  function loadSchedule() {
    try {
      const raw = localStorage.getItem(SCHEDULE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function todayStr() {
    const d = new Date();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${d.getFullYear()}-${mm}-${dd}`;
  }

  function renderTodaySchedule() {
    const all = loadSchedule();
    const today = todayStr();
    const todays = all
      .filter(ev => ev.date === today)
      .sort((a, b) => (a.time || '').localeCompare(b.time || ''));

    els.scheduleList.innerHTML = '';

    if (todays.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'schedule_empty';
      empty.textContent = '予定はありません';
      els.scheduleList.appendChild(empty);
    } else {
      todays.forEach(ev => {
        const row = document.createElement('a');
        row.className = 'schedule_row';
        row.href = 'schedule.html';
        if (ev.time) {
          const time = document.createElement('span');
          time.className = 'schedule_time';
          time.textContent = ev.time;
          row.appendChild(time);
        }
        const task = document.createElement('span');
        task.className = 'schedule_task';
        task.textContent = ev.task;
        row.appendChild(task);
        els.scheduleList.appendChild(row);
      });
    }

    // 予定の追加ボタンはスクロールリストの一番下に配置
    const addRow = document.createElement('a');
    addRow.className = 'schedule_add_row';
    addRow.href = 'schedule.html';
    addRow.textContent = '＋ 予定を追加';
    els.scheduleList.appendChild(addRow);
  }

  // ============ 画像(キャラ・表情)の読み込み ============
  // 画像の変更は「設定」ページ(settings.html)で行う。ここでは保存済みの画像を読むだけ
  const CHAR_IMAGE_KEY = 'yui_custom_char';
  const EMOTION_KEY = 'yui_emotion_images';
  const DEFAULT_CHAR = 'chars/char_normal.png';

  function standImage() {
    try { return localStorage.getItem(CHAR_IMAGE_KEY) || DEFAULT_CHAR; } catch (e) { return DEFAULT_CHAR; }
  }
  function loadEmotionImages() {
    try {
      const o = JSON.parse(localStorage.getItem(EMOTION_KEY) || '{}');
      return o && typeof o === 'object' ? o : {};
    } catch (e) { return {}; }
  }

  // ============ フレンドAI(他の人が送ってきたAI)の受け入れ・表示 ============
  const FRIENDS_KEY = 'yui_visiting_friends';
  const FRIEND_MAX = 100;                    // 保存できるフレンドの上限人数
  const FRIEND_VISIT_MS = 24 * 60 * 60 * 1000; // 1日だけキャラの隣に表示
  const FRIEND_SHOW_MAX = 5;                  // 同時に画面へ並べる最大数(表示のごちゃつき防止)

  function loadFriends() {
    try {
      const raw = localStorage.getItem(FRIENDS_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function saveFriends(list) {
    try {
      localStorage.setItem(FRIENDS_KEY, JSON.stringify(list));
    } catch (e) {
      alert('フレンドの保存に失敗しました(データが大きすぎるかもしれません)。');
    }
  }

  // 上限を超えたら、古いフレンド(受け取った日時が古い順)から削除する
  function addFriend(friend) {
    let list = loadFriends();
    list.push(friend);
    if (list.length > FRIEND_MAX) {
      list.sort((a, b) => a.receivedAt - b.receivedAt);
      list = list.slice(list.length - FRIEND_MAX);
    }
    saveFriends(list);
  }

  // 受け取ってから24時間以内のフレンドだけを「今遊びに来ている」フレンドとする
  function activeFriends() {
    const now = Date.now();
    return loadFriends()
      .filter(f => (now - f.receivedAt) < FRIEND_VISIT_MS)
      .sort((a, b) => a.receivedAt - b.receivedAt);
  }

  let friendBubbleTimeout = null;
  function showFriendMessage(f) {
    clearTimeout(friendBubbleTimeout);
    els.homeBubble.textContent = `${f.name}「${f.message}」`;
    els.homeBubble.classList.add('show');
    friendBubbleTimeout = setTimeout(() => {
      els.homeBubble.classList.remove('show');
    }, 5000);
  }

  function renderVisitingFriends() {
    const container = els.visitingFriendsRow;
    if (!container) return;
    container.innerHTML = '';
    activeFriends().slice(-FRIEND_SHOW_MAX).forEach((f) => {
      const btn = document.createElement('button');
      btn.className = 'visiting_friend_btn';
      btn.title = `${f.name}(タップして一言を聞く)`;
      const img = document.createElement('img');
      img.src = f.avatarDataUrl;
      img.alt = f.name;
      btn.appendChild(img);
      btn.addEventListener('click', () => showFriendMessage(f));
      container.appendChild(btn);
    });
  }

  // ZIPファイル(friend.htmlで作成したもの)を読み込んでフレンドとして迎える
  els.friendZipInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    if (typeof JSZip === 'undefined') {
      alert('フレンドを迎える機能の読み込みに失敗しました。通信環境を確認してもう一度お試しください。');
      els.friendZipInput.value = '';
      return;
    }

    try {
      const zip = await JSZip.loadAsync(file);
      const jsonEntry = zip.file('friend.json');
      if (!jsonEntry) throw new Error('friend.json not found');
      const jsonText = await jsonEntry.async('string');
      const data = JSON.parse(jsonText);

      let avatarDataUrl = 'chars/char_normal.png';
      const avatarEntry = data.avatarFile && zip.file(data.avatarFile);
      if (avatarEntry) {
        const blob = await avatarEntry.async('blob');
        avatarDataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      const friend = {
        id: `f_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
        name: String(data.name || '名無しのAI').slice(0, 15),
        message: String(data.message || 'よろしくね！').slice(0, 20),
        avatarDataUrl: avatarDataUrl,
        receivedAt: Date.now()
      };

      addFriend(friend);
      renderVisitingFriends();
      showFriendMessage(friend);
    } catch (err) {
      alert('フレンドファイルの読み込みに失敗しました。正しいZIPファイルか確認してください。');
    } finally {
      els.friendZipInput.value = '';
      showLayer(els.homeLayer);
    }
  });

  // ---- キャラをタップした時の共通リアクション(上下バウンス) ----
  els.homeCharacterWrap.addEventListener('click', () => {
    els.homeCharacterImg.classList.remove('char_bounce');
    // 再描画を挟んでからクラスを付け直すことで、連打してもアニメーションが再生されるようにする
    void els.homeCharacterImg.offsetWidth;
    els.homeCharacterImg.classList.add('char_bounce');
  });
  els.homeCharacterImg.addEventListener('animationend', () => {
    els.homeCharacterImg.classList.remove('char_bounce');
  });

  function playDecideSe() {
    if (!els.decideSe) return;
    try {
      els.decideSe.currentTime = 0;
      els.decideSe.play().catch(() => {});
    } catch (e) {}
  }

  // ============ ホーム画面:長押し→上下ドラッグでカメラ/トークモード切替 ============
  (function setupHomeModeGesture() {
    const LONG_PRESS_MS = 3000;
    const DIRECTION_PX = 60;
    const MOVE_CANCEL_PX = 24;
    const guide = document.getElementById('mode_gesture_guide');
    const camIcon = document.getElementById('mode_guide_camera');
    const talkIcon = document.getElementById('mode_guide_talk');
    let downX = 0, downY = 0, timer = null, ready = false;

    function isExcluded(t) {
      return !!(t && t.closest && t.closest(
        '#home_menu_btn, #home_character_wrap, .home_nav_btn, #schedule_card, .visiting_friend_btn'
      ));
    }

    function reset() {
      if (timer) { clearTimeout(timer); timer = null; }
      ready = false;
      if (guide) guide.classList.remove('show');
      if (camIcon) camIcon.classList.remove('active');
      if (talkIcon) talkIcon.classList.remove('active');
    }

    function updateDirection(y) {
      const dy = y - downY;
      if (camIcon) camIcon.classList.toggle('active', dy < -DIRECTION_PX);
      if (talkIcon) talkIcon.classList.toggle('active', dy > DIRECTION_PX);
    }

    function onDown(e) {
      if (!els.homeLayer.classList.contains('active')) return;
      if (isExcluded(e.target)) return;
      downX = e.clientX;
      downY = e.clientY;
      ready = false;
      timer = setTimeout(() => {
        ready = true;
        if (guide) guide.classList.add('show');
        playDecideSe();
      }, LONG_PRESS_MS);
    }

    function onMove(e) {
      if (ready) {
        updateDirection(e.clientY);
        return;
      }
      if (!timer) return;
      if (Math.hypot(e.clientX - downX, e.clientY - downY) > MOVE_CANCEL_PX) {
        reset();
      }
    }

    function onUp(e) {
      if (ready) {
        const dy = e.clientY - downY;
        reset();
        if (dy < -DIRECTION_PX) {
          window.location.href = 'yui_scanner.html';
          return;
        }
        if (dy > DIRECTION_PX) {
          window.location.href = 'apps/talk.html';
          return;
        }
        return;
      }
      reset();
    }

    document.addEventListener('pointerdown', onDown);
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', reset);
  })();

  // ============ ④ホーム画面 ============
  // 現在の感情: ホームを開くたびに 喜怒哀楽 からランダムで1つ選ぶ
  const EMOTIONS = [
    { key: 'joy',   label: '喜' },
    { key: 'angry', label: '怒' },
    { key: 'sad',   label: '哀' },
    { key: 'fun',   label: '楽' },
  ];
  let currentEmotion = EMOTIONS[0];
  function pickRandomEmotion() {
    return EMOTIONS[Math.floor(Math.random() * EMOTIONS.length)];
  }
  // 感情ボックス(文字+対応する画像。画像が未設定なら立ち絵)を描き直す
  function renderCurrentEmotion() {
    els.homeEmotionText.textContent = currentEmotion.label;
    els.homeEmotionImg.src = loadEmotionImages()[currentEmotion.key] || standImage();
  }

  function showHome() {
    const profile = loadProfile();
    const aiName = (profile && profile.ai_name) || 'YUI';
    if (els.homeBrand) els.homeBrand.textContent = aiName;

    // 立ち絵は常にデフォルト(アップロード済みならその画像)。感情では変えない
    els.homeCharacterImg.src = standImage();
    currentEmotion = pickRandomEmotion();
    renderCurrentEmotion();

    renderTodaySchedule();
    renderVisitingFriends();
    showLayer(els.homeLayer);
  }

  // ============ 起動時の分岐 ============
  // まだ初期設定が済んでいなければ初期設定ページ(shoki.html)へ、済んでいればホーム画面を表示
  // 初期設定済み: チュートリアル(index_tyuto.html)が未完了ならそちらへ、完了していればホーム画面を表示
  function tutorialDone() {
    try {
      const prog = JSON.parse(localStorage.getItem('yui_tutorial_progress') || 'null');
      return !!(prog && prog.level >= 5);
    } catch (e) { return false; }
  }

  const profile = loadProfile();
  if (profile && profile.onboarded) {
    if (tutorialDone()) {
      showHome();
    } else {
      window.location.href = 'index_tyuto.html';
    }
  } else {
    window.location.href = 'shoki.html';
  }

})();
</script>
