<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pollinations 動作確認</title>
<style>
  body { font-family: sans-serif; background:#111; color:#eee; padding:16px; }
  button { padding:10px 16px; font-size:14px; margin:8px 0; cursor:pointer; }
  img { max-width:100%; border-radius:8px; margin-top:12px; }
  .box { background:#222; padding:10px; border-radius:8px; margin-top:10px; font-size:12px; word-break:break-all; white-space:pre-wrap; }
  input { width:100%; padding:8px; box-sizing:border-box; margin-top:6px; }
</style>
</head>
<body>

<h3>🧪 Pollinations 画像生成テスト</h3>

<label>プロンプト</label>
<input id="prompt" value="16-bit pixel art sprite of a cute RPG monster, retro video game style, dark background, centered composition">

<div>
  <button onclick="generate()">🎨 画像生成（旧エンドポイント + flux）</button>
</div>

<div id="status" class="box">待機中</div>
<div id="result"></div>

<script>
async function generate() {
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  const prompt = document.getElementById('prompt').value;

  resultEl.innerHTML = '';
  statusEl.textContent = '生成中...';

  const encoded = encodeURIComponent(prompt);
  const seed = Math.floor(Math.random() * 1000000);
  const url = `https://image.pollinations.ai/prompt/${encoded}?model=flux&width=512&height=512&seed=${seed}&nologo=true`;

  try {
    const res = await fetch(url);
    statusEl.textContent = `HTTP ${res.status} / URL:\n${url}`;

    if (!res.ok) {
      throw new Error(`画像取得に失敗しました (HTTP ${res.status})`);
    }

    const blob = await res.blob();
    const reader = new FileReader();
    reader.onloadend = () => {
      const img = document.createElement('img');
      img.src = reader.result;
      resultEl.appendChild(img);
      statusEl.textContent += '\n✅ 成功';
    };
    reader.readAsDataURL(blob);

  } catch (e) {
    statusEl.textContent += `\n❌ エラー: ${e.message}`;
  }
}
</script>

</body>
</html>
