<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>モノバケ - バトル</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:#000; color:#F3F1E7; font-family:"DotGothic16","Courier New",monospace,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif; display:flex; justify-content:center; min-height:100vh; }
  #app { width:100%; max-width:420px; min-height:100vh; background:#0a0b14; position:relative; padding:12px; }
  img { image-rendering: pixelated; }
  h2 { font-size:16px; text-align:center; margin:4px 0 4px; }
  a.link { display:block; text-align:center; color:#23E0C4; font-size:12px; margin-bottom:12px; text-decoration:none; font-weight:bold; }

  /* ---------- 選択画面 ---------- */
  .sel-title { font-size:13px; color:#23E0C4; font-weight:bold; margin:10px 0 8px; border-bottom:1px solid rgba(255,255,255,.15); padding-bottom:4px; }
  .sel-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sel-card { background:#1F2347; border:2px solid rgba(255,255,255,.12); border-radius:10px; padding:8px; text-align:center; cursor:pointer; }
  .sel-card:active { border-color:#23E0C4; }
  .sel-card .pic { width:100%; aspect-ratio:1/1; background:#000; border-radius:6px; display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:56px; }
  .sel-card .pic img { width:100%; height:100%; object-fit:contain; }
  .sel-card .nm { font-size:12px; font-weight:bold; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tag { display:inline-block; padding:1px 6px; border-radius:4px; font-size:10px; font-weight:bold; color:#000; margin-top:3px; }
  .note { font-size:11px; color:#9A9CC0; line-height:1.6; }
  .btn { width:100%; padding:12px; background:#23E0C4; color:#08221E; border:none; border-radius:10px; font-weight:bold; font-size:14px; cursor:pointer; margin-top:8px; font-family:inherit; }
  .btn.sub { background:transparent; color:#9A9CC0; border:1px solid rgba(255,255,255,.25); }

  /* ---------- バトル画面 ---------- */
  .field { position:relative; width:100%; aspect-ratio: 1 / 1.05; background:linear-gradient(#10122a 0%, #0a0b14 60%, #05060c 100%); border:3px solid #F3F1E7; border-radius:8px; overflow:hidden; }
  .platform { position:absolute; border-radius:50%; background:radial-gradient(ellipse at center, #2c3066 0%, #14163a 70%, transparent 72%); }
  .plat-enemy  { width:46%; height:12%; right:6%;  top:36%; }
  .plat-player { width:54%; height:14%; left:2%;   bottom:2%; }
  .sprite { position:absolute; display:flex; align-items:flex-end; justify-content:center; font-size:90px; }
  .sprite img { width:100%; height:100%; object-fit:contain; mix-blend-mode:screen; }
  .sprite.enemy  { width:42%; aspect-ratio:1/1; right:8%;  top:12%; }
  .sprite.player { width:48%; aspect-ratio:1/1; left:5%;   bottom:7%; }
  .sprite.enemy { transform:scaleX(1); }

  .hpbox { position:absolute; background:#F3F1E7; color:#1a1a2e; border:3px solid #1a1a2e; border-radius:8px; padding:5px 8px; width:56%; font-size:11px; box-shadow:0 0 0 2px #F3F1E7; }
  .hpbox.enemy  { left:3%; top:4%; }
  .hpbox.player { right:3%; bottom:20%; }
  .hpbox .row1 { display:flex; justify-content:space-between; align-items:center; font-weight:bold; }
  .hpbox .row1 .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:70%; }
  .bar-wrap { display:flex; align-items:center; gap:4px; margin-top:3px; }
  .bar-lbl { font-size:9px; font-weight:bold; color:#e8590c; }
  .bar { flex:1; height:7px; background:#555; border-radius:4px; overflow:hidden; border:1px solid #1a1a2e; }
  .bar > i { display:block; height:100%; width:100%; background:#3ddc4a; transition:width .6s ease, background .3s; }
  .bar > i.mid { background:#f5c518; }
  .bar > i.low { background:#e03131; }
  .bar.en > i { background:#3ea6ff; transition:width .3s; }
  .hpnum { text-align:right; font-size:10px; margin-top:1px; font-weight:bold; }

  .flash { position:absolute; inset:0; pointer-events:none; opacity:0; z-index:5; }
  .flash.go { animation: flashA .45s ease-out; }
  @keyframes flashA { 0%{opacity:.75} 100%{opacity:0} }

  .lunge-p { animation: lungeP .35s ease; }
  .lunge-e { animation: lungeE .35s ease; }
  @keyframes lungeP { 0%{transform:translate(0,0)} 40%{transform:translate(40px,-24px)} 100%{transform:translate(0,0)} }
  @keyframes lungeE { 0%{transform:translate(0,0)} 40%{transform:translate(-40px,24px)} 100%{transform:translate(0,0)} }
  .hit { animation: hitA .5s steps(2,end); }
  @keyframes hitA { 0%,100%{opacity:1; transform:translateX(0)} 20%{opacity:.1; transform:translateX(-6px)} 40%{opacity:1; transform:translateX(6px)} 60%{opacity:.1; transform:translateX(-6px)} 80%{opacity:1; transform:translateX(4px)} }
  .faint { animation: faintA .8s ease forwards; }
  @keyframes faintA { to { transform:translateY(60px); opacity:0; } }
  .buffed { animation: buffA .6s ease; }
  @keyframes buffA { 0%,100%{filter:none} 50%{filter:brightness(2) saturate(2)} }
  .intro-p { animation: introP .6s ease; }
  .intro-e { animation: introE .6s ease; }
  @keyframes introP { from{transform:translateX(-120%)} to{transform:none} }
  @keyframes introE { from{transform:translateX(120%)} to{transform:none} }

  .msgbox { margin-top:8px; min-height:64px; background:#F3F1E7; color:#1a1a2e; border:4px solid #1a1a2e; outline:2px solid #F3F1E7; border-radius:8px; padding:10px 12px; font-size:14px; line-height:1.6; font-weight:bold; position:relative; }
  .msgbox .cursor { position:absolute; right:10px; bottom:4px; font-size:10px; animation: blink .8s infinite; }
  @keyframes blink { 50%{opacity:0} }

  .menu { margin-top:8px; }
  .menu-main { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  .menu button, .moves button { font-family:inherit; cursor:pointer; }
  .mbtn { background:#1F2347; color:#F3F1E7; border:2px solid #F3F1E7; border-radius:8px; padding:12px 4px; font-size:13px; font-weight:bold; }
  .mbtn:active { background:#2f346b; }
  .mbtn:disabled { opacity:.35; }
  .moves { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .mv { background:#1F2347; color:#F3F1E7; border:2px solid #F3F1E7; border-radius:8px; padding:8px; text-align:left; }
  .mv:disabled { opacity:.35; }
  .mv .t { font-size:9px; color:#9A9CC0; }
  .mv .n { font-size:13px; font-weight:bold; margin:2px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mv .c { font-size:10px; color:#F2B84B; }
  .mv .e { font-size:10px; color:#23E0C4; }
  .back { margin-top:6px; width:100%; padding:8px; background:transparent; border:1px solid rgba(255,255,255,.3); color:#9A9CC0; border-radius:8px; font-family:inherit; font-size:12px; cursor:pointer; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   データ
========================================================= */
const STORAGE_KEY = "monobake_save_v2";            // zukan.html と同じ保存先
const ATTR_COLOR = { 火:"#FF6B4A", 水:"#3EC6E0", 風:"#7ED957" };
const SLOT_LABEL = { normal:"通常技", strong:"必殺技", utility:"補助技", special:"奥義" };
const SLOT_ORDER = ["normal","strong","utility","special"];
// 相性: 火は風に強い / 風は水に強い / 水は火に強い
const BEATS = { 火:"風", 風:"水", 水:"火" };

// 図鑑が空でも遊べるデモ＆野生モンスター
const DEMO_MONS = [
  { id:"demo1", demo:true, emoji:"🔥", name:"ヒノコゾウ", attribute:"火", stats:{hp:90,atk:70,def:50,spd:60},
    moves:{ normal:{cost:0,name:"ひっかく",flavor:""}, strong:{cost:3,name:"かえんぐるま",flavor:""}, utility:{cost:2,name:"きあいだめ",flavor:""}, special:{cost:6,name:"ごうかのたつまき",flavor:""} } },
  { id:"demo2", demo:true, emoji:"💧", name:"ミズタマリン", attribute:"水", stats:{hp:110,atk:55,def:70,spd:45},
    moves:{ normal:{cost:0,name:"たいあたり",flavor:""}, strong:{cost:3,name:"みずでっぽう",flavor:""}, utility:{cost:2,name:"じこさいせい",flavor:""}, special:{cost:6,name:"だいこうずい",flavor:""} } },
  { id:"demo3", demo:true, emoji:"🍃", name:"カゼノハ", attribute:"風", stats:{hp:80,atk:65,def:55,spd:85},
    moves:{ normal:{cost:0,name:"はっぱカッター",flavor:""}, strong:{cost:3,name:"かまいたち",flavor:""}, utility:{cost:2,name:"かげぶんしん",flavor:""}, special:{cost:6,name:"りゅうせんのかぜ",flavor:""} } }
];

function loadZukan() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    return Array.isArray(d.zukan) ? d.zukan : [];
  } catch (e) { return []; }
}

/* =========================================================
   バトル用データ化
========================================================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = (v, d) => (Number.isFinite(Number(v)) && Number(v) > 0 ? Number(v) : d);
function hash(str) { let h = 0; for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }

const MOVE_RULE = {
  normal:  { power:40,  acc:100 },
  strong:  { power:75,  acc:90  },
  special: { power:110, acc:80  },
  utility: { power:0,   acc:100 }
};
const UTIL_EFFECTS = [
  { id:"heal",   label:"HP回復" },
  { id:"atkup",  label:"攻撃UP" },
  { id:"defdown",label:"敵の防御DOWN" }
];

function makeFighter(src) {
  const st = src.stats || {};
  const maxHp = clamp(Math.round(60 + num(st.hp, 80) * 0.5), 70, 220);
  const f = {
    name: src.name || "???", attr: src.attribute || "火", photo: src.photo || null, emoji: src.emoji || "❓",
    maxHp, hp: maxHp,
    atk: num(st.atk, 50), def: num(st.def, 50), spd: num(st.spd, 50),
    atkSt: 0, defSt: 0,
    en: 4, maxEn: 10,
    moves: []
  };
  SLOT_ORDER.forEach(slot => {
    const m = src.moves && src.moves[slot];
    if (!m) return;
    const rule = MOVE_RULE[slot];
    const mv = { slot, name: m.name || "???", flavor: m.flavor || "",
                 cost: clamp(parseInt(m.cost, 10) || 0, 0, 9), power: rule.power, acc: rule.acc };
    if (slot === "utility") mv.effect = UTIL_EFFECTS[hash(mv.name) % UTIL_EFFECTS.length];
    f.moves.push(mv);
  });
  if (!f.moves.length) f.moves.push({ slot:"normal", name:"たいあたり", flavor:"", cost:0, power:40, acc:100 });
  // 通常技は誰でも必ず出せるようにする
  f.moves.forEach(m => { if (m.slot === "normal") m.cost = Math.min(m.cost, 1); });
  return f;
}

const stageMul = s => s >= 0 ? 1 + 0.25 * s : 1 / (1 + 0.25 * -s);
function typeMul(atkAttr, defAttr) {
  if (BEATS[atkAttr] === defAttr) return 2;
  if (BEATS[defAttr] === atkAttr) return 0.5;
  return 1;
}

/* =========================================================
   画面
========================================================= */
const app = document.getElementById("app");
let zukan = [];
let chosenPlayerSrc = null;

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === "class") e.className = attrs[k];
    else if (k === "style") e.style.cssText = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(c => { if (c == null) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
function spriteInner(f) {
  if (f.photo) return el("img", { src: f.photo, alt: f.name });
  return document.createTextNode(f.emoji);
}
function attrTag(a) { return el("span", { class:"tag", style:`background:${ATTR_COLOR[a] || "#ccc"}` }, a); }

/* ---------- 選択画面 ---------- */
function showSelect() {
  zukan = loadZukan();
  app.innerHTML = "";
  app.append(
    el("h2", {}, "⚔️ モノバケ バトル"),
    el("a", { class:"link", href:"zukan.html" }, "← 図鑑へ")
  );

  const mkCard = (m) => el("div", { class:"sel-card", onclick: () => { chosenPlayerSrc = m; startBattle(); } },
    el("div", { class:"pic" }, m.photo ? el("img", { src:m.photo }) : (m.emoji || "❓")),
    el("div", { class:"nm" }, m.name),
    attrTag(m.attribute)
  );

  app.append(el("div", { class:"sel-title" }, `📖 じぶんの モンスター (${zukan.length})`));
  if (zukan.length) {
    app.append(el("div", { class:"sel-grid" }, zukan.map(mkCard)));
  } else {
    app.append(el("div", { class:"note" },
      "図鑑にモンスターがいません。zukan.html で写真から作成して保存すると、ここに出てきます。",
      el("br"), "（zukan.html と同じフォルダ・同じ場所で開いてください）"));
  }

  app.append(el("div", { class:"sel-title" }, "🧪 おためしモンスター"));
  app.append(el("div", { class:"sel-grid" }, DEMO_MONS.map(mkCard)));
  app.append(el("div", { class:"note", style:"margin-top:10px" }, "えらんだモンスターで、やせいのモンスターとたたかいます。"));
}

/* ---------- バトル ---------- */
let B = null;   // バトル状態
function pickEnemySrc() {
  const pool = [];
  zukan.forEach(m => { if (m.id !== chosenPlayerSrc.id) pool.push(m); });
  DEMO_MONS.forEach(m => { if (m.id !== chosenPlayerSrc.id) pool.push(m); });
  return pool[Math.floor(Math.random() * pool.length)];
}

function startBattle() {
  const player = makeFighter(chosenPlayerSrc);
  const enemy  = makeFighter(pickEnemySrc());
  B = { player, enemy, busy: true, over: false };
  buildBattleDom();
  intro();
}

let ui = {};
function buildBattleDom() {
  app.innerHTML = "";
  ui.flash = el("div", { class:"flash" });
  ui.enemySprite  = el("div", { class:"sprite enemy" },  spriteInner(B.enemy));
  ui.playerSprite = el("div", { class:"sprite player" }, spriteInner(B.player));

  const mkHpBox = (f, cls) => {
    const o = {};
    o.name = el("span", { class:"nm" }, f.name);
    o.bar  = el("i");
    o.num  = el("div", { class:"hpnum" });
    o.en   = el("i");
    o.box = el("div", { class:`hpbox ${cls}` },
      el("div", { class:"row1" }, o.name, attrTag(f.attr)),
      el("div", { class:"bar-wrap" }, el("span", { class:"bar-lbl" }, "HP"), el("div", { class:"bar" }, o.bar)),
      cls === "player" ? o.num : null,
      cls === "player" ? el("div", { class:"bar-wrap" }, el("span", { class:"bar-lbl", style:"color:#1c7ed6" }, "EN"), el("div", { class:"bar en" }, o.en)) : null
    );
    return o;
  };
  ui.eBox = mkHpBox(B.enemy, "enemy");
  ui.pBox = mkHpBox(B.player, "player");

  const field = el("div", { class:"field" },
    el("div", { class:"platform plat-enemy" }),
    el("div", { class:"platform plat-player" }),
    ui.enemySprite, ui.playerSprite, ui.eBox.box, ui.pBox.box, ui.flash
  );

  ui.msg = el("div", { class:"msgbox" });
  ui.menu = el("div", { class:"menu" });
  app.append(field, ui.msg, ui.menu);
  updateBars(true);
}

function updateBars() {
  [[B.enemy, ui.eBox], [B.player, ui.pBox]].forEach(([f, u]) => {
    const r = f.hp / f.maxHp;
    u.bar.style.width = (r * 100) + "%";
    u.bar.className = r <= 0.2 ? "low" : r <= 0.5 ? "mid" : "";
  });
  ui.pBox.num.textContent = `${Math.max(0, B.player.hp)} / ${B.player.maxHp}`;
  ui.pBox.en.style.width = (B.player.en / B.player.maxEn * 100) + "%";
}

/* ---------- メッセージ ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
let msgToken = 0;
async function say(text, wait = 700) {
  const token = ++msgToken;
  ui.msg.textContent = "";
  for (let i = 0; i < text.length; i++) {
    if (token !== msgToken) return;
    ui.msg.textContent += text[i];
    await sleep(22);
  }
  await sleep(wait);
}
function setMsgStatic(text) { msgToken++; ui.msg.textContent = text; }

/* ---------- 演出 ---------- */
function anim(node, cls, ms) {
  node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls);
  return sleep(ms).then(() => node.classList.remove(cls));
}
function flashScreen(color) {
  ui.flash.style.background = color;
  ui.flash.classList.remove("go"); void ui.flash.offsetWidth; ui.flash.classList.add("go");
}
const spriteOf = f => f === B.player ? ui.playerSprite : ui.enemySprite;

/* ---------- 開始 ---------- */
async function intro() {
  ui.playerSprite.style.visibility = "hidden";
  ui.enemySprite.classList.add("intro-e");
  await say(`やせいの ${B.enemy.name} が あらわれた！`, 600);
  ui.playerSprite.style.visibility = "visible";
  ui.playerSprite.classList.add("intro-p");
  await say(`ゆけっ！ ${B.player.name}！`, 500);
  showMainMenu();
}

/* ---------- メニュー ---------- */
function showMainMenu() {
  B.busy = false;
  setMsgStatic(`${B.player.name} は どうする？`);
  ui.menu.innerHTML = "";
  ui.menu.append(el("div", { class:"menu-main" },
    el("button", { class:"mbtn", onclick: showMoveMenu }, "⚔️ たたかう"),
    el("button", { class:"mbtn", onclick: () => playerAction({ type:"charge" }) }, "💫 きあい"),
    el("button", { class:"mbtn", onclick: runAway }, "🏃 にげる")
  ));
}
function effText(m) {
  if (m.slot === "utility") return m.effect.label;
  const t = []; t.push(`威力${m.power}`); return t.join(" ");
}
function showMoveMenu() {
  ui.menu.innerHTML = "";
  const grid = el("div", { class:"moves" });
  B.player.moves.forEach(m => {
    const ok = B.player.en >= m.cost;
    grid.append(el("button", { class:"mv", disabled: ok ? null : "disabled", onclick: () => playerAction({ type:"move", move:m }) },
      el("div", { class:"t" }, SLOT_LABEL[m.slot]),
      el("div", { class:"n" }, m.name),
      el("div", { class:"c" }, `EN ${m.cost}`),
      el("div", { class:"e" }, effText(m))
    ));
  });
  ui.menu.append(grid, el("button", { class:"back", onclick: showMainMenu }, "← もどる"));
  setMsgStatic(`EN ${B.player.en} / ${B.player.maxEn}  わざを えらんでね`);
}
async function runAway() {
  if (B.busy) return;
  B.busy = true; ui.menu.innerHTML = "";
  await say("うまく にげきれた！", 600);
  showSelect();
}

/* ---------- ターン処理 ---------- */
function enemyChoose() {
  const e = B.enemy;
  const usable = e.moves.filter(m => e.en >= m.cost);
  if (!usable.length || (e.en < 2 && Math.random() < 0.3)) return { type:"charge" };
  // 高コスト技ほど出やすい（使えるときは積極的に使う）
  const weights = usable.map(m => 1 + m.cost * 0.6 + (m.slot === "utility" ? (e.hp / e.maxHp < 0.5 ? 1 : -0.5) : 0));
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < usable.length; i++) { r -= Math.max(0.2, weights[i]); if (r <= 0) return { type:"move", move:usable[i] }; }
  return { type:"move", move:usable[0] };
}

async function playerAction(act) {
  if (B.busy || B.over) return;
  B.busy = true; ui.menu.innerHTML = "";
  const eAct = enemyChoose();
  const queue = [{ who:B.player, act }, { who:B.enemy, act:eAct }];
  // きあいは最優先、それ以外は素早さ順
  const pri = a => a.act.type === "charge" ? 1 : 0;
  queue.sort((a, b) => pri(b) - pri(a) || (b.who.spd - a.who.spd) || (Math.random() - 0.5));

  for (const q of queue) {
    if (q.who.hp <= 0) continue;
    await perform(q.who, q.who === B.player ? B.enemy : B.player, q.act);
    if (B.player.hp <= 0 || B.enemy.hp <= 0) break;
  }
  if (await checkEnd()) return;

  [B.player, B.enemy].forEach(f => { f.en = Math.min(f.maxEn, f.en + 2); });
  updateBars();
  showMainMenu();
}

async function perform(me, foe, act) {
  const isP = me === B.player;
  if (act.type === "charge") {
    me.en = Math.min(me.maxEn, me.en + 4);
    updateBars();
    anim(spriteOf(me), "buffed", 600);
    await say(`${me.name} は きあいを ためた！ (EN+4)`);
    return;
  }
  const m = act.move;
  me.en -= m.cost; updateBars();
  await say(`${me.name} の ${m.name}！`, 300);

  if (m.slot === "utility") {
    anim(spriteOf(me), "buffed", 600);
    flashScreen("rgba(255,255,255,.35)");
    await sleep(500);
    if (m.effect.id === "heal") {
      const v = Math.round(me.maxHp * 0.35);
      const before = me.hp; me.hp = Math.min(me.maxHp, me.hp + v); updateBars();
      await say(`${me.name} は HPを ${me.hp - before} かいふくした！`);
    } else if (m.effect.id === "atkup") {
      if (me.atkSt >= 3) await say("しかし これいじょう あがらない！");
      else { me.atkSt++; await say(`${me.name} の こうげきが あがった！`); }
    } else {
      if (foe.defSt <= -3) await say("しかし これいじょう さがらない！");
      else { foe.defSt--; anim(spriteOf(foe), "hit", 400); await say(`${foe.name} の ぼうぎょが さがった！`); }
    }
    return;
  }

  // 攻撃
  anim(spriteOf(me), isP ? "lunge-p" : "lunge-e", 350);
  await sleep(250);
  if (Math.random() * 100 > m.acc) { await say(`しかし ${me.name} の こうげきは はずれた！`); return; }

  const mult = typeMul(me.attr, foe.attr);
  flashScreen(hexA(ATTR_COLOR[me.attr] || "#fff", .5));
  anim(spriteOf(foe), "hit", 500);

  const ratio = clamp((me.atk * stageMul(me.atkSt)) / (foe.def * stageMul(foe.defSt)), 0.6, 1.8);
  const rnd = 0.85 + Math.random() * 0.15;
  const crit = Math.random() < 1 / 16;
  let dmg = Math.max(1, Math.round(m.power * 0.5 * ratio * rnd * mult * (crit ? 1.5 : 1)));
  foe.hp = Math.max(0, foe.hp - dmg);
  updateBars();
  await sleep(650);

  if (crit) await say("きゅうしょに あたった！", 400);
  if (mult > 1) await say("こうかは ばつぐんだ！", 500);
  else if (mult < 1) await say("こうかは いまひとつのようだ…", 500);
  else await sleep(150);
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}

async function checkEnd() {
  const dead = B.enemy.hp <= 0 ? B.enemy : (B.player.hp <= 0 ? B.player : null);
  if (!dead) return false;
  B.over = true;
  await anim(spriteOf(dead), "faint", 800);
  spriteOf(dead).style.visibility = "hidden";
  if (dead === B.enemy) await say(`やせいの ${B.enemy.name} を たおした！`, 600);
  else await say(`${B.player.name} は たおれてしまった…`, 600);
  await say(dead === B.enemy ? "しょうり！" : "めのまえが まっくらに なった…", 300);

  ui.menu.innerHTML = "";
  ui.menu.append(
    el("button", { class:"btn", onclick: startBattle }, "🔁 もういちど"),
    el("button", { class:"btn sub", onclick: showSelect }, "モンスターを えらびなおす")
  );
  return true;
}

showSelect();
</script>
