<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モノバケ図鑑</title>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0c1b;
      color: #F3F1E7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .main-container {
      width: 100%;
      max-width: 420px;
      background: #12142B;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
      position: relative;
    }
    .page-title { font-size: 20px; font-weight: bold; margin: 0 0 4px; }
    .page-sub { font-size: 12px; color: #9A9CC0; margin: 0 0 16px; }
    .link-btn {
      display: inline-block; font-size: 12px; color: #23E0C4; text-decoration: none;
      border: 1px solid #23E0C4; border-radius: 20px; padding: 6px 14px; margin-bottom: 16px;
    }

    .card { background: #1F2347; border-radius: 12px; padding: 14px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.1); }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .rarity-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; background: rgba(242,184,75,0.18); color: #F2B84B; }

    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; text-align: center; }
    .stat-box { background: #12142B; padding: 6px; border-radius: 6px; }
    .stat-box .lbl { font-size: 10px; color: #9A9CC0; }
    .stat-box .val { font-size: 13px; font-weight: bold; }

    /* 相棒AIカード */
    .partner-card { display: flex; gap: 12px; align-items: center; cursor: pointer; }
    .partner-avatar { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #23E0C4; flex-shrink: 0; }
    .partner-avatar-fallback { width: 60px; height: 60px; border-radius: 50%; background: #12142B; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; border: 2px solid #23E0C4; }

    /* モンスターカードグリッド */
    .section-title { font-size: 14px; font-weight: bold; color: #9A9CC0; margin: 4px 0 10px; }
    .monster-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .monster-tile {
      background: #1F2347; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
      padding: 8px 6px 10px; text-align: center; cursor: pointer;
    }
    .monster-tile:active { transform: scale(0.96); }
    .monster-tile img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; margin-bottom: 6px; }
    .monster-tile .mt-name { font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .monster-tile .mt-tags { display: flex; justify-content: center; gap: 4px; margin-top: 4px; }
    .monster-tile .mt-tags .tag, .monster-tile .mt-tags .rarity-tag { font-size: 9px; padding: 1px 5px; }

    .empty-box { text-align: center; color: #9A9CC0; padding: 40px 10px; font-size: 13px; }

    /* 詳細モーダル */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; align-items: flex-end; justify-content: center; z-index: 50;
    }
    .modal-card {
      width: 100%; max-width: 420px; background: #1F2347; border-radius: 20px 20px 0 0;
      padding: 18px 18px max(18px, env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto;
      box-sizing: border-box;
    }
    .modal-close-row { display: flex; justify-content: flex-end; margin-bottom: 4px; }
    .modal-close-btn { background: rgba(255,255,255,0.08); border: none; color: #F3F1E7; border-radius: 50%; width: 30px; height: 30px; font-size: 14px; cursor: pointer; }
    .modal-photo { width: 100%; aspect-ratio: 1.3/1; object-fit: cover; border-radius: 12px; margin-bottom: 12px; background: #0b0c1b; }
    .modal-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .modal-name-row h2 { margin: 0; font-size: 20px; }
    .modal-desc { color: #9A9CC0; font-size: 13px; margin: 4px 0 12px; }
    .move-row { background: #12142B; border-radius: 8px; padding: 9px 12px; margin-bottom: 8px; }
    .move-row .mv-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; }
    .move-row .mv-flavor { color: #9A9CC0; font-size: 11px; margin-top: 2px; }
    .btn-action { width: 100%; padding: 13px; background: #23E0C4; color: #08221E; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 4px; }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  const { useState } = React;

  const TYPE_CHART = {
    火: { color: "#FF6B4A" },
    水: { color: "#3EC6E0" },
    風: { color: "#7ED957" },
  };
  const MOVE_LABEL = { normal: "通常技", strong: "強力技", utility: "回復技" };

  // ---- prot_battle.html / index.html と共有するストレージ ----
  const STORAGE_KEY = "monobake_save_v2";       // prot_battle.htmlと同じキー名(モンスター図鑑・相棒の戦績)
  const PROFILE_KEY = "yui_profile";            // index.htmlと同じキー名
  const CHAR_IMAGE_KEY = "yui_custom_char";     // index.htmlと同じキー名
  const PENDING_BATTLE_KEY = "monobake_pending_battle_id"; // バトル画面へ渡す「選択した相手」の一時受け渡し用

  function loadGameData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* 無視 */ }
    return { partner: null, zukan: [] };
  }
  function loadSharedProfile() {
    try {
      const raw = localStorage.getItem(PROFILE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function loadSharedCharImage() {
    try { return localStorage.getItem(CHAR_IMAGE_KEY) || null; } catch (e) { return null; }
  }
  function getPartnerIdentity() {
    const profile = loadSharedProfile();
    return {
      name: (profile && profile.ai_name) || "ナビモン",
      photo: loadSharedCharImage(),
    };
  }

  function TypeTag({ attribute }) {
    const color = (TYPE_CHART[attribute] || {}).color || "#B8BEC9";
    return <span className="tag" style={{ background: color, color: "#000" }}>{attribute}</span>;
  }

  // ---- 図鑑カード一覧(モンスター) ----
  function MonsterTile({ monster, onOpen }) {
    return (
      <div className="monster-tile" onClick={() => onOpen(monster)}>
        <img src={monster.photo} alt={monster.name} />
        <div className="mt-name">{monster.name}</div>
        <div className="mt-tags">
          <TypeTag attribute={monster.attribute} />
          <span className="rarity-tag">{monster.rarity}</span>
        </div>
      </div>
    );
  }

  // ---- モンスター詳細モーダル ----
  function MonsterDetailModal({ monster, onClose }) {
    const goBattle = () => {
      // prot_battle.html 側に「この相手と戦いたい」ことを伝える
      try { localStorage.setItem(PENDING_BATTLE_KEY, monster.id); } catch (e) { /* 無視 */ }
      window.location.href = "prot_battle.html";
    };

    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal-card" onClick={(e) => e.stopPropagation()}>
          <div className="modal-close-row">
            <button className="modal-close-btn" onClick={onClose}>✕</button>
          </div>
          <img className="modal-photo" src={monster.photo} alt={monster.name} />
          <div className="modal-name-row">
            <h2>{monster.name}</h2>
            <TypeTag attribute={monster.attribute} />
            <span className="rarity-tag">{monster.rarity}</span>
          </div>
          <p className="modal-desc">{monster.description}</p>

          <div className="stat-grid">
            <div className="stat-box"><div className="lbl">HP</div><div className="val">{monster.stats.hp}</div></div>
            <div className="stat-box"><div className="lbl">攻撃</div><div className="val">{monster.stats.atk}</div></div>
            <div className="stat-box"><div className="lbl">防御</div><div className="val">{monster.stats.def}</div></div>
            <div className="stat-box"><div className="lbl">SPD</div><div className="val">{monster.stats.spd}</div></div>
          </div>

          {monster.moves && Object.keys(monster.moves).map((k) => (
            <div className="move-row" key={k}>
              <div className="mv-top">
                <span>{monster.moves[k].name}</span>
                <span style={{ color: "#9A9CC0", fontWeight: "normal" }}>{MOVE_LABEL[k] || k}</span>
              </div>
              <div className="mv-flavor">{monster.moves[k].flavor}</div>
            </div>
          ))}

          {monster.createdAt && (
            <p style={{ fontSize: 11, color: "#6b6f95", marginTop: 8 }}>発見日: {monster.createdAt}</p>
          )}

          <button className="btn-action" onClick={goBattle}>⚔️ この相手とバトルする</button>
        </div>
      </div>
    );
  }

  // ---- 相棒AI詳細モーダル ----
  function PartnerDetailModal({ identity, partnerData, onClose }) {
    if (!partnerData) return null;
    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal-card" onClick={(e) => e.stopPropagation()}>
          <div className="modal-close-row">
            <button className="modal-close-btn" onClick={onClose}>✕</button>
          </div>
          {identity.photo ? (
            <img className="modal-photo" src={identity.photo} alt={identity.name} style={{ objectFit: "contain", background: "#0b0c1b" }} />
          ) : (
            <div className="modal-photo" style={{ display: "flex", alignItems: "center", justifyContent: "center", fontSize: 60 }}>🤖</div>
          )}
          <div className="modal-name-row">
            <h2>{identity.name}</h2>
            <TypeTag attribute={partnerData.attribute} />
          </div>
          <p className="modal-desc">Lv.{partnerData.level} ・ EXP {partnerData.exp}/100</p>

          <div className="stat-grid">
            <div className="stat-box"><div className="lbl">HP</div><div className="val">{partnerData.stats.hp}</div></div>
            <div className="stat-box"><div className="lbl">攻撃</div><div className="val">{partnerData.stats.atk}</div></div>
            <div className="stat-box"><div className="lbl">防御</div><div className="val">{partnerData.stats.def}</div></div>
            <div className="stat-box"><div className="lbl">SPD</div><div className="val">{partnerData.stats.spd}</div></div>
          </div>

          {partnerData.moves && Object.keys(partnerData.moves).map((k) => (
            <div className="move-row" key={k}>
              <div className="mv-top">
                <span>{partnerData.moves[k].name}</span>
                <span style={{ color: "#9A9CC0", fontWeight: "normal" }}>{MOVE_LABEL[k] || k}</span>
              </div>
              <div className="mv-flavor">{partnerData.moves[k].flavor}</div>
            </div>
          ))}

          <p style={{ fontSize: 11, color: "#6b6f95", marginTop: 8 }}>
            名前と見た目は index画面の初期設定と共通です。
          </p>
        </div>
      </div>
    );
  }

  function App() {
    const [gameData] = useState(loadGameData);
    const [identity] = useState(getPartnerIdentity);
    const [openMonster, setOpenMonster] = useState(null);
    const [openPartner, setOpenPartner] = useState(false);

    const zukan = gameData.zukan || [];

    return (
      <div className="main-container">
        <div className="page-title">📖 図鑑</div>
        <p className="page-sub">これまでに出会ったモンスターと、あなたの相棒AI</p>
        <a className="link-btn" href="prot_battle.html">📸 スキャン・バトル画面へ</a>

        {/* 相棒AIカード */}
        <div className="card partner-card" onClick={() => setOpenPartner(true)}>
          {identity.photo ? (
            <img className="partner-avatar" src={identity.photo} alt={identity.name} />
          ) : (
            <div className="partner-avatar-fallback">🤖</div>
          )}
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: "bold", fontSize: 15 }}>{identity.name}</div>
            <div style={{ fontSize: 11, color: "#9A9CC0" }}>
              {gameData.partner ? `Lv.${gameData.partner.level} ・ あなたの相棒AI` : "あなたの相棒AI"}
            </div>
          </div>
          <div style={{ fontSize: 11, color: "#23E0C4" }}>詳細 ›</div>
        </div>

        {/* モンスター一覧 */}
        <div className="section-title">出会ったモンスター（{zukan.length}体）</div>
        {zukan.length === 0 ? (
          <div className="empty-box">
            まだモンスターがいません。<br />
            「スキャン・バトル画面」で物を撮影してみよう。
          </div>
        ) : (
          <div className="monster-grid">
            {zukan.map((m) => (
              <MonsterTile key={m.id} monster={m} onOpen={setOpenMonster} />
            ))}
          </div>
        )}

        {openMonster && (
          <MonsterDetailModal monster={openMonster} onClose={() => setOpenMonster(null)} />
        )}
        {openPartner && (
          <PartnerDetailModal identity={identity} partnerData={gameData.partner} onClose={() => setOpenPartner(false)} />
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
