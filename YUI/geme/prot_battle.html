<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モノバケ - 分離処理テスト版</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0c1b;
      color: #F3F1E7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .main-container {
      width: 100%;
      max-width: 420px;
      background: #12142B;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
    }
    .card { background: #1F2347; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1); }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .btn-action { width: 100%; padding: 12px; background: #23E0C4; color: #08221E; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .btn-action:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-save { background: #F2B84B; color: #000; }
    .btn-secondary { background: transparent; color: #9A9CC0; border: 1px solid rgba(255,255,255,0.2); }
    
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; text-align: center; }
    .stat-box { background: #12142B; padding: 6px; border-radius: 6px; }
    .stat-box .lbl { font-size: 10px; color: #9A9CC0; }
    .stat-box .val { font-size: 13px; font-weight: bold; }
    .api-key-input { width: 100%; padding: 8px; margin-top: 6px; border-radius: 6px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; }

    .step-header { font-size: 14px; font-weight: bold; color: #23E0C4; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; }
    .error-box { background: #421118; border: 1px solid #FF5D73; color: #FFD1D7; padding: 8px; border-radius: 6px; font-size: 11px; margin-top: 8px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  const { useState, useRef } = React;

  const TYPE_CHART = {
    火: { color: "#FF6B4A" },
    水: { color: "#3EC6E0" },
    風: { color: "#7ED957" },
  };

  const STORAGE_KEY = "monobake_save_v2";
  const GEMINI_API_KEY_STORAGE = "yui_gemini_api_key";

  function loadSharedApiKey() {
    try { return localStorage.getItem(GEMINI_API_KEY_STORAGE) || ""; } catch (e) { return ""; }
  }
  function saveSharedApiKey(key) {
    try { localStorage.setItem(GEMINI_API_KEY_STORAGE, key); } catch (e) { /* 無視 */ }
  }

  function loadLocalData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : { zukan: [] };
  }
  function saveLocalData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

  function resizeImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const max = 400;
          let w = img.width, h = img.height;
          if (w > h) { if (w > max) { h = Math.round(h * (max / w)); w = max; } }
          else { if (h > max) { w = Math.round(w * (max / h)); h = max; } }
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/png", 0.9));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // --- API処理 1: エラー内容を詳細に表示する画像生成 API ---
  async function apiGenerateImage(apiKey) {
    // 試すモデル（imagen-3.0-generate-002 または imagen-3.0-fast-generate-001）
    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:generateImages?key=${apiKey}`;
    const promptText = "16-bit pixel art sprite of a cute RPG monster, retro video game style, dark background, centered composition.";

    try {
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          prompt: promptText,
          config: { numberOfImages: 1, outputMimeType: "image/png", aspectRatio: "1:1" }
        })
      });

      const errJson = await res.json().catch(() => ({}));

      if (!res.ok) {
        // APIから返ってきた生のJSONエラーをそのまま表示
        throw new Error(`[HTTP ${res.status}]\n${JSON.stringify(errJson, null, 2)}`);
      }

      const base64 = errJson.generatedImages?.[0]?.image?.imageBytes;
      if (!base64) {
        throw new Error(`[レスポンス構造エラー]\n返却データ: ${JSON.stringify(errJson, null, 2)}`);
      }
      
      return `data:image/png;base64,${base64}`;

    } catch (e) {
      throw new Error(`【画像生成APIエラー詳細】\n${e.message}`);
    }
  }
  // --- API処理 2: 文章・パラメータ生成専用 API (画像解析) ---
  async function apiAnalyzeMonster(base64ImageData, apiKey) {
    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`;
    const cleanBase64 = base64ImageData.split(",")[1];

    const promptText = `
このモンスター画像を見て、RPGモンスターの設定を作成してください。
名称、属性(火/水/風)、レアリティ(C/B/A/S)、説明、および3つの技(通常・必殺・補助)とステータスを設定してください。
`;

    const requestBody = {
      contents: [{
        parts: [
          { text: promptText },
          { inlineData: { mimeType: "image/png", data: cleanBase64 } }
        ]
      }],
      generationConfig: {
        responseMimeType: "application/json",
        responseSchema: {
          type: "OBJECT",
          properties: {
            name: { type: "STRING" },
            attribute: { type: "STRING", enum: ["火", "水", "風"] },
            rarity: { type: "STRING", enum: ["C", "B", "A", "S"] },
            description: { type: "STRING" },
            stats: {
              type: "OBJECT",
              properties: {
                hp: { type: "INTEGER" },
                atk: { type: "INTEGER" },
                def: { type: "INTEGER" },
                spd: { type: "INTEGER" }
              },
              required: ["hp", "atk", "def", "spd"]
            },
            moves: {
              type: "OBJECT",
              properties: {
                normal: { type: "OBJECT", properties: { cost: { type: "INTEGER" }, name: { type: "STRING" }, flavor: { type: "STRING" } }, required: ["cost", "name", "flavor"] },
                strong: { type: "OBJECT", properties: { cost: { type: "INTEGER" }, name: { type: "STRING" }, flavor: { type: "STRING" } }, required: ["cost", "name", "flavor"] },
                utility: { type: "OBJECT", properties: { cost: { type: "INTEGER" }, name: { type: "STRING" }, flavor: { type: "STRING" } }, required: ["cost", "name", "flavor"] }
              },
              required: ["normal", "strong", "utility"]
            }
          },
          required: ["name", "attribute", "rarity", "description", "stats", "moves"]
        }
      }
    };

    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(requestBody)
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(`[文章解析APIエラー ${res.status}]\n${err.error?.message || "不明なエラー"}`);
    }

    const data = await res.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!text) throw new Error("[文章解析APIエラー] Geminiからのテキスト応答が空でした");

    return JSON.parse(text);
  }

  function App() {
    const [apiKey, setApiKey] = useState(loadSharedApiKey);
    const [gameData, setGameData] = useState(loadLocalData);

    // STEP1: 画像生成用ステート
    const [genLoading, setGenLoading] = useState(false);
    const [genImage, setGenImage] = useState(null);
    const [genError, setGenError] = useState(null);

    // STEP2: 文章生成・一括保存用ステート
    const [uploadedImage, setUploadedImage] = useState(null);
    const [analyzeLoading, setAnalyzeLoading] = useState(false);
    const [parsedMonster, setParsedMonster] = useState(null);
    const [analyzeError, setAnalyzeError] = useState(null);

    const uploadRef = useRef(null);

    // API Key 保存
    const handleApiKeyChange = (e) => {
      setApiKey(e.target.value);
      saveSharedApiKey(e.target.value);
    };

    // --- 【処理 1】 画像精製 ---
    const handleGenerateImageOnly = async () => {
      if (!apiKey) return alert("APIキーを入力してください");
      setGenLoading(true);
      setGenError(null);
      try {
        const imgUrl = await apiGenerateImage(apiKey);
        setGenImage(imgUrl);
      } catch (e) {
        setGenError(e.message);
      } finally {
        setGenLoading(false);
      }
    };

    const handleDownloadGenImage = () => {
      if (!genImage) return;
      const a = document.createElement("a");
      a.href = genImage;
      a.download = `monster_image_${Date.now()}.png`;
      a.click();
    };

    // --- 【処理 2】 画像アップロード＆文章生成（解析） ---
    const handleImageUpload = async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      
      const resized = await resizeImage(file);
      setUploadedImage(resized);
      setParsedMonster(null);
      setAnalyzeError(null);
    };

    const handleAnalyzeTextOnly = async () => {
      if (!apiKey) return alert("APIキーを入力してください");
      if (!uploadedImage) return alert("解析する画像をアップロードしてください");

      setAnalyzeLoading(true);
      setAnalyzeError(null);
      try {
        const result = await apiAnalyzeMonster(uploadedImage, apiKey);
        setParsedMonster(result);
      } catch (e) {
        setAnalyzeError(e.message);
      } finally {
        setAnalyzeLoading(false);
      }
    };

    // --- 【処理 3】 画像と文章情報をひとつにまとめて保存 ---
    const handleSaveFullMonster = () => {
      if (!uploadedImage || !parsedMonster) return;

      const fullMonsterData = {
        id: `mon_${Date.now()}`,
        photo: uploadedImage, // 画像
        name: parsedMonster.name, // 名称
        attribute: parsedMonster.attribute,
        rarity: parsedMonster.rarity,
        description: parsedMonster.description,
        stats: parsedMonster.stats, // ステータス
        moves: parsedMonster.moves, // 技名・設定
        createdAt: new Date().toLocaleString()
      };

      const newZukan = [fullMonsterData, ...gameData.zukan];
      const newGameData = { ...gameData, zukan: newZukan };
      setGameData(newGameData);
      saveLocalData(newGameData);

      alert(`「${parsedMonster.name}」の画像とデータを1つにまとめて保存しました！`);
      
      // クリア
      setUploadedImage(null);
      setParsedMonster(null);
    };

    return (
      <div className="main-container">
        <h2 style={{ fontSize: "16px", textAlign: "center", marginBottom: "16px" }}>🧪 API分離デバッグ & モンスター生成</h2>

        {/* APIキー設定 */}
        <div className="card">
          <div style={{ fontSize: "11px", color: "#9A9CC0" }}>Gemini API Key</div>
          <input type="password" className="api-key-input" placeholder="AIzaSy..." value={apiKey} onChange={handleApiKeyChange} />
        </div>

        {/* ================= STEP 1: 画像生成のみ ================= */}
        <div className="card">
          <div className="step-header">STEP 1: 画像精製 (Imagen 3 API)</div>
          <p style={{ fontSize: "11px", color: "#9A9CC0" }}>画像生成専用のAPIをテスト呼び出しします。</p>
          
          <button className="btn-action" disabled={genLoading} onClick={handleGenerateImageOnly}>
            {genLoading ? "画像生成API実行中..." : "🎨 画像のみ生成する"}
          </button>

          {genError && <div className="error-box">{genError}</div>}

          {genImage && (
            <div style={{ textAlign: "center", marginTop: "12px" }}>
              <img src={genImage} style={{ width: "160px", height: "160px", borderRadius: "8px", border: "2px solid #23E0C4" }} />
              <button className="btn-action btn-save" onClick={handleDownloadGenImage}>
                💾 生成された画像を保存する
              </button>
            </div>
          )}
        </div>

        {/* ================= STEP 2: アップロード & 文章生成 ================= */}
        <div className="card">
          <div className="step-header">STEP 2: アップロード & 文章生成 (Gemini API)</div>
          <p style={{ fontSize: "11px", color: "#9A9CC0" }}>保存した画像をアップロードし、名称・技・ステータスを解析生成します。</p>

          <input type="file" accept="image/*" ref={uploadRef} style={{ display: "none" }} onChange={handleImageUpload} />
          
          <button className="btn-action btn-secondary" onClick={() => uploadRef.current?.click()}>
            📁 画像をアップロード選択
          </button>

          {uploadedImage && (
            <div style={{ textAlign: "center", marginTop: "12px" }}>
              <img src={uploadedImage} style={{ width: "120px", height: "120px", borderRadius: "8px", border: "1px dashed #23E0C4" }} />
              
              <button className="btn-action" disabled={analyzeLoading} onClick={handleAnalyzeTextOnly}>
                {analyzeLoading ? "文章・技設定 生成中..." : "✨ この画像の名称・技名・設定を生成"}
              </button>
            </div>
          )}

          {analyzeError && <div className="error-box">{analyzeError}</div>}

          {/* 解析結果プレビュー */}
          {parsedMonster && (
            <div style={{ background: "#12142B", padding: "10px", borderRadius: "8px", marginTop: "12px", fontSize: "12px" }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <strong>{parsedMonster.name}</strong>
                <span className="tag" style={{ background: TYPE_CHART[parsedMonster.attribute]?.color || "#ccc", color: "#000" }}>{parsedMonster.attribute}</span>
              </div>
              <p style={{ color: "#9A9CC0", fontSize: "10px", margin: "4px 0" }}>{parsedMonster.description}</p>
              
              <div className="stat-grid">
                <div className="stat-box"><div className="lbl">HP</div><div className="val">{parsedMonster.stats.hp}</div></div>
                <div className="stat-box"><div className="lbl">ATK</div><div className="val">{parsedMonster.stats.atk}</div></div>
                <div className="stat-box"><div className="lbl">DEF</div><div className="val">{parsedMonster.stats.def}</div></div>
                <div className="stat-box"><div className="lbl">SPD</div><div className="val">{parsedMonster.stats.spd}</div></div>
              </div>

              <div style={{ fontSize: "10px", color: "#23E0C4", marginTop: "4px" }}>
                <div>⚔️ 通常技: {parsedMonster.moves.normal.name}</div>
                <div>🔥 必殺技: {parsedMonster.moves.strong.name}</div>
                <div>✨ 補助技: {parsedMonster.moves.utility.name}</div>
              </div>

              {/* ================= STEP 3: 一括保存 ================= */}
              <button className="btn-action btn-save" style={{ marginTop: "12px" }} onClick={handleSaveFullMonster}>
                📦 画像＋名称＋技＋ステータスを1つにまとめて保存
              </button>
            </div>
          )}
        </div>

        {/* 図鑑（保存データの確認領域） */}
        <div className="card">
          <div className="step-header">📖 保存済みモンスター一覧 ({gameData.zukan.length})</div>
          {gameData.zukan.map((mon) => (
            <div key={mon.id} style={{ display: "flex", gap: "10px", alignItems: "center", background: "#12142B", padding: "8px", borderRadius: "6px", marginBottom: "6px" }}>
              <img src={mon.photo} style={{ width: "48px", height: "48px", borderRadius: "6px", objectFit: "cover" }} />
              <div style={{ flex: 1, fontSize: "11px" }}>
                <div style={{ fontWeight: "bold" }}>{mon.name} <span style={{ color: "#23E0C4" }}>({mon.attribute})</span></div>
                <div style={{ color: "#9A9CC0", fontSize: "9px" }}>技: {mon.moves?.normal?.name} / {mon.moves?.strong?.name}</div>
              </div>
            </div>
          ))}
        </div>

      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
