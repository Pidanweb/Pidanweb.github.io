<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>スケジュール - YUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3e9;
    --panel: #ffffff;
    --panel-edge: #e6ddc8;
    --ink: #2c2f36;
    --ink-dim: #7c8288;
    --scan: #2fae90;
    --scan-soft: rgba(47, 174, 144, 0.14);
    --danger: #e2554a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 18px 40px;
  }
  #back_btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 800;
    font-size: 20px;
    margin: 0 0 16px;
  }

  /* ---------- カレンダー ---------- */
  #cal_header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  #cal_month_label {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 700;
    font-size: 16px;
  }
  .cal_nav_btn {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 14px;
  }
  #cal_weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 11px;
    color: var(--ink-dim);
    margin-bottom: 4px;
  }
  #cal_grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal_cell {
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 6px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    font-size: 13px;
    position: relative;
  }
  .cal_cell.empty {
    background: transparent;
    border: none;
  }
  .cal_cell.today {
    border: 2px solid var(--scan);
    font-weight: 700;
  }
  .cal_cell .dot {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--scan);
  }
  .cal_cell.selected { background: var(--scan-soft); }

  /* 期限つき予定の横棒(開始日〜期限日まで、セルをまたいでつながって見えるように左右へはみ出させる) */
  .cal_bars {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 5px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    pointer-events: none;
  }
  .cal_bar {
    height: 5px;
    margin: 0 -3px;
  }
  .cal_bar.empty { visibility: hidden; }
  .cal_bar.start { margin-left: 5px; border-top-left-radius: 3px; border-bottom-left-radius: 3px; }
  .cal_bar.end   { margin-right: 5px; border-top-right-radius: 3px; border-bottom-right-radius: 3px; }
  .cal_bar.done  { background: #b9b9bd !important; }
  .cal_more {
    position: absolute;
    left: 4px;
    top: 3px;
    font-size: 9px;
    color: var(--ink-dim);
  }

  /* 期限つきタスクの一覧(カレンダーの下) */
  #due_section { margin-top: 14px; }
  .due_item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 9px 12px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .due_swatch { width: 14px; height: 6px; border-radius: 3px; flex-shrink: 0; }
  .due_name { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .due_left { font-size: 12px; font-weight: 800; color: var(--warn); flex-shrink: 0; }
  .due_left.urgent { color: var(--danger); }
  .due_left.over { color: var(--ink-dim); }
  .due_item.done { background: #1d1d1f; border-color: #1d1d1f; }
  .due_item.done .due_name { color: #77777c; text-decoration: line-through; }
  .due_item.done .due_left { color: #77777c; }

  /* 予定リスト内の期限表示 */
  .event_due {
    font-size: 12px;
    font-weight: 700;
    color: var(--warn);
    margin-top: 3px;
  }
  .event_due.urgent { color: var(--danger); }
  .event_due_bar {
    height: 6px;
    border-radius: 3px;
    background: #ece5d3;
    overflow: hidden;
    margin-top: 5px;
    width: 160px;
    max-width: 100%;
  }
  .event_due_bar > i { display: block; height: 100%; border-radius: 3px; }
  .event_btns { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; flex-shrink: 0; }
  .event_done_btn {
    border: 2px solid #1a1a1a;
    background: #fff;
    color: #1a1a1a;
    border-radius: 10px;
    padding: 5px 10px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 800;
  }
  .event_row { flex: 0 0 auto; }
  .event_row > div:first-child { flex: 1; min-width: 0; }
  .event_row.done { background: #1d1d1f; border-color: #1d1d1f; }
  .event_row.done .event_main { color: #77777c; text-decoration: line-through; }
  .event_row.done .event_time, .event_row.done .event_memo { color: #5d5d62; }
  .event_row.done .event_due, .event_row.done .event_due_bar { display: none; }
  .event_row.done .event_done_btn { background: #3a3a3e; border-color: #3a3a3e; color: #b8b8bd; }

  /* ---------- 予定リスト ---------- */
  #list_section {
    margin-top: 24px;
  }
  #list_title {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 10px;
  }
  #add_btn {
    width: 100%;
    padding: 12px 0;
    border-radius: 12px;
    border: none;
    background: var(--scan-soft);
    color: var(--scan);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .event_row {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .event_row .event_main {
    font-size: 14px;
    font-weight: 600;
  }
  .event_row .event_time {
    font-size: 12px;
    color: var(--scan);
    font-weight: 700;
  }
  .event_row .event_memo {
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 3px;
  }
  .event_del_btn {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 13px;
    flex-shrink: 0;
  }
  #empty_msg {
    color: var(--ink-dim);
    font-size: 13px;
    text-align: center;
    padding: 20px 0;
  }

  /* ---------- 入力パネル ---------- */
  #form_panel {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
  }
  #form_panel.active { display: flex; }
  #form_sheet {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border-radius: 20px 20px 0 0;
    padding: 22px 20px max(26px, env(safe-area-inset-bottom));
  }
  #form_date_label {
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 14px;
  }
  #form_panel label {
    font-size: 12.5px;
    color: var(--ink-dim);
    display: block;
    margin: 12px 0 4px;
  }
  #form_panel input[type="time"],
  #form_panel input[type="date"],
  #form_panel input[type="text"],
  #form_panel textarea {
    width: 100%;
    background: rgba(0,0,0,0.03);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  #form_panel textarea { height: 70px; resize: none; }
  .form_hint { font-size: 11.5px; color: var(--ink-dim); margin-top: 4px; }
  .form_row2 { display: flex; gap: 10px; }
  .form_row2 > div { flex: 1; min-width: 0; }
  #form_buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  #form_buttons button {
    flex: 1;
    padding: 13px 0;
    border-radius: 12px;
    border: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
  }
  #form_save_btn { background: var(--scan); color: #fff; }
  #form_cancel_btn { background: rgba(0,0,0,0.045); color: var(--ink); }
</style>
</head>
<body>
<div id="app">
  <a id="back_btn" href="../index.html">← ホームに戻る</a>
  <h1>スケジュール</h1>

  <div id="cal_header">
    <button class="cal_nav_btn" id="prev_month_btn">←</button>
    <div id="cal_month_label"></div>
    <button class="cal_nav_btn" id="next_month_btn">→</button>
  </div>
  <div id="cal_weekdays">
    <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
  </div>
  <div id="cal_grid"></div>

  <div id="due_section"></div>

  <div id="list_section">
    <div id="list_title">選択中の日の予定</div>
    <button id="add_btn">＋ この日に予定を追加</button>
    <div id="event_list"></div>
  </div>

  <div id="form_panel">
    <div id="form_sheet">
      <div id="form_date_label"></div>
      <div class="form_row2">
        <div>
          <label>時間</label>
          <input type="time" id="form_time">
        </div>
        <div>
          <label>期限(任意)</label>
          <input type="date" id="form_due">
        </div>
      </div>
      <div class="form_hint">期限を入れると、カレンダーに開始日〜期限日の横棒が出て、残り日数が分かります。</div>
      <label>やること</label>
      <input type="text" id="form_task" placeholder="例: 通院">
      <label>メモ</label>
      <textarea id="form_memo" placeholder="任意"></textarea>
      <div id="form_buttons">
        <button id="form_cancel_btn">閉じる</button>
        <button id="form_save_btn">保存する</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const SCHEDULE_KEY = 'yui_schedule';

  // ---- チュートリアル進行(yui_tutorial_progress の level。5 以上で完了) ----
  const PROGRESS_KEY = 'yui_tutorial_progress';
  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null'); } catch (e) { return null; }
  }
  // 戻り先: チュートリアル中は index_tyuto.html、完了後は index.html(このファイルは apps/ にあるので ../ が必要)
  function setupBackLinks() {
    const prog = loadProgress();
    const href = (prog && prog.level && prog.level < 5) ? '../index_tyuto.html' : '../index.html';
    document.getElementById('back_btn').href = href;
  }
  // 予定を登録したらチュートリアルを進める(スケジュール手順 Lv.3 → Lv.4)
  function advanceTutorial(fromLevel) {
    try {
      const prog = loadProgress();
      if (prog && prog.level === fromLevel) {
        prog.level = fromLevel + 1;
        localStorage.setItem(PROGRESS_KEY, JSON.stringify(prog));
        setupBackLinks();
      }
    } catch (e) {
      console.error('Tutorial progress error:', e);
    }
  }
  setupBackLinks();

  const els = {
    calMonthLabel: document.getElementById('cal_month_label'),
    calGrid: document.getElementById('cal_grid'),
    prevMonthBtn: document.getElementById('prev_month_btn'),
    nextMonthBtn: document.getElementById('next_month_btn'),
    eventList: document.getElementById('event_list'),
    listTitle: document.getElementById('list_title'),
    addBtn: document.getElementById('add_btn'),
    formPanel: document.getElementById('form_panel'),
    formDateLabel: document.getElementById('form_date_label'),
    formTime: document.getElementById('form_time'),
    formDue: document.getElementById('form_due'),
    formTask: document.getElementById('form_task'),
    formMemo: document.getElementById('form_memo'),
    formSaveBtn: document.getElementById('form_save_btn'),
    formCancelBtn: document.getElementById('form_cancel_btn'),
  };

  function loadSchedule() {
    try {
      const raw = localStorage.getItem(SCHEDULE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }
  function saveSchedule(list) {
    localStorage.setItem(SCHEDULE_KEY, JSON.stringify(list));
  }

  function dateStr(y, m, d) {
    return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }
  function todayStr() {
    const d = new Date();
    return dateStr(d.getFullYear(), d.getMonth(), d.getDate());
  }

  // 日付文字列(YYYY-MM-DD)どうしの日数差
  function dayDiff(fromStr, toStr) {
    const [y1, m1, d1] = fromStr.split('-').map(Number);
    const [y2, m2, d2] = toStr.split('-').map(Number);
    return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
  }
  // その日に関係する予定か(当日の予定 or 期限つきで期間中)
  function coversDate(ev, ds) {
    if (ev.date === ds) return true;
    return !!(ev.due && ev.date <= ds && ds <= ev.due);
  }
  // 期限の残り日数の表示文
  function dueLabel(ev) {
    const left = dayDiff(todayStr(), ev.due);
    if (left > 0) return { text: `残り${left}日`, cls: left <= 1 ? 'urgent' : '' };
    if (left === 0) return { text: '今日が期限', cls: 'urgent' };
    return { text: `期限切れ(${-left}日前)`, cls: 'over' };
  }
  // 期限つき予定の色(idから毎回同じ色を選ぶ)
  const BAR_COLORS = ['#e8913a', '#4f8ef0', '#d9558f', '#8a63d2', '#2fae90', '#c9a227'];
  function colorOf(ev) {
    let h = 0;
    for (const c of String(ev.id)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return BAR_COLORS[h % BAR_COLORS.length];
  }

  let viewYear = new Date().getFullYear();
  let viewMonth = new Date().getMonth(); // 0-indexed
  let selectedDate = todayStr();
  // ホームから schedule.html#2026-11-27 のように開かれたら、その日を選択する
  if (/^#\d{4}-\d{2}-\d{2}$/.test(location.hash)) {
    selectedDate = location.hash.slice(1);
    const [y, m] = selectedDate.split('-').map(Number);
    viewYear = y; viewMonth = m - 1;
  }

  const MAX_LANES = 3; // 1マスに並べる横棒の最大本数

  function renderCalendar() {
    els.calMonthLabel.textContent = `${viewYear}年 ${viewMonth + 1}月`;
    els.calGrid.innerHTML = '';

    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const monthStart = dateStr(viewYear, viewMonth, 1);
    const monthEnd = dateStr(viewYear, viewMonth, daysInMonth);
    const schedule = loadSchedule();
    // 横棒にしない(期限なしの)予定がある日 → 点を表示
    const datesWithEvents = new Set(schedule.filter(ev => !ev.due).map(ev => ev.date));

    // この月にかかる期限つき予定を、開始日の早い順に段(レーン)へ割り当てる
    const ranged = schedule
      .filter(ev => ev.due && ev.date <= monthEnd && ev.due >= monthStart)
      .sort((a, b) => a.date.localeCompare(b.date) || a.due.localeCompare(b.due));
    const laneEnds = [];
    ranged.forEach(ev => {
      let lane = laneEnds.findIndex(end => end < ev.date);
      if (lane === -1) { lane = laneEnds.length; laneEnds.push(ev.due); }
      else laneEnds[lane] = ev.due;
      ev._lane = lane;
    });

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'cal_cell empty';
      els.calGrid.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const ds = dateStr(viewYear, viewMonth, d);
      const cell = document.createElement('div');
      cell.className = 'cal_cell';
      if (ds === todayStr()) cell.classList.add('today');
      if (ds === selectedDate) cell.classList.add('selected');

      const num = document.createElement('div');
      num.textContent = d;
      cell.appendChild(num);

      if (datesWithEvents.has(ds)) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        cell.appendChild(dot);
      }

      // 横棒
      const here = ranged.filter(ev => ev.date <= ds && ds <= ev.due);
      if (here.length) {
        const bars = document.createElement('div');
        bars.className = 'cal_bars';
        const usedLanes = Math.min(MAX_LANES, Math.max(...here.map(ev => ev._lane)) + 1);
        const weekday = (firstDay + d - 1) % 7;
        for (let lane = 0; lane < usedLanes; lane++) {
          const ev = here.find(e => e._lane === lane);
          const bar = document.createElement('div');
          bar.className = 'cal_bar';
          if (!ev) { bar.classList.add('empty'); bars.appendChild(bar); continue; }
          bar.style.background = colorOf(ev);
          if (ev.date === ds || d === 1 || weekday === 0) bar.classList.add('start');
          if (ev.due === ds || d === daysInMonth || weekday === 6) bar.classList.add('end');
          if (ev.done) bar.classList.add('done');
          bar.title = ev.task;
          bars.appendChild(bar);
        }
        cell.appendChild(bars);
        const hidden = here.filter(ev => ev._lane >= MAX_LANES).length;
        if (hidden) {
          const more = document.createElement('div');
          more.className = 'cal_more';
          more.textContent = `+${hidden}`;
          cell.appendChild(more);
        }
      }

      cell.addEventListener('click', () => {
        selectedDate = ds;
        renderCalendar();
        renderEventList();
      });

      els.calGrid.appendChild(cell);
    }

    renderDueList(ranged);
  }

  // カレンダー下: この月にかかる期限つきタスクの一覧(色・残り日数)
  function renderDueList(ranged) {
    const box = document.getElementById('due_section');
    box.innerHTML = '';
    ranged.forEach(ev => {
      const item = document.createElement('div');
      item.className = 'due_item' + (ev.done ? ' done' : '');
      const sw = document.createElement('span');
      sw.className = 'due_swatch';
      sw.style.background = ev.done ? '#77777c' : colorOf(ev);
      const name = document.createElement('span');
      name.className = 'due_name';
      name.textContent = ev.task;
      const left = document.createElement('span');
      const lb = dueLabel(ev);
      left.className = 'due_left ' + lb.cls;
      left.textContent = ev.done ? '完了' : lb.text;
      item.append(sw, name, left);
      item.addEventListener('click', () => {
        selectedDate = ev.date;
        renderCalendar();
        renderEventList();
      });
      box.appendChild(item);
    });
  }

  function formatDateLabel(ds) {
    const [y, m, d] = ds.split('-').map(Number);
    const weekday = ['日','月','火','水','木','金','土'][new Date(y, m - 1, d).getDay()];
    return `${m}月${d}日(${weekday})`;
  }

  function renderEventList() {
    els.listTitle.textContent = `${formatDateLabel(selectedDate)}の予定`;
    const schedule = loadSchedule();
    const todays = schedule
      .filter(ev => coversDate(ev, selectedDate))
      .sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));

    els.eventList.innerHTML = '';

    if (todays.length === 0) {
      const empty = document.createElement('div');
      empty.id = 'empty_msg';
      empty.textContent = 'この日の予定はまだありません。上のボタンか、カレンダーの日付をタップして追加してください。';
      els.eventList.appendChild(empty);
      return;
    }

    todays.forEach(ev => {
      const row = document.createElement('div');
      row.className = 'event_row' + (ev.done ? ' done' : '');

      const left = document.createElement('div');
      if (ev.time) {
        const time = document.createElement('div');
        time.className = 'event_time';
        time.textContent = ev.time;
        left.appendChild(time);
      }
      const main = document.createElement('div');
      main.className = 'event_main';
      main.textContent = ev.task;
      left.appendChild(main);

      if (ev.due) {
        const lb = dueLabel(ev);
        const due = document.createElement('div');
        due.className = 'event_due ' + lb.cls;
        due.textContent = `${formatDateLabel(ev.date)}〜${formatDateLabel(ev.due)}・${lb.text}`;
        left.appendChild(due);
        const bar = document.createElement('div');
        bar.className = 'event_due_bar';
        const fill = document.createElement('i');
        const total = Math.max(1, dayDiff(ev.date, ev.due));
        const passed = Math.min(1, Math.max(0, dayDiff(ev.date, todayStr()) / total));
        fill.style.width = Math.round(passed * 100) + '%';
        fill.style.background = colorOf(ev);
        bar.appendChild(fill);
        left.appendChild(bar);
      }

      if (ev.memo) {
        const memo = document.createElement('div');
        memo.className = 'event_memo';
        memo.textContent = ev.memo;
        left.appendChild(memo);
      }

      const btns = document.createElement('div');
      btns.className = 'event_btns';

      const doneBtn = document.createElement('button');
      doneBtn.className = 'event_done_btn';
      doneBtn.textContent = ev.done ? '戻す' : '完了';
      doneBtn.addEventListener('click', () => {
        const all = loadSchedule();
        const t = all.find(e => e.id === ev.id);
        if (t) t.done = !t.done;
        saveSchedule(all);
        renderCalendar();
        renderEventList();
      });

      const delBtn = document.createElement('button');
      delBtn.className = 'event_del_btn';
      delBtn.textContent = '削除';
      delBtn.addEventListener('click', () => {
        const all = loadSchedule().filter(e => e.id !== ev.id);
        saveSchedule(all);
        renderCalendar();
        renderEventList();
      });

      btns.append(doneBtn, delBtn);
      row.appendChild(left);
      row.appendChild(btns);
      els.eventList.appendChild(row);
    });
  }

  function openForm(ds) {
    els.formDateLabel.textContent = formatDateLabel(ds) + ' から';
    els.formTime.value = '';
    els.formDue.value = '';
    els.formDue.min = ds;
    els.formTask.value = '';
    els.formMemo.value = '';
    els.formPanel.dataset.date = ds;
    els.formPanel.classList.add('active');
  }

  els.addBtn.addEventListener('click', () => openForm(selectedDate));

  els.formCancelBtn.addEventListener('click', () => {
    els.formPanel.classList.remove('active');
  });

  els.formSaveBtn.addEventListener('click', () => {
    const task = els.formTask.value.trim();
    if (!task) {
      els.formTask.focus();
      return;
    }
    const start = els.formPanel.dataset.date;
    let due = els.formDue.value;
    if (due && due < start) {
      alert('期限は開始日より後の日付にしてください。');
      return;
    }
    if (due === start) due = ''; // 同じ日なら通常の予定として扱う
    const all = loadSchedule();
    const item = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      date: start,
      time: els.formTime.value,
      task,
      memo: els.formMemo.value.trim(),
    };
    if (due) item.due = due;
    all.push(item);
    saveSchedule(all);
    advanceTutorial(3); // 予定を登録できたらレベルアップ
    els.formPanel.classList.remove('active');
    renderCalendar();
    renderEventList();
  });

  els.prevMonthBtn.addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderCalendar();
  });
  els.nextMonthBtn.addEventListener('click', () => {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderCalendar();
  });

  renderCalendar();
  renderEventList();
})();
</script>
</body>
</html>
