<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YUIとお話し</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3e9;
    --panel: #ffffff;
    --panel-edge: #e6ddc8;
    --ink: #2c2f36;
    --ink-dim: #7c8288;
    --scan: #2fae90;
    --scan-soft: rgba(47, 174, 144, 0.14);
    --warn: #d98a33;
    --danger: #e2554a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    overflow: hidden;
  }

  #app {
    position: relative;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- 上部バー ---------- */

  #top_bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: max(16px, env(safe-area-inset-top)) 18px 12px;
    border-bottom: 1px solid var(--panel-edge);
  }

  #back_btn {
    background: rgba(0,0,0,0.055);
    border: 1px solid rgba(0,0,0,0.12);
    color: var(--ink);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 15px;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  #top_avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background-color: rgba(0,0,0,0.055);
    background-size: cover;
    background-position: center;
  }
  #top_avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }

  #top_title {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 700;
    font-size: 15px;
  }

  #top_status {
    font-size: 11.5px;
    color: var(--ink-dim);
  }

  #settings_btn {
    margin-left: auto;
    background: rgba(0,0,0,0.055);
    border: 1px solid rgba(0,0,0,0.12);
    color: var(--ink-dim);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 12px;
    font-family: inherit;
  }

  /* ---------- チャットタイムライン ---------- */

  #chat_scroll {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .chat_row {
    display: flex;
    gap: 8px;
    max-width: 88%;
  }
  .chat_row.user { align-self: flex-end; flex-direction: row-reverse; }
  .chat_row.assistant { align-self: flex-start; }

  .chat_avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background-color: rgba(0,0,0,0.055);
    background-size: cover;
    background-position: center;
  }
  .chat_avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }

  .chat_bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.7;
  }
  .chat_row.user .chat_bubble {
    background: var(--scan-soft);
    color: var(--ink);
    border-bottom-right-radius: 4px;
  }
  .chat_row.assistant .chat_bubble {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }

  /* ---------- 下部入力エリア ---------- */

  #input_bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px max(12px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--panel-edge);
    background: var(--panel);
  }

  #mic_btn {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--scan);
    color: #06231d;
    font-size: 18px;
  }

  #mic_btn.state-listening {
    background: var(--danger);
    color: #2a0906;
    animation: micpulse 1s ease-in-out infinite;
  }
  #mic_btn.state-thinking { background: var(--warn); color: #2a1a04; }
  #mic_btn.state-speaking { background: var(--scan-soft); color: var(--scan); }

  @keyframes micpulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(240,104,94,0.5); }
    50% { box-shadow: 0 0 0 10px rgba(240,104,94,0); }
  }

  #text_input {
    flex: 1;
    background: rgba(0,0,0,0.045);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    border-radius: 20px;
    padding: 11px 16px;
    font-size: 14px;
    font-family: inherit;
  }

  #send_btn {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.055);
    color: var(--ink);
    font-size: 16px;
  }

  #image_btn {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.055);
    color: var(--ink);
    font-size: 17px;
  }

  /* ---------- 画像プレビュー(送信前) ---------- */

  #image_preview_bar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 12px 0;
    background: var(--panel);
  }
  #image_preview_bar.active { display: flex; }

  #image_preview_thumb {
    width: 56px;
    height: 56px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid var(--panel-edge);
  }

  #image_preview_remove {
    background: rgba(0,0,0,0.055);
    border: none;
    color: var(--ink-dim);
    border-radius: 50%;
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  /* ---------- チャット内の画像 ---------- */

  .chat_bubble img.chat_image {
    display: block;
    max-width: 180px;
    max-height: 180px;
    border-radius: 10px;
    margin-top: 6px;
    object-fit: cover;
  }
  .chat_bubble .chat_image + .chat_text_after { margin-top: 6px; }

  /* ---------- APIキー設定パネル ---------- */

  #key_panel {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 30;
    display: none;
    flex-direction: column;
    padding: max(24px, env(safe-area-inset-top)) 24px 24px;
  }
  #key_panel.active { display: flex; }

  #key_panel .layer_title {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 800;
    font-size: 20px;
  }

  #key_panel label {
    font-size: 13px;
    color: var(--ink-dim);
    line-height: 1.7;
    margin-top: 10px;
    display: block;
  }

  #key_panel textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    border-radius: 12px;
    padding: 14px;
    font-size: 14px;
    font-family: monospace;
    resize: none;
    height: 90px;
    margin: 16px 0;
  }

  #key_panel .row {
    display: flex;
    gap: 10px;
  }
  #key_panel .row button {
    flex: 1;
    padding: 13px 0;
    border-radius: 14px;
    border: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
  }
  #key_save { background: var(--scan); color: #06231d; }
  #key_close { background: rgba(0,0,0,0.055); color: var(--ink); }
</style>
</head>
<body>

<div id="app">

  <div id="top_bar">
    <a id="back_btn" href="../index.html">←</a>
    <div id="top_avatar"><img id="top_avatar_img" src="chars/char_normal.png" alt="YUI"></div>
    <div>
      <div id="top_title">YUI</div>
      <div id="top_status">短押しで質問 / テキスト入力もできます</div>
    </div>
    <button id="settings_btn">APIキー設定</button>
  </div>

  <div id="chat_scroll"></div>

  <div id="image_preview_bar">
    <img id="image_preview_thumb" alt="送信する画像のプレビュー">
    <button id="image_preview_remove" aria-label="画像を取り消す">✕</button>
  </div>

  <div id="input_bar">
    <button id="image_btn" aria-label="画像を送る">🖼️</button>
    <input id="image_input" type="file" accept="image/*" style="display:none">
    <button id="mic_btn" aria-label="音声で質問">🎤</button>
    <input id="text_input" type="text" placeholder="メッセージを入力...">
    <button id="send_btn" aria-label="送信">➤</button>
  </div>

  <div id="key_panel">
    <div class="layer_title">Gemini APIキー</div>
    <label>
      Google AI Studioで発行したAPIキーを貼り付けてください。<br>
      このキーはGemini APIへのリクエストを認証するためだけに使われます。この端末内(localStorage)に保存され、次回からは入力不要になります。
    </label>
    <textarea id="key_input" placeholder="AQ.xxxxxxxxxxxxxxxxxxxxxxxx"></textarea>
    <div class="row">
      <button id="key_close">閉じる</button>
      <button id="key_save">保存する</button>
    </div>
  </div>

</div>

<script>
(() => {
  const PROFILE_KEY = 'yui_profile';
  const PROGRESS_KEY = 'yui_tutorial_progress';
  const API_KEY_STORAGE = 'yui_gemini_api_key';
  const MODEL = "gemini-3.6-flash";

  const els = {
    backBtn: document.getElementById('back_btn'),
    chatScroll: document.getElementById('chat_scroll'),
    micBtn: document.getElementById('mic_btn'),
    textInput: document.getElementById('text_input'),
    sendBtn: document.getElementById('send_btn'),
    settingsBtn: document.getElementById('settings_btn'),
    keyPanel: document.getElementById('key_panel'),
    keyInput: document.getElementById('key_input'),
    keySave: document.getElementById('key_save'),
    keyClose: document.getElementById('key_close'),
    topAvatarImg: document.getElementById('top_avatar_img'),
    topStatus: document.getElementById('top_status'),
    imageBtn: document.getElementById('image_btn'),
    imageInput: document.getElementById('image_input'),
    imagePreviewBar: document.getElementById('image_preview_bar'),
    imagePreviewThumb: document.getElementById('image_preview_thumb'),
    imagePreviewRemove: document.getElementById('image_preview_remove'),
  };

  // ============ 1. 戻るボタンの動的切替 ============
  function setupBackButton() {
    try {
      const raw = localStorage.getItem(PROGRESS_KEY);
      const prog = raw ? JSON.parse(raw) : null;
      // チュートリアル実行中(completedでない)の場合は index_tutorial.html へ戻す
      if (prog && prog.level && !prog.completed) {
        els.backBtn.href = '../index_tutorial.html';
      } else {
        els.backBtn.href = '../index.html';
      }
    } catch (e) {
      els.backBtn.href = '../index.html';
    }
  }
  setupBackButton();

  // ============ 2. 好きなものを検出して記憶 ============
  function checkAndSaveFavorite(text) {
    if (!text) return;
    const keywords = ['好き', 'お気に入り', '推し', 'ハマってる', 'はまってる'];
    if (keywords.some(kw => text.includes(kw))) {
      try {
        const raw = localStorage.getItem(PROFILE_KEY);
        const profile = raw ? JSON.parse(raw) : {};
        profile.user_favorite = text;
        localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
      } catch (e) {
        console.error('Favorite save error:', e);
      }
    }
  }

  // ============ 3. チュートリアルクリア判定 ============
  function checkTutorialClear() {
    try {
      const raw = localStorage.getItem(PROGRESS_KEY);
      const prog = raw ? JSON.parse(raw) : null;
      if (prog && prog.level === 1) {
        prog.level = 2; // トーク完了でLevel 2に昇格
        localStorage.setItem(PROGRESS_KEY, JSON.stringify(prog));
        // クリア後に戻り先を再設定
        setupBackButton();
      }
    } catch (e) {
      console.error('Tutorial progress error:', e);
    }
  }

  // ============ 設定の読み込み ============
  function loadProfile() {
    try {
      const raw = localStorage.getItem(PROFILE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }
  const profile = loadProfile();
  let apiKey = localStorage.getItem(API_KEY_STORAGE) || profile.gemini_api_key || "";

  const TONE_TEXT = {
    polite:   "丁寧語(です・ます調)で話してください。",
    friendly: "フレンドリーなタメ口で話してください。",
    tsundere: "ややツンデレ気味に、素っ気なさの中に優しさが滲む話し方をしてください。",
    cool:     "クールで無口気味に、必要なことだけ簡潔に話してください。",
  };

  const FEEDBACK_TEXT = {
    gentle:  "指摘やアドバイスをするときは、優しく励ますような伝え方をしてください。",
    direct:  "指摘やアドバイスをするときは、率直にはっきりと伝えてください。",
    playful: "指摘やアドバイスをするときは、ちょっとユーモラスに茶化しながら伝えてください。",
  };

  const userName = profile.user_name || 'あなた';
  const customPersonality = (profile.personality || profile.custom_personality || '').trim();

  const personalityBlock = customPersonality
    ? "あなたは次のキャラクター設定になりきってください。設定に書かれた口調・話し方・言葉づかいを何よりも優先してください。\n" +
      "----\n" + customPersonality + "\n----\n"
    : "あなたはナビゲーションAI「YUI」です。ユーザーの生活をサポートするパートナーとして振る舞ってください。\n" +
      (TONE_TEXT[profile.tone_style] || TONE_TEXT.friendly) + "\n" +
      (FEEDBACK_TEXT[profile.feedback_style] || FEEDBACK_TEXT.gentle) + "\n";

  const SYSTEM_PROMPT =
    personalityBlock +
    `ユーザーのことは「${userName}」と呼んでください。\n` +
    "回答は必ず音声で読み上げられます。次のルールを厳守してください。\n" +
    "・アスタリスク(*)、シャープ(#)、箇条書きの記号、太字や見出しなどのMarkdown書式は絶対に使わない\n" +
    "・数字の箇条書き(1. 2. のような形式)も使わない。文章として話す\n" +
    "・回答は簡潔にする。特別な指示がない限り2〜3文、長くても4文までに収める\n" +
    "・一貫して上記の性格・口調を維持してください";

  let conversationHistory = [];

  // ============ APIキー設定 ============
  els.settingsBtn.addEventListener('click', () => {
    els.keyInput.value = apiKey;
    els.keyPanel.classList.add('active');
  });
  els.keyClose.addEventListener('click', () => els.keyPanel.classList.remove('active'));
  els.keySave.addEventListener('click', () => {
    apiKey = els.keyInput.value.trim();
    localStorage.setItem(API_KEY_STORAGE, apiKey);
    els.keyPanel.classList.remove('active');
  });

  // ============ チャット表示 ============
  function addBubble(role, text, imageDataUrl) {
    const row = document.createElement('div');
    row.className = `chat_row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'chat_avatar';
    if (role === 'assistant') avatar.style.backgroundImage = `url('${timeOfDayBg()}')`;
    const img = document.createElement('img');
    img.src = role === 'assistant' ? 'chars/char_normal.png' : '';
    if (role === 'assistant') avatar.appendChild(img);

    const bubble = document.createElement('div');
    bubble.className = 'chat_bubble';

    if (imageDataUrl) {
      const image = document.createElement('img');
      image.className = 'chat_image';
      image.src = imageDataUrl;
      bubble.appendChild(image);
    }
    if (text) {
      const textEl = document.createElement('div');
      textEl.className = 'chat_text_after';
      textEl.textContent = text;
      bubble.appendChild(textEl);
    }

    if (role === 'assistant') row.appendChild(avatar);
    row.appendChild(bubble);
    els.chatScroll.appendChild(row);
    els.chatScroll.scrollTop = els.chatScroll.scrollHeight;
  }

  if (customPersonality && apiKey) {
    setAvatarState('thinking');
    callGemini([{ role: 'user', parts: [{ text: '(最初の挨拶をひとことだけ、設定した性格の口調でお願いします)' }] }])
      .then((line) => {
        addBubble('assistant', line || `${userName}、お話ししよう。何か聞きたいことある？`);
        setAvatarState('normal');
      })
      .catch(() => {
        addBubble('assistant', `${userName}、お話ししよう。何か聞きたいことある？`);
        setAvatarState('normal');
      });
  } else {
    addBubble('assistant', `${userName}、お話ししよう。何か聞きたいことある？`);
  }

  // ============ Gemini呼び出し ============
  async function callGemini(contents) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents,
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        generationConfig: {
          thinkingConfig: { thinkingBudget: 0 },
          maxOutputTokens: 2048,
        },
      }),
    });
    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      throw new Error(errBody?.error?.message || `APIエラー (${res.status})`);
    }
    const data = await res.json();
    const candidate = data.candidates?.[0];
    const text = candidate?.content?.parts?.[0]?.text ?? "";
    if (!text) {
      const reason = candidate?.finishReason;
      throw new Error(reason ? `応答が空でした(${reason})` : '応答が空でした');
    }
    return text;
  }

  const MAX_HISTORY_TURNS = 20;
  function trimmedHistory() {
    const maxEntries = MAX_HISTORY_TURNS * 2;
    if (conversationHistory.length <= maxEntries) return conversationHistory;
    return conversationHistory.slice(-maxEntries);
  }

  function timeOfDayBg() {
    const hour = new Date().getHours();
    if (hour >= 5 && hour < 11)  return 'chars/bg_morning.jpg';
    if (hour >= 17 && hour < 20) return 'chars/bg_evening.jpg';
    if (hour >= 20 || hour < 5)  return 'chars/bg_evening.jpg';
    return 'chars/bg_day.jpg';
  }
  const currentBg = timeOfDayBg();
  document.getElementById('top_avatar').style.backgroundImage = `url('${currentBg}')`;

  function setAvatarState(state) {
    const map = {
      normal: 'chars/char_normal.png',
      listening: 'chars/char_thinking.png',
      thinking: 'chars/char_thinking.png',
      speaking: 'chars/char_normal.png',
      error: 'chars/char_error.png',
    };
    els.topAvatarImg.src = map[state] || map.normal;
    els.micBtn.className = state === 'normal' ? '' : `state-${state}`;
  }

  function speak(text, onEnd) {
    if (!('speechSynthesis' in window)) { if (onEnd) onEnd(); return; }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ja-JP';
    utterance.rate = 1.15;
    if (onEnd) { utterance.onend = onEnd; utterance.onerror = onEnd; }
    window.speechSynthesis.speak(utterance);
  }

  // ============ 画像添付 ============
  let pendingImage = null;

  function compressImageFile(file, maxSize = 1024, quality = 0.7) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
      reader.onload = () => {
        const image = new Image();
        image.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
        image.onload = () => {
          let { width, height } = image;
          if (width > maxSize || height > maxSize) {
            if (width >= height) {
              height = Math.round(height * (maxSize / width));
              width = maxSize;
            } else {
              width = Math.round(width * (maxSize / height));
              height = maxSize;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(image, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          const base64 = dataUrl.split(',')[1];
          resolve({ mimeType: 'image/jpeg', base64, dataUrl });
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function showImagePreview(dataUrl) {
    els.imagePreviewThumb.src = dataUrl;
    els.imagePreviewBar.classList.add('active');
  }

  function clearImagePreview() {
    pendingImage = null;
    els.imagePreviewThumb.src = '';
    els.imagePreviewBar.classList.remove('active');
    els.imageInput.value = '';
  }

  els.imageBtn.addEventListener('click', () => {
    if (!apiKey) { els.settingsBtn.click(); return; }
    els.imageInput.click();
  });

  els.imageInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      pendingImage = await compressImageFile(file);
      showImagePreview(pendingImage.dataUrl);
    } catch (err) {
      els.topStatus.textContent = '画像の読み込みに失敗しました';
      setTimeout(() => { els.topStatus.textContent = '短押しで質問 / テキスト入力もできます'; }, 1500);
    }
  });

  els.imagePreviewRemove.addEventListener('click', clearImagePreview);

  // ============ メッセージ送信 ============
  async function sendMessage(text) {
    const image = pendingImage;
    if (!text && !image) return;
    if (!apiKey) { els.settingsBtn.click(); return; }

    // 発言があったので「好きなもの記憶」と「チュートリアル判定」を実行
    checkAndSaveFavorite(text);
    checkTutorialClear();

    const parts = [];
    if (image) parts.push({ inlineData: { mimeType: image.mimeType, data: image.base64 } });
    if (text) parts.push({ text });

    conversationHistory.push({ role: 'user', parts });
    addBubble('user', text, image ? image.dataUrl : null);
    clearImagePreview();
    setAvatarState('thinking');
    els.topStatus.textContent = '考え中...';

    try {
      const answer = await callGemini(trimmedHistory());
      conversationHistory.push({ role: 'model', parts: [{ text: answer }] });
      addBubble('assistant', answer);
      setAvatarState('speaking');
      els.topStatus.textContent = '話しています...';
      speak(answer, () => {
        setAvatarState('normal');
        els.topStatus.textContent = '短押しで質問 / テキスト入力もできます';
      });
    } catch (err) {
      addBubble('assistant', 'エラー: ' + err.message);
      setAvatarState('error');
      setTimeout(() => {
        setAvatarState('normal');
        els.topStatus.textContent = '短押しで質問 / テキスト入力もできます';
      }, 1500);
    }
  }

  // ============ テキスト入力 ============
  els.sendBtn.addEventListener('click', () => {
    const text = els.textInput.value.trim();
    els.textInput.value = '';
    sendMessage(text);
  });
  els.textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const text = els.textInput.value.trim();
      els.textInput.value = '';
      sendMessage(text);
    }
  });

  // ============ 音声入力 ============
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null;
  if (SpeechRecognitionCtor) {
    recognizer = new SpeechRecognitionCtor();
    recognizer.lang = 'ja-JP';
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;
  }

  let listening = false;

  els.micBtn.addEventListener('click', () => {
    if (!apiKey) { els.settingsBtn.click(); return; }
    if (!recognizer) {
      els.topStatus.textContent = 'この端末は音声入力に対応していません';
      return;
    }
    if (listening) return;
    listening = true;
    setAvatarState('listening');
    els.topStatus.textContent = '聞いています...';
    try {
      recognizer.start();
    } catch (e) {
      listening = false;
      setAvatarState('normal');
    }
  });

  if (recognizer) {
    recognizer.addEventListener('result', (event) => {
      const transcript = event.results[0][0].transcript;
      sendMessage(transcript);
    });
    recognizer.addEventListener('end', () => {
      listening = false;
    });
    recognizer.addEventListener('error', () => {
      listening = false;
      setAvatarState('normal');
      els.topStatus.textContent = '聞き取れませんでした';
      setTimeout(() => { els.topStatus.textContent = '短押しで質問 / テキスト入力もできます'; }, 1500);
    });
  }

})();
</script>

</body>
</html>
