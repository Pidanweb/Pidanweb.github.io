<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YUI Book Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d12;
    --panel: #12161d;
    --panel-edge: #1d2430;
    --ink: #eef1f6;
    --ink-dim: #8993a6;
    --scan: #5ee6c9;
    --scan-soft: rgba(94, 230, 201, 0.18);
    --warn: #f0a35e;
    --danger: #f0685e;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    position: relative;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
  }

  /* ---------- カメラビューファインダー ---------- */

  #camera_layer {
    position: absolute;
    inset: 0;
    background: #000;
  }

  #camera_feed {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #captured_preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    filter: saturate(0.85) brightness(0.75);
  }

  /* スキャン枠(シグネチャー要素) */
  #scan_frame {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .corner {
    position: absolute;
    width: 34px;
    height: 34px;
    border: 3px solid var(--scan);
    opacity: 0.85;
    transition: opacity 0.3s ease, border-color 0.3s ease;
  }
  .corner.tl { top: 14%; left: 8%; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
  .corner.tr { top: 14%; right: 8%; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
  .corner.bl { bottom: 26%; left: 8%; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
  .corner.br { bottom: 26%; right: 8%; border-left: none; border-top: none; border-radius: 0 0 8px 0; }

  #scan_line {
    position: absolute;
    left: 10%;
    right: 10%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--scan), transparent);
    top: 14%;
    opacity: 0;
  }

  #scan_frame.scanning .scan-line-anim {
    animation: scanmove 1.6s ease-in-out infinite;
  }

  @keyframes scanmove {
    0%   { top: 14%; opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { top: 72%; opacity: 0; }
  }

  #scan_frame.scanning .corner {
    border-color: #fff;
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  #hint_text {
    position: absolute;
    top: 8%;
    left: 0;
    right: 0;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
    letter-spacing: 0.05em;
    padding: 0 20px;
  }

  /* ---------- 上部バー ---------- */

  #top_bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: max(16px, env(safe-area-inset-top)) 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
    z-index: 5;
  }

  #brand {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--scan);
  }

  #settings_btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    color: var(--ink-dim);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 12px;
    font-family: inherit;
  }

  /* ---------- 下部コントロール ---------- */

  #bottom_bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 0 0 max(30px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    z-index: 5;
  }

  #capture_btn {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: transparent;
    border: 4px solid var(--ink);
    position: relative;
  }

  #capture_btn::after {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: var(--ink);
    transition: transform 0.15s ease, background 0.15s ease;
  }

  #capture_btn:active::after {
    transform: scale(0.85);
    background: var(--scan);
  }

  #capture_btn:disabled {
    opacity: 0.35;
  }

  /* ---------- 結果パネル ---------- */

  #result_panel {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 68%;
    background: var(--panel);
    border-top: 1px solid var(--panel-edge);
    border-radius: 22px 22px 0 0;
    padding: 20px 22px max(24px, env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 10;
    overflow-y: auto;
  }

  #result_panel.open {
    transform: translateY(0);
  }

  #panel_grip {
    width: 40px;
    height: 4px;
    background: var(--panel-edge);
    border-radius: 4px;
    margin: 0 auto 16px;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--scan);
    font-weight: 700;
    margin-bottom: 6px;
  }

  #result_title {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 700;
    font-size: 19px;
    line-height: 1.5;
    margin: 0 0 4px;
    white-space: pre-line;
  }

  #result_narration {
    color: var(--ink-dim);
    font-size: 14.5px;
    line-height: 1.9;
    margin: 16px 0 20px;
  }

  .panel_controls {
    display: flex;
    gap: 10px;
  }

  .panel_controls button {
    flex: 1;
    padding: 13px 0;
    border-radius: 14px;
    border: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
  }

  #replay_btn {
    background: var(--scan-soft);
    color: var(--scan);
  }

  #rescan_btn {
    background: rgba(255,255,255,0.08);
    color: var(--ink);
  }

  /* ---------- 会話(チャット)エリア ---------- */

  #chat_log {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .chat_msg {
    max-width: 86%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.7;
  }

  .chat_msg.user {
    align-self: flex-end;
    background: var(--scan-soft);
    color: var(--ink);
    border-bottom-right-radius: 4px;
  }

  .chat_msg.assistant {
    align-self: flex-start;
    background: rgba(255,255,255,0.06);
    color: var(--ink-dim);
    border-bottom-left-radius: 4px;
  }

  #chat_controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--panel-edge);
  }

  #mic_btn {
    flex-shrink: 0;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    background: var(--scan);
    color: #06231d;
    font-size: 20px;
    position: relative;
  }

  #mic_btn.listening {
    background: var(--danger);
    color: #2a0906;
    animation: micpulse 1s ease-in-out infinite;
  }

  @keyframes micpulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(240,104,94,0.5); }
    50% { box-shadow: 0 0 0 10px rgba(240,104,94,0); }
  }

  #chat_status {
    font-size: 13px;
    color: var(--ink-dim);
  }

  /* ---------- ステータス表示 ---------- */

  #status_layer {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    background: rgba(10,13,18,0.6);
    z-index: 8;
  }

  #status_layer.active { display: flex; }

  .spinner {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid rgba(94,230,201,0.25);
    border-top-color: var(--scan);
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #status_text {
    color: var(--ink-dim);
    font-size: 13px;
  }

  /* ---------- 起動前オーバーレイ / エラー ---------- */

  #start_layer, #error_layer {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 40px;
    text-align: center;
    background: var(--bg);
    z-index: 20;
  }

  #error_layer { display: none; }

  .layer_title {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 800;
    font-size: 22px;
  }

  .layer_desc {
    color: var(--ink-dim);
    font-size: 14px;
    line-height: 1.8;
  }

  .primary_btn {
    background: var(--scan);
    color: #06231d;
    border: none;
    padding: 14px 30px;
    border-radius: 14px;
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
  }

  #error_layer .primary_btn {
    background: rgba(255,255,255,0.1);
    color: var(--ink);
  }

  /* ---------- API キー設定パネル ---------- */

  #key_panel {
    position: absolute;
    inset: 0;
    background: var(--bg);
    z-index: 30;
    display: none;
    flex-direction: column;
    padding: max(24px, env(safe-area-inset-top)) 24px 24px;
  }

  #key_panel.active { display: flex; }

  #key_panel textarea {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    border-radius: 12px;
    padding: 14px;
    font-size: 14px;
    font-family: monospace;
    resize: none;
    height: 90px;
    margin: 16px 0;
  }

  #key_panel label {
    font-size: 13px;
    color: var(--ink-dim);
    line-height: 1.7;
  }

  #key_panel .row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  #key_panel .row button {
    flex: 1;
    padding: 13px 0;
    border-radius: 14px;
    border: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
  }

  #key_save { background: var(--scan); color: #06231d; }
  #key_close { background: rgba(255,255,255,0.08); color: var(--ink); }
</style>
</head>
<body>

<div id="app">

  <div id="camera_layer">
    <video id="camera_feed" autoplay playsinline muted></video>
    <img id="captured_preview" alt="撮影した画像">
  </div>

  <div id="scan_frame">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div id="scan_line" class="scan-line-anim"></div>
  </div>

  <div id="hint_text">本の表紙を枠の中に収めてください</div>

  <div id="top_bar">
    <div id="brand">YUI SCANNER</div>
    <button id="settings_btn">APIキー設定</button>
  </div>

  <div id="bottom_bar">
    <button id="capture_btn" aria-label="撮影"></button>
  </div>

  <div id="status_layer">
    <div class="spinner"></div>
    <div id="status_text">解析中...</div>
  </div>

  <div id="result_panel">
    <div id="panel_grip"></div>
    <div class="eyebrow">判定結果</div>
    <div id="result_title">-</div>
    <div id="result_narration"></div>
    <div class="panel_controls">
      <button id="replay_btn">🔊 もう一度読み上げる</button>
      <button id="rescan_btn">再スキャン</button>
    </div>

    <div id="chat_log"></div>

    <div id="chat_controls">
      <button id="mic_btn" aria-label="話しかける">🎤</button>
      <div id="chat_status">マイクを押して質問してみてください</div>
    </div>
  </div>

  <div id="start_layer">
    <div class="layer_title">YUI SCANNER</div>
    <div class="layer_desc">カメラで本の表紙を映すと、<br>タイトルを判定して解説を読み上げます。</div>
    <button id="start_btn" class="primary_btn">カメラを起動する</button>
  </div>

  <div id="error_layer">
    <div class="layer_title">うまく起動できませんでした</div>
    <div class="layer_desc" id="error_desc"></div>
    <button id="error_retry_btn" class="primary_btn">もう一度試す</button>
  </div>

  <div id="key_panel">
    <div class="layer_title">Gemini APIキー</div>
    <label>
      Google AI Studioで発行したAPIキーを貼り付けてください。<br>
      このキーは自分のスマホ内(このページを開いている間だけ)に保持され、どこにも送信されません。
    </label>
    <textarea id="key_input" placeholder="AQ.xxxxxxxxxxxxxxxxxxxxxxxx"></textarea>
    <div class="row">
      <button id="key_close">閉じる</button>
      <button id="key_save">保存する</button>
    </div>
  </div>

</div>

<script>
(() => {
  // ============ 状態 ============
  let apiKey = "";           // このセッション中だけメモリ上に保持(ページを閉じると消える)
  let stream = null;
  let capturedBase64 = null;
  const MODEL = "gemini-3.6-flash";

  // ============ 要素参照 ============
  const els = {
    startLayer: document.getElementById('start_layer'),
    startBtn: document.getElementById('start_btn'),
    errorLayer: document.getElementById('error_layer'),
    errorDesc: document.getElementById('error_desc'),
    errorRetryBtn: document.getElementById('error_retry_btn'),
    cameraFeed: document.getElementById('camera_feed'),
    capturedPreview: document.getElementById('captured_preview'),
    scanFrame: document.getElementById('scan_frame'),
    hintText: document.getElementById('hint_text'),
    captureBtn: document.getElementById('capture_btn'),
    statusLayer: document.getElementById('status_layer'),
    statusText: document.getElementById('status_text'),
    resultPanel: document.getElementById('result_panel'),
    resultTitle: document.getElementById('result_title'),
    resultNarration: document.getElementById('result_narration'),
    replayBtn: document.getElementById('replay_btn'),
    rescanBtn: document.getElementById('rescan_btn'),
    settingsBtn: document.getElementById('settings_btn'),
    keyPanel: document.getElementById('key_panel'),
    keyInput: document.getElementById('key_input'),
    keySave: document.getElementById('key_save'),
    keyClose: document.getElementById('key_close'),
    chatLog: document.getElementById('chat_log'),
    micBtn: document.getElementById('mic_btn'),
    chatStatus: document.getElementById('chat_status'),
  };

  let lastNarration = "";
  let conversationHistory = []; // Gemini に毎回送る会話履歴 [{role, parts}]

  // ============ カメラ起動 ============
  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false,
      });
      els.cameraFeed.srcObject = stream;
      els.startLayer.style.display = 'none';
      els.errorLayer.style.display = 'none';
      els.scanFrame.classList.add('scanning');
    } catch (err) {
      els.startLayer.style.display = 'none';
      els.errorLayer.style.display = 'flex';
      if (err.name === 'NotAllowedError') {
        els.errorDesc.textContent = 'カメラへのアクセスが許可されていません。ブラウザの設定からカメラ権限を許可してください。';
      } else {
        els.errorDesc.textContent = 'カメラを起動できませんでした: ' + err.message;
      }
    }
  }

  els.startBtn.addEventListener('click', startCamera);
  els.errorRetryBtn.addEventListener('click', startCamera);

  // ============ APIキー設定 ============
  els.settingsBtn.addEventListener('click', () => {
    els.keyInput.value = apiKey;
    els.keyPanel.classList.add('active');
  });
  els.keyClose.addEventListener('click', () => {
    els.keyPanel.classList.remove('active');
  });
  els.keySave.addEventListener('click', () => {
    apiKey = els.keyInput.value.trim();
    els.keyPanel.classList.remove('active');
  });

  // ============ 撮影 ============
  els.captureBtn.addEventListener('click', async () => {
    if (!apiKey) {
      els.settingsBtn.click();
      return;
    }

    const video = els.cameraFeed;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);

    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
    capturedBase64 = dataUrl.split(',')[1];

    els.capturedPreview.src = dataUrl;
    els.capturedPreview.style.display = 'block';
    els.cameraFeed.style.display = 'none';
    els.scanFrame.classList.remove('scanning');
    els.hintText.style.display = 'none';
    els.captureBtn.disabled = true;

    await runRecognition(capturedBase64);
    els.captureBtn.disabled = false;
  });

  // ============ Gemini API 呼び出し(会話履歴つき) ============
  async function callGemini(contents) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents }),
    });
    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      throw new Error(errBody?.error?.message || `APIエラー (${res.status})`);
    }
    const data = await res.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text ?? "";
  }

  function setStatus(text) {
    els.statusText.textContent = text;
    els.statusLayer.classList.add('active');
  }
  function hideStatus() {
    els.statusLayer.classList.remove('active');
  }

  async function runRecognition(base64Image) {
    try {
      setStatus('本のタイトルを判定中...');

      const prompt =
        "この画像は本または漫画の表紙です。タイトル・作者名・巻数(わかれば)を判定してください。" +
        "続けて、その本を音声で紹介する短いナレーション文(3〜4文、話し言葉、記号や箇条書きなしの自然な文章)も作ってください。" +
        "出力は必ず次の形式に従ってください(前置きや説明は不要):\n" +
        "TITLE: (タイトル・作者・巻数を1〜2行で)\n" +
        "NARRATION: (ナレーション文)";

      const userParts = [
        { inline_data: { mime_type: "image/jpeg", data: base64Image } },
        { text: prompt },
      ];

      const text = await callGemini([{ role: 'user', parts: userParts }]);

      // この本についての会話履歴として、画像判定のやり取りを積んでおく
      conversationHistory = [
        { role: 'user', parts: userParts },
        { role: 'model', parts: [{ text }] },
      ];

      const titleMatch = text.match(/TITLE:\s*([\s\S]*?)\nNARRATION:/);
      const narrationMatch = text.match(/NARRATION:\s*([\s\S]*)/);

      const title = titleMatch ? titleMatch[1].trim() : "判定できませんでした";
      const narration = narrationMatch ? narrationMatch[1].trim() : text.trim();

      els.resultTitle.textContent = title;
      els.resultNarration.textContent = narration;
      lastNarration = narration;

      hideStatus();
      els.resultPanel.classList.add('open');
      speak(narration);

    } catch (err) {
      hideStatus();
      els.resultTitle.textContent = "エラーが発生しました";
      els.resultNarration.textContent = err.message;
      els.resultPanel.classList.add('open');
    }
  }

  // ============ 読み上げ ============
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ja-JP';
    utterance.rate = 1.15;
    window.speechSynthesis.speak(utterance);
  }

  els.replayBtn.addEventListener('click', () => speak(lastNarration));

  // ============ 再スキャン ============
  els.rescanBtn.addEventListener('click', () => {
    window.speechSynthesis.cancel();
    els.resultPanel.classList.remove('open');
    els.capturedPreview.style.display = 'none';
    els.cameraFeed.style.display = 'block';
    els.hintText.style.display = 'block';
    els.scanFrame.classList.add('scanning');
    conversationHistory = [];
    els.chatLog.innerHTML = '';
    els.chatStatus.textContent = 'マイクを押して質問してみてください';
  });

  // ============ 音声での会話 ============
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null;
  if (SpeechRecognitionCtor) {
    recognizer = new SpeechRecognitionCtor();
    recognizer.lang = 'ja-JP';
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;
  }

  function addChatMessage(role, text) {
    const bubble = document.createElement('div');
    bubble.className = `chat_msg ${role === 'user' ? 'user' : 'assistant'}`;
    bubble.textContent = text;
    els.chatLog.appendChild(bubble);
    els.chatLog.scrollTop = els.chatLog.scrollHeight;
  }

  async function askFollowUp(questionText) {
    conversationHistory.push({ role: 'user', parts: [{ text: questionText }] });
    addChatMessage('user', questionText);
    els.chatStatus.textContent = '考え中...';

    try {
      const answer = await callGemini(conversationHistory);
      conversationHistory.push({ role: 'model', parts: [{ text: answer }] });
      addChatMessage('assistant', answer);
      speak(answer);
      els.chatStatus.textContent = 'マイクを押して質問してみてください';
    } catch (err) {
      addChatMessage('assistant', 'エラー: ' + err.message);
      els.chatStatus.textContent = 'マイクを押して質問してみてください';
    }
  }

  els.micBtn.addEventListener('click', () => {
    if (!apiKey) {
      els.settingsBtn.click();
      return;
    }
    if (!recognizer) {
      els.chatStatus.textContent = 'この端末は音声入力に対応していません';
      return;
    }
    window.speechSynthesis.cancel();
    els.micBtn.classList.add('listening');
    els.chatStatus.textContent = '聞いています...';
    recognizer.start();
  });

  if (recognizer) {
    recognizer.addEventListener('result', (event) => {
      const question = event.results[0][0].transcript;
      askFollowUp(question);
    });
    recognizer.addEventListener('end', () => {
      els.micBtn.classList.remove('listening');
    });
    recognizer.addEventListener('error', (event) => {
      els.micBtn.classList.remove('listening');
      els.chatStatus.textContent = '聞き取れませんでした。もう一度試してください';
    });
  }

})();
</script>

</body>
</html>
