<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モノバケ - 相棒育成＆カメラスキャンRPG</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0c1b;
      color: #F3F1E7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .main-container {
      width: 100%;
      max-width: 420px;
      background: #12142B;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
      position: relative;
    }
    .nav-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px 4px; border: none; background: #1B1E3D; color: #9A9CC0; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }
    .tab-btn.active { background: #23E0C4; color: #08221E; }
    .card { background: #1F2347; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1); }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .btn-action { width: 100%; padding: 12px; background: #23E0C4; color: #08221E; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; }
    .btn-action:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; text-align: center; }
    .stat-box { background: #12142B; padding: 6px; border-radius: 6px; }
    .stat-box .lbl { font-size: 10px; color: #9A9CC0; }
    .stat-box .val { font-size: 13px; font-weight: bold; }
    .api-key-input { width: 100%; padding: 8px; margin-top: 6px; border-radius: 6px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; }

    /* バトル用レイアウト */
    .battle-stage { position: relative; background: radial-gradient(circle, #1c2050 0%, #0d0f24 100%); border-radius: 12px; padding: 12px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 12px; }
    .status-box { background: rgba(18, 20, 43, 0.85); border-radius: 8px; padding: 8px 10px; border: 1px solid rgba(255,255,255,0.15); }
    .hp-bar-outer { background: #000; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 4px; border: 1px solid #333; }
    .hp-bar-inner { height: 100%; transition: width 0.3s ease; }
    .battle-log { background: #000; border-radius: 8px; padding: 10px; font-size: 12px; height: 80px; overflow-y: auto; line-height: 1.4; color: #23E0C4; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 12px; }
    .move-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .move-btn { background: #1F2347; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px; color: #fff; text-align: left; cursor: pointer; }
    .pp-badge { background: #F2B84B; color: #000; font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  const { useState, useRef } = React;

  const TYPE_CHART = {
    火: { strong: "風", weak: "水", color: "#FF6B4A" },
    水: { strong: "火", weak: "風", color: "#3EC6E0" },
    風: { strong: "水", weak: "火", color: "#7ED957" },
  };

  const RARITY_BASE = {
    C: { hp: 35, atk: 8, def: 6, spd: 10 },
    B: { hp: 45, atk: 11, def: 8, spd: 12 },
    A: { hp: 58, atk: 15, def: 11, spd: 14 },
    S: { hp: 72, atk: 19, def: 14, spd: 16 },
  };

  function hashStr(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h;
  }

  function buildStats(rarity, name) {
    const base = RARITY_BASE[rarity] || RARITY_BASE.C;
    const h = hashStr(name || "monster");
    const variance = (shift) => 1 + (((h >> shift) % 21) - 10) / 100;
    return {
      hp: Math.round(base.hp * variance(0)),
      atk: Math.round(base.atk * variance(3)),
      def: Math.round(base.def * variance(6)),
      spd: Math.round(base.spd * variance(9)),
    };
  }

  const STORAGE_KEY = "monobake_save_full_v1";
  function loadLocalData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return JSON.parse(saved);
    return {
      apiKey: "",
      partner: {
        name: "ナビモン", attribute: "風", level: 1, exp: 0,
        stats: { hp: 55, atk: 13, def: 8, spd: 12 },
        moves: {
          normal: { cost: 1, name: "体当たり", flavor: "全力でぶつかる" },
          strong: { cost: 3, name: "疾風連撃", flavor: "風を纏った大技" },
          utility: { cost: 2, name: "応急手当", flavor: "HPを少し回復する" },
        },
      },
      zukan: [],
    };
  }

  function saveLocalData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

  function resizeImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const max = 400;
          let w = img.width, h = img.height;
          if (w > h) { if (w > max) { h = Math.round(h * (max / w)); w = max; } }
          else { if (h > max) { w = Math.round(w * (max / h)); h = max; } }
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function analyzeImageWithGemini(dataUrl, apiKey) {
    const base64Data = dataUrl.split(",")[1];
    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

    const requestBody = {
      contents: [{
        parts: [
          { text: "画像の中心的物体を1つ選び、RPGの敵モンスターとして設定してください。" },
          { inlineData: { mimeType: "image/jpeg", data: base64Data } }
        ]
      }],
      generationConfig: {
        responseMimeType: "application/json",
        responseSchema: {
          type: "OBJECT",
          properties: {
            name: { type: "STRING", description: "物体の特徴を活かした日本語モンスター名(12文字以内)" },
            attribute: { type: "STRING", enum: ["火", "水", "風"] },
            rarity: { type: "STRING", enum: ["C", "B", "A", "S"] },
            description: { type: "STRING", description: "特徴を表す一言(30文字以内)" },
            moves: {
              type: "OBJECT",
              properties: {
                normal: { type: "OBJECT", properties: { cost: { type: "INTEGER" }, name: { type: "STRING" }, flavor: { type: "STRING" } }, required: ["cost", "name", "flavor"] },
                strong: { type: "OBJECT", properties: { cost: { type: "INTEGER" }, name: { type: "STRING" }, flavor: { type: "STRING" } }, required: ["cost", "name", "flavor"] },
                utility: { type: "OBJECT", properties: { cost: { type: "INTEGER" }, name: { type: "STRING" }, flavor: { type: "STRING" } }, required: ["cost", "name", "flavor"] }
              },
              required: ["normal", "strong", "utility"]
            }
          },
          required: ["name", "attribute", "rarity", "description", "moves"]
        }
      }
    };

    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(requestBody)
    });

    if (!res.ok) {
      const errJson = await res.json().catch(() => ({}));
      throw new Error(errJson.error?.message || "APIキーが無効または通信エラーです");
    }

    const resData = await res.json();
    const rawText = resData.candidates?.[0]?.content?.parts?.[0]?.text;
    const json = JSON.parse(rawText);
    json.stats = buildStats(json.rarity, json.name);
    return json;
  }

  function calcDamage(attacker, defender, moveMult) {
    let typeMult = 1.0;
    const chart = TYPE_CHART[attacker.attribute];
    if (chart.strong === defender.attribute) typeMult = 1.5;
    if (chart.weak === defender.attribute) typeMult = 0.5;

    const rand = 0.9 + Math.random() * 0.2;
    const rawDmg = (attacker.stats.atk * moveMult * typeMult * rand) - (defender.stats.def * 0.4);
    return { dmg: Math.max(1, Math.round(rawDmg)), typeMult };
  }

  // ==========================================
  // バトル画面
  // ==========================================
  function BattleScreen({ partner, enemy, onBattleEnd }) {
    const [pMaxHp] = useState(partner.stats.hp);
    const [pHp, setPHp] = useState(partner.stats.hp);
    const [pCost, setPCost] = useState(3);

    const [eMaxHp] = useState(enemy.stats.hp);
    const [eHp, setEHp] = useState(enemy.stats.hp);

    const [logs, setLogs] = useState([`野生の ${enemy.name} があらわれた！`]);
    const [isBusy, setIsBusy] = useState(false);

    const addLog = (text) => setLogs(prev => [...prev.slice(-15), text]);

    const handlePlayerMove = (moveKey) => {
      if (isBusy) return;
      const pMove = partner.moves[moveKey];
      if (pCost < pMove.cost) return alert("コスト（PP）が足りません！");

      setIsBusy(true);
      setPCost(prev => prev - pMove.cost);

      const pFirst = partner.stats.spd >= enemy.stats.spd;

      if (pFirst) {
        executePlayerAttack(moveKey, () => {
          if (eHp > 0) setTimeout(() => executeEnemyAttack(() => endTurn()), 800);
          else endTurn();
        });
      } else {
        addLog(`⚡ ${enemy.name} のほうが すばやい！`);
        executeEnemyAttack(() => {
          if (pHp > 0) setTimeout(() => executePlayerAttack(moveKey, () => endTurn()), 800);
          else endTurn();
        });
      }
    };

    const executePlayerAttack = (moveKey, callback) => {
      const move = partner.moves[moveKey];
      addLog(`▶ ${partner.name} の ${move.name}！`);

      if (moveKey === "utility") {
        const heal = Math.round(pMaxHp * 0.3);
        setPHp(prev => Math.min(pMaxHp, prev + heal));
        addLog(`  ${partner.name} の HPが ${heal} 回復した！`);
      } else {
        const mult = moveKey === "strong" ? 1.6 : 1.0;
        const { dmg, typeMult } = calcDamage(partner, enemy, mult);
        setEHp(prev => {
          const next = Math.max(0, prev - dmg);
          if (next === 0) addLog(`💥 野生の ${enemy.name} を たおした！`);
          return next;
        });
        let effText = typeMult > 1.0 ? " (こうかは ばつぐんだ！)" : typeMult < 1.0 ? " (いまひとつの ようだ...)" : "";
        addLog(`  ${enemy.name} に ${dmg} のダメージ！${effText}`);
      }
      setTimeout(callback, 600);
    };

    const executeEnemyAttack = (callback) => {
      const eMoveKeys = ["normal", "strong", "utility"];
      const pickedKey = eMoveKeys[Math.floor(Math.random() * eMoveKeys.length)];
      const move = enemy.moves[pickedKey] || enemy.moves.normal;

      addLog(`▶ 野生の ${enemy.name} の ${move.name}！`);
      const mult = pickedKey === "strong" ? 1.5 : 1.0;
      const { dmg, typeMult } = calcDamage(enemy, partner, mult);

      setPHp(prev => {
        const next = Math.max(0, prev - dmg);
        if (next === 0) addLog(`💀 ${partner.name} は たおれてしまった...`);
        return next;
      });
      let effText = typeMult > 1.0 ? " (こうかは ばつぐんだ！)" : typeMult < 1.0 ? " (いまひとつの ようだ...)" : "";
      addLog(`  ${partner.name} に ${dmg} のダメージ！${effText}`);
      setTimeout(callback, 600);
    };

    const endTurn = () => {
      if (eHp <= 0) setTimeout(() => onBattleEnd(true), 1200);
      else if (pHp <= 0) setTimeout(() => onBattleEnd(false), 1200);
      else {
        setPCost(prev => Math.min(5, prev + 2));
        setIsBusy(false);
      }
    };

    return (
      <div>
        <div className="battle-stage">
          <div style={{ marginBottom: "16px" }}>
            <div className="status-box" style={{ width: "70%" }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: "12px" }}>
                <strong>{enemy.name}</strong>
                <span className="tag" style={{ background: TYPE_CHART[enemy.attribute].color, color: "#000" }}>{enemy.attribute}</span>
              </div>
              <div className="hp-bar-outer">
                <div className="hp-bar-inner" style={{ width: `${(eHp / eMaxHp) * 100}%`, background: "#FF5D73" }} />
              </div>
              <div style={{ fontSize: "10px", textAlign: "right", color: "#9A9CC0", marginTop: "2px" }}>HP: {eHp}/{eMaxHp}</div>
            </div>
            <div style={{ textAlign: "center", margin: "10px 0" }}>
              <img src={enemy.photo} alt={enemy.name} style={{ width: "90px", height: "90px", objectFit: "cover", borderRadius: "50%", border: "3px solid #FF5D73" }} />
            </div>
          </div>

          <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end" }}>
            <div className="status-box" style={{ width: "75%" }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: "12px" }}>
                <strong>{partner.name} <span style={{ color: "#23E0C4" }}>Lv.{partner.level}</span></strong>
                <span className="tag" style={{ background: TYPE_CHART[partner.attribute].color, color: "#000" }}>{partner.attribute}</span>
              </div>
              <div className="hp-bar-outer">
                <div className="hp-bar-inner" style={{ width: `${(pHp / pMaxHp) * 100}%`, background: "#23E0C4" }} />
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: "10px", color: "#9A9CC0", marginTop: "2px" }}>
                <span>PP: <strong style={{ color: "#F2B84B" }}>{"★".repeat(pCost)}</strong></span>
                <span>HP: {pHp}/{pMaxHp}</span>
              </div>
            </div>
          </div>
        </div>

        <div className="battle-log">
          {logs.map((l, i) => <div key={i}>{l}</div>)}
        </div>

        <div className="move-grid">
          {Object.keys(partner.moves).map(k => {
            const m = partner.moves[k];
            return (
              <button
                key={k}
                className="move-btn"
                disabled={isBusy || pCost < m.cost}
                onClick={() => handlePlayerMove(k)}
              >
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "2px" }}>
                  <strong style={{ fontSize: "12px" }}>{m.name}</strong>
                  <span className="pp-badge">コスト{m.cost}</span>
                </div>
                <div style={{ fontSize: "10px", color: "#9A9CC0" }}>{m.flavor}</div>
              </button>
            );
          })}
        </div>
      </div>
    );
  }

  // ==========================================
  // メインApp
  // ==========================================
  function App() {
    const [gameData, setGameData] = useState(loadLocalData);
    const [tab, setTab] = useState("scan"); // デフォルトをスキャンに設定
    const [loading, setLoading] = useState(false);
    const [previewEnemy, setPreviewEnemy] = useState(null);
    const [activeBattleEnemy, setActiveBattleEnemy] = useState(null);
    const fileInputRef = useRef(null);

    const handleApiKeyChange = (e) => {
      const key = e.target.value;
      const updated = { ...gameData, apiKey: key };
      setGameData(updated);
      saveLocalData(updated);
    };

    const handleFileChange = async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      if (!gameData.apiKey) return alert("Gemini APIキーを設定してください");

      setLoading(true);
      try {
        const dataUrl = await resizeImage(file);
        const enemyJson = await analyzeImageWithGemini(dataUrl, gameData.apiKey);
        
        const newEnemy = {
          ...enemyJson,
          id: `enemy_${Date.now()}`,
          photo: dataUrl,
          createdAt: new Date().toLocaleDateString()
        };

        setPreviewEnemy(newEnemy);

        // 図鑑に自動で登録保存
        const updatedZukan = [newEnemy, ...gameData.zukan.filter(z => z.name !== newEnemy.name)];
        const updatedData = { ...gameData, zukan: updatedZukan };
        setGameData(updatedData);
        saveLocalData(updatedData);

      } catch (err) {
        alert("エラー: " + err.message);
      } finally {
        setLoading(false);
        e.target.value = "";
      }
    };

    const startBattle = (enemy) => {
      setActiveBattleEnemy(enemy);
      setTab("battle");
    };

    const handleBattleEnd = (won) => {
      if (won) {
        const nextExp = gameData.partner.exp + 50;
        let nextLevel = gameData.partner.level;
        let nextStats = { ...gameData.partner.stats };

        if (nextExp >= 100) {
          nextLevel += 1;
          nextStats.hp += 8;
          nextStats.atk += 3;
          nextStats.def += 2;
          nextStats.spd += 2;
          alert(`🎉 勝利！ ${gameData.partner.name} は Lv.${nextLevel} にレベルアップ！`);
        } else {
          alert(`🎉 勝利！ 経験値を 50 獲得！`);
        }

        const updated = {
          ...gameData,
          partner: { ...gameData.partner, level: nextLevel, exp: nextExp % 100, stats: nextStats }
        };
        setGameData(updated);
        saveLocalData(updated);
      } else {
        alert("💦 負けてしまった... レベルを上げて再挑戦しよう！");
      }
      setPreviewEnemy(null);
      setActiveBattleEnemy(null);
      setTab("scan");
    };

    const partner = gameData.partner;

    return (
      <div className="main-container">
        {/* ナビゲーションタブ */}
        {tab !== "battle" && (
          <div className="nav-tabs">
            <button className={`tab-btn ${tab === "scan" ? "active" : ""}`} onClick={() => setTab("scan")}>📸 スキャン</button>
            <button className={`tab-btn ${tab === "zukan" ? "active" : ""}`} onClick={() => setTab("zukan")}>📖 図鑑 ({gameData.zukan.length})</button>
            <button className={`tab-btn ${tab === "partner" ? "active" : ""}`} onClick={() => setTab("partner")}>🦖 相棒AI</button>
          </div>
        )}

        {/* 1. スキャン画面 */}
        {tab === "scan" && (
          <div>
            <input
              type="file"
              accept="image/*"
              capture="environment"
              ref={fileInputRef}
              style={{ display: "none" }}
              onChange={handleFileChange}
            />

            {!previewEnemy ? (
              <div className="card" style={{ textAlign: "center", padding: "40px 16px" }}>
                <div style={{ fontSize: "48px", marginBottom: "12px" }}>📸</div>
                <h3>身の回りのものをスキャン</h3>
                <p style={{ color: "#9A9CC0", fontSize: "12px", marginBottom: "20px" }}>
                  カメラで撮影するとGeminiが敵モンスターに変換します。
                </p>
                <button className="btn-action" disabled={loading} onClick={() => fileInputRef.current?.click()}>
                  {loading ? "Gemini解析中..." : "📷 カメラを起動して撮影"}
                </button>
              </div>
            ) : (
              <div className="card">
                <h3 style={{ color: "#FF5D73", marginBottom: "8px" }}>⚠️ 敵出現！</h3>
                <img src={previewEnemy.photo} alt={previewEnemy.name} style={{ width: "100%", height: "180px", objectFit: "cover", borderRadius: "8px" }} />
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: "8px" }}>
                  <h4>{previewEnemy.name}</h4>
                  <span className="tag" style={{ background: TYPE_CHART[previewEnemy.attribute].color, color: "#000" }}>{previewEnemy.attribute}</span>
                </div>
                <p style={{ fontSize: "12px", color: "#9A9CC0" }}>{previewEnemy.description}</p>
                
                <div className="stat-grid">
                  <div className="stat-box"><div className="lbl">HP</div><div className="val">{previewEnemy.stats.hp}</div></div>
                  <div className="stat-box"><div className="lbl">攻撃</div><div className="val">{previewEnemy.stats.atk}</div></div>
                  <div className="stat-box"><div className="lbl">防御</div><div className="val">{previewEnemy.stats.def}</div></div>
                  <div className="stat-box"><div className="lbl">SPD</div><div className="val">{previewEnemy.stats.spd}</div></div>
                </div>

                <button className="btn-action" style={{ background: "#FF5D73", color: "#fff", marginTop: "8px" }} onClick={() => startBattle(previewEnemy)}>
                  ⚔️ 相棒（Lv.{partner.level}）でバトル開始
                </button>
                <button className="btn-action" style={{ background: "transparent", color: "#9A9CC0", border: "1px solid rgba(255,255,255,0.2)", marginTop: "6px" }} onClick={() => setPreviewEnemy(null)}>
                  撮り直す
                </button>
              </div>
            )}
          </div>
        )}

        {/* 2. 図鑑画面（図鑑から再戦も可能） */}
        {tab === "zukan" && (
          <div>
            {gameData.zukan.length === 0 ? (
              <div className="card" style={{ textAlign: "center", color: "#9A9CC0" }}>まだスキャンした敵がいません。スキャン画面から登録しよう！</div>
            ) : (
              gameData.zukan.map(item => (
                <div key={item.id} className="card" style={{ display: "flex", gap: "12px", alignItems: "center" }}>
                  <img src={item.photo} alt={item.name} style={{ width: "65px", height: "65px", borderRadius: "8px", objectFit: "cover" }} />
                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <strong>{item.name}</strong>
                      <span className="tag" style={{ background: TYPE_CHART[item.attribute]?.color || "#ccc", color: "#000" }}>{item.attribute}</span>
                    </div>
                    <div style={{ fontSize: "11px", color: "#9A9CC0", margin: "4px 0" }}>
                      HP:{item.stats.hp} / ATK:{item.stats.atk} / SPD:{item.stats.spd}
                    </div>
                    <button className="btn-action" style={{ padding: "6px", fontSize: "11px", background: "#1B1E3D", color: "#23E0C4", border: "1px solid #23E0C4" }} onClick={() => startBattle(item)}>
                      ⚔️ この敵と再戦
                    </button>
                  </div>
                </div>
              ))
            )}
          </div>
        )}

        {/* 3. 相棒ステータス＆設定画面 */}
        {tab === "partner" && (
          <div>
            <div className="card">
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <h2>{partner.name}</h2>
                <span className="tag" style={{ background: TYPE_CHART[partner.attribute].color, color: "#000" }}>{partner.attribute}属性</span>
              </div>
              <p style={{ color: "#23E0C4", fontWeight: "bold", margin: "4px 0" }}>Lv. {partner.level} (EXP: {partner.exp}/100)</p>
              
              <div className="stat-grid">
                <div className="stat-box"><div className="lbl">HP</div><div className="val">{partner.stats.hp}</div></div>
                <div className="stat-box"><div className="lbl">攻撃</div><div className="val">{partner.stats.atk}</div></div>
                <div className="stat-box"><div className="lbl">防御</div><div className="val">{partner.stats.def}</div></div>
                <div className="stat-box"><div className="lbl">SPD</div><div className="val">{partner.stats.spd}</div></div>
              </div>
            </div>

            <div className="card" style={{ fontSize: "12px" }}>
              <h4>設定: Gemini APIキー</h4>
              <p style={{ color: "#9A9CC0", margin: "4px 0" }}>Google AI StudioのAPIキー（AIzaSy...）を入力</p>
              <input
                type="password"
                className="api-key-input"
                placeholder="AIzaSy..."
                value={gameData.apiKey}
                onChange={handleApiKeyChange}
              />
            </div>
          </div>
        )}

        {/* 4. バトル画面 */}
        {tab === "battle" && activeBattleEnemy && (
          <BattleScreen partner={partner} enemy={activeBattleEnemy} onBattleEnd={handleBattleEnd} />
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
