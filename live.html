<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRM アバターカラオケライブ</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .bar{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:rgba(0,0,0,.55);z-index:5;align-items:center;font-size:13px}
  button,label.btn{background:#2b2f3a;color:#fff;border:1px solid #555;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
  button:hover,label.btn:hover{background:#3a4050}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible,label.btn:focus-within{outline:2px solid #ff8fd0;outline-offset:2px}
  #rec.on{background:#c0202a;border-color:#ff6b6b}
  input[type=file]{display:none}
  #panel{position:fixed;left:8px;bottom:8px;z-index:5;background:rgba(0,0,0,.55);padding:8px;border-radius:10px;font-size:12px;max-width:340px}
  #video{width:240px;display:block;border-radius:6px;transform:scaleX(-1);background:#000}
  #panel audio{width:240px;margin-top:6px}
  #panel div{margin-top:4px}
  #status{margin-left:auto;opacity:.85}
  select{background:#2b2f3a;color:#fff;border:1px solid #555;border-radius:8px;padding:6px 8px;font-size:13px;max-width:220px}
  .seg{display:inline-flex;gap:2px}
  .seg button.act{background:#4a5bd0;border-color:#8fa0ff}
  #vwrap{position:relative;width:240px}
  #overlay{position:absolute;left:0;top:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}
  #legend{font-size:11px;opacity:.8}
  #dl{display:none;color:#8fd;font-weight:bold}
  input[type=text]{background:#2b2f3a;color:#fff;border:1px solid #555;border-radius:8px;padding:7px 10px;font-size:13px;width:260px}
  #ytbox{margin-top:6px}
  #panel{max-height:calc(100% - 80px);overflow:auto}
  #panel .sec{border-top:1px solid rgba(255,255,255,.12);padding-top:6px;margin-top:8px}
  #panel button.sm{padding:3px 8px}
  #drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:9;font-size:24px}

  /* 変身ポーズのガイド(録画には映らない) */
  #guide{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:6;display:none;
    background:rgba(30,12,52,.8);border:1px solid rgba(255,143,208,.5);border-radius:16px;
    padding:14px 22px 16px;text-align:center;width:min(440px,90vw);box-sizing:border-box;backdrop-filter:blur(6px)}
  #guide.show{display:block}
  #guide svg{width:76px;height:76px;display:block;margin:0 auto 4px}
  #gTitle{font-size:18px;font-weight:700;color:#ffd6ee}
  #gMsg{font-size:14px;margin-top:6px;line-height:1.5;min-height:2.6em}
  .gbar{height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin-top:10px}
  #gProg{height:100%;width:0;background:linear-gradient(90deg,#ff6fb5,#ffd36e)}
  #gSub{font-size:12px;opacity:.75;margin-top:8px}
  #gSkip{margin-top:10px;font-size:12px;padding:5px 10px}
  #count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:140px;font-weight:800;z-index:8;pointer-events:none;color:#fff;text-shadow:0 0 30px #ff6fb5}
  #modePill{position:fixed;right:10px;bottom:10px;z-index:5;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:999px;font-size:13px;border:1px solid rgba(255,255,255,.15)}
  #modePill.pop{animation:pop .6s ease-out}
  @keyframes pop{from{transform:scale(1.25);background:rgba(255,111,181,.85)}}
  @media (prefers-reduced-motion: reduce){#modePill.pop{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="drop">VRMファイルをドロップ</div>
<div id="count"></div>

<div class="bar">
  <label class="btn">① VRM選択<input type="file" id="vrmFile" accept=".vrm"></label>
  <button id="camBtn">② カメラ＆マイク開始</button>
  <select id="camSel" title="カメラ選択"><option value="">既定のカメラ</option></select>
  <select id="micSel" title="マイク選択"><option value="">既定のマイク</option></select>
  <label>負荷 <select id="perfSel" title="重いときは軽量に"><option value="high">高精度</option><option value="std" selected>標準</option><option value="low">軽量</option></select></label>
  <label class="btn">③ 伴奏ファイル<input type="file" id="bgmFile" accept="audio/*"></label>
  <input type="text" id="urlIn" placeholder="伴奏URL (mp3/ogg/mp4の直リンク or YouTube)">
  <button id="urlBtn">URL読込</button>
  <button id="tabAudio" style="display:none" title="YouTubeの音をマイクと一緒に録画へ入れます(Chrome/Edge)">🔊 YouTube音声を録画に入れる</button>
  <button id="recal" disabled title="キャリブレーションからやり直します">✨ 変身し直す</button>
  <button id="rec" disabled>● 録画開始</button>
  <a id="dl" href="#">⬇ 録画を保存</a>
  <label title="オンにすると鏡のように映ります"><input type="checkbox" id="mirror" checked> 左右反転(鏡)</label>
  <span class="seg" title="トラッキング範囲"><button id="modeAuto" class="act">オート</button><button id="modeUpper">上半身</button><button id="modeFull">全身</button></span>
  <label><input type="checkbox" id="showBones" checked> カメラ映像にボーン</label>
  <label><input type="checkbox" id="showAvBones"> アバターのボーン</label>
  <label><input type="checkbox" id="handTrack" checked> ハンドトラッキング</label>
  <span id="status">VRMを読み込んでください</span>
</div>

<div id="guide" role="status" aria-live="polite">
  <svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="#ff9fd2" stroke-width="6" stroke-linecap="round" fill="none"><circle cx="50" cy="19" r="9"/><path d="M50 30v32M12 37h76M50 62l-11 28M50 62l11 28"/></g></svg>
  <div id="gTitle">変身ポーズでキャリブレーション</div>
  <div id="gMsg">カメラの前で両腕を真横に広げてください</div>
  <div class="gbar"><div id="gProg"></div></div>
  <div id="gSub">全身が映る位置だと、体の大きさをより正確に測れます</div>
  <button id="gSkip">ポーズなしで変身</button>
</div>

<div id="modePill">オート: 全身</div>

<div id="panel">
  <div id="vwrap"><video id="video" playsinline muted></video><canvas id="overlay"></canvas></div>
  <div id="legend">ボーンの色: 緑=信頼高 / 黄=中 / 赤=低 / 水色=手</div>
  <div id="ytbox" style="display:none"><div id="ytplayer"></div></div>
  <audio id="bgm" controls></audio>
  <audio id="bgmPlain" controls style="display:none"></audio>
  <div>伴奏音量 <input type="range" id="bgmVol" min="0" max="1" step="0.01" value="0.7"></div>
  <div>マイク音量 <input type="range" id="micVol" min="0" max="2" step="0.01" value="1"></div>
  <div>🎤 <span id="micInfo">未接続</span> <button id="micBtn" class="sm">マイク接続</button></div>
  <div style="height:6px;background:#333;border-radius:3px;overflow:hidden;margin-top:3px"><div id="micLvl" style="height:100%;width:0;background:#4f8"></div></div>
  <div><label><input type="checkbox" id="monitor"> マイクを自分で聞く(イヤホン必須)</label></div>
  <div class="sec">重ね方 <select id="ovMode" title="生身の自分をどう扱うか">
    <option value="avatar" selected>アバターになる(全身を隠す)</option>
    <option value="costume">衣装だけ着る(顔は自分のまま)</option>
    <option value="none">重ねるだけ(隠さない)</option></select></div>
  <div>アバターの大きさ <input type="range" id="avSize" min="0.9" max="1.4" step="0.01" value="1.1"> <span id="avSizeV">×1.10</span></div>
  <div><button id="plateBtn" class="sm" title="背景は自動で覚えますが、3秒後に画面の外へ出て撮るとすぐ完全になります">📷 背景を撮り直す</button> <button id="plateClr" class="sm">背景を消す</button></div>
  <div><label><input type="checkbox" id="autoBgm" checked> 変身したら伴奏を最初から再生</label></div>
  <div><label><input type="checkbox" id="autoRec" checked> 変身シーンから自動で録画</label></div>
  <div id="calInfo">体格: 未測定</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.0/lib/three-vrm.module.min.js"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { PoseLandmarker, FaceLandmarker, HandLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const $ = id => document.getElementById(id);
const statusEl = $('status');
const say = t => statusEl.textContent = t;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const video = $('video');

/* ---------- three.js ---------- */
// 方式: Webカメラ映像を画面いっぱいに描き、その上の「人の位置・大きさ」にアバターを重ねる(AR合成)。
// 3Dカメラは原点から -z を向いて固定 = Webカメラの位置。アバターを奥行き方向に動かして大きさを合わせる。
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.autoClear = false;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.03, 60);
const CAM_HFOV = 62 * Math.PI / 180;   // 一般的なWebカメラの水平画角(だいたいでOK)
scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const dl = new THREE.DirectionalLight(0xffffff, 2.2); dl.position.set(1, 2, 3); scene.add(dl);

// 背景: カメラ映像(+人物マスクで本人を隠す/変身中に光らせる)
const vidTex = new THREE.VideoTexture(video);
vidTex.minFilter = vidTex.magFilter = THREE.LinearFilter; vidTex.generateMipmaps = false;
let maskTex = new THREE.DataTexture(new Uint8Array(1), 1, 1, THREE.RedFormat);
maskTex.unpackAlignment = 1; maskTex.needsUpdate = true;
const blankTex = new THREE.DataTexture(new Uint8Array(4), 1, 1); blankTex.needsUpdate = true;
const U = {
  uVideo: { value: vidTex }, uMask: { value: maskTex }, uPlate: { value: blankTex },
  uCrop: { value: new THREE.Vector2(1, 1) }, uMirror: { value: 1 }, uHasVideo: { value: 0 },
  uHide: { value: 0 }, uGlow: { value: 0 }, uHasPlate: { value: 0 }, uTime: { value: 0 },
  uLearn: { value: blankTex }, uHasLearn: { value: 0 }, uFace: { value: new THREE.Vector4(0.5, 0.8, 0.1, 0.1) }, uFaceOn: { value: 0 }
};
const bgMat = new THREE.ShaderMaterial({
  uniforms: U, depthTest: false, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.99, 1.0); }`,
  fragmentShader: `
    uniform sampler2D uVideo, uMask, uPlate, uLearn;
    uniform vec2 uCrop; uniform float uMirror, uHasVideo, uHide, uGlow, uHasPlate, uTime, uHasLearn, uFaceOn;
    uniform vec4 uFace;
    varying vec2 vUv;
    float maskAt(vec2 uv){ return texture2D(uMask, vec2(uv.x, 1.0 - uv.y)).r; }
    void main(){
      vec3 bg = mix(vec3(0.05, 0.03, 0.10), vec3(0.17, 0.08, 0.26), vUv.y);
      if (uHasVideo < 0.5) { gl_FragColor = vec4(bg, 1.0); return; }
      vec2 uv = vec2(0.5 + (vUv.x - 0.5) * uCrop.x, 0.5 + (vUv.y - 0.5) * uCrop.y);
      if (uMirror > 0.5) uv.x = 1.0 - uv.x;
      vec3 col = texture2D(uVideo, uv).rgb;
      float m = 0.0;
      if (uHide + uGlow > 0.001) {   // マスクを少し太らせて輪郭のはみ出しを抑える
        vec2 o = vec2(0.012, 0.016);
        m = max(maskAt(uv), max(max(maskAt(uv + vec2(o.x, 0.0)), maskAt(uv - vec2(o.x, 0.0))),
                                max(maskAt(uv + vec2(0.0, o.y)), maskAt(uv - vec2(0.0, o.y)))));
        m = smoothstep(0.2, 0.7, m);
      }
      if (uHide > 0.001) {
        vec3 hid;
        if (uHasPlate > 0.5) hid = texture2D(uPlate, uv).rgb;   // 撮影した無人の背景で埋める
        else {
          // 自動で覚えた背景(人がいなかった瞬間の画素)。まだ一度も見えていない所だけ、ぼかした暗い影にする
          vec3 b = vec3(0.0); vec2 r = vec2(0.02, 0.027);
          for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++) b += texture2D(uVideo, uv + vec2(float(i), float(j)) * r).rgb;
          b /= 9.0;
          float l = dot(b, vec3(0.299, 0.587, 0.114));
          vec3 shadow = mix(vec3(l), b, 0.35) * 0.35 + vec3(0.06, 0.02, 0.10);
          vec4 lp = texture2D(uLearn, uv);
          hid = mix(shadow, lp.rgb, uHasLearn * lp.a);
        }
        float h = m * uHide;
        if (uFaceOn > 0.5) { vec2 q = (vUv - uFace.xy) / uFace.zw; h *= smoothstep(0.75, 1.15, length(q)); }   // 衣装モード: 顔は本人のまま
        col = mix(col, hid, h);
      }
      float sh = 0.5 + 0.5 * sin(uTime * 9.0 + vUv.y * 30.0);
      col += m * uGlow * mix(vec3(1.0, 0.55, 0.85), vec3(1.0, 0.95, 0.8), sh) * 1.2;
      gl_FragColor = vec4(col, 1.0);
    }`
});
const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
bgQuad.frustumCulled = false; bgQuad.renderOrder = -1000; scene.add(bgQuad);

/* ---------- 演出用: パーティクル / 魔法陣 / フラッシュ / タイトル ---------- */
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function makeNoteTex() {
  const [c, g] = makeCanvas(64, 64);
  g.fillStyle = '#fff'; g.font = 'bold 54px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('♪', 32, 34);
  return new THREE.CanvasTexture(c);
}
function makeRingTex() {
  const [c, g] = makeCanvas(512, 512);
  g.translate(256, 256); g.strokeStyle = g.fillStyle = '#fff'; g.shadowColor = '#fff'; g.shadowBlur = 12;
  for (const [r, w] of [[246, 6], [226, 3], [170, 4]]) { g.lineWidth = w; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.stroke(); }
  g.lineWidth = 4;
  for (let k = 0; k < 2; k++) {
    g.beginPath();
    for (let i = 0; i <= 3; i++) { const a = -Math.PI / 2 + k * Math.PI + i * 2 * Math.PI / 3; i ? g.lineTo(Math.cos(a) * 170, Math.sin(a) * 170) : g.moveTo(Math.cos(a) * 170, Math.sin(a) * 170); }
    g.stroke();
  }
  for (let i = 0; i < 36; i++) { const a = i / 36 * Math.PI * 2; g.beginPath(); g.arc(Math.cos(a) * 236, Math.sin(a) * 236, i % 3 ? 2.5 : 5, 0, Math.PI * 2); g.fill(); }
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2; g.save(); g.rotate(a); g.translate(0, -198);
    g.beginPath(); g.moveTo(0, -9); g.lineTo(6, 0); g.lineTo(0, 9); g.lineTo(-6, 0); g.closePath(); g.stroke(); g.restore();
  }
  return new THREE.CanvasTexture(c);
}
function makeTitleTex() {
  const [c, g] = makeCanvas(1024, 320);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = 'italic 900 150px system-ui, "Hiragino Sans", sans-serif';
  const gr = g.createLinearGradient(0, 80, 0, 230);
  gr.addColorStop(0, '#fff6c8'); gr.addColorStop(0.5, '#ff8fd0'); gr.addColorStop(1, '#b98cff');
  g.shadowColor = '#ff4fa8'; g.shadowBlur = 40; g.lineWidth = 10; g.strokeStyle = '#fff'; g.strokeText('LIVE START', 512, 150);
  g.shadowBlur = 0; g.fillStyle = gr; g.fillText('LIVE START', 512, 150);
  g.font = '700 44px system-ui, "Hiragino Sans", sans-serif'; g.fillStyle = '#fff'; g.fillText('♪  変身完了  ♪', 512, 272);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

const NP = 900;
const pPos = new Float32Array(NP * 3), pCol = new Float32Array(NP * 4), pSize = new Float32Array(NP), pShape = new Float32Array(NP);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute('aColor', new THREE.BufferAttribute(pCol, 4).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute('aShape', new THREE.BufferAttribute(pShape, 1).setUsage(THREE.DynamicDrawUsage));
pGeo.setDrawRange(0, 0);
const pMat = new THREE.ShaderMaterial({
  uniforms: { uScale: { value: 300 }, uNote: { value: makeNoteTex() } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uScale; attribute vec4 aColor; attribute float aSize; attribute float aShape;
    varying vec4 vColor; varying float vShape;
    void main(){ vColor = aColor; vShape = aShape; vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv; gl_PointSize = aSize * uScale / max(0.05, -mv.z); }`,
  fragmentShader: `
    uniform sampler2D uNote; varying vec4 vColor; varying float vShape;
    void main(){ vec2 p = gl_PointCoord - 0.5; float a;
      if (vShape > 0.5) a = texture2D(uNote, vec2(gl_PointCoord.x, 1.0 - gl_PointCoord.y)).a;
      else { float r = length(p);
        a = exp(-r * r * 60.0) + (max(0.0, 1.0 - abs(p.x) * 14.0) * max(0.0, 1.0 - abs(p.y) * 2.2)
                               + max(0.0, 1.0 - abs(p.y) * 14.0) * max(0.0, 1.0 - abs(p.x) * 2.2)) * 0.7; }
      if (a < 0.01) discard;
      gl_FragColor = vec4(vColor.rgb, min(1.0, a) * vColor.a); }`
});
const points = new THREE.Points(pGeo, pMat); points.frustumCulled = false; points.renderOrder = 10; scene.add(points);

const ring = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({
  map: makeRingTex(), color: 0xff8fd0, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
ring.rotation.x = -Math.PI / 2; ring.visible = false; ring.renderOrder = 5; scene.add(ring);

const hud = new THREE.Scene(), hudCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 2); hudCam.position.z = 1;
const flashMat = new THREE.MeshBasicMaterial({ color: 0xfff0fa, transparent: true, opacity: 0, depthTest: false, depthWrite: false });
hud.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), flashMat));
const titleMat = new THREE.MeshBasicMaterial({ map: makeTitleTex(), transparent: true, opacity: 0, depthTest: false, depthWrite: false });
const titleQ = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), titleMat); titleQ.position.y = 0.2; hud.add(titleQ);

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  pMat.uniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(camera.fov * Math.PI / 360));
  const pw = Math.min(innerWidth * 0.86, 820);
  titleQ.userData.sx = pw / (innerWidth / 2); titleQ.userData.sy = pw * 0.3125 / (innerHeight / 2);
}
addEventListener('resize', resize); resize();

// カメラ映像を「画面いっぱい(はみ出しは切る)」で表示するときの切り抜き量と、それに合う3Dカメラの画角
const crop = { cx: 1, cy: 1 };
function updateView() {
  const vw = video.videoWidth, vh = video.videoHeight, sa = innerWidth / innerHeight;
  const live = tracking && vw > 0;
  let fov = 30;
  if (live) {
    const va = vw / vh;
    crop.cx = Math.min(1, sa / va); crop.cy = Math.min(1, va / sa);
    const vfov = 2 * Math.atan(Math.tan(CAM_HFOV / 2) / va);
    fov = 2 * Math.atan(Math.tan(vfov / 2) * crop.cy) * 180 / Math.PI;
  } else crop.cx = crop.cy = 1;
  U.uCrop.value.set(crop.cx, crop.cy); U.uHasVideo.value = live ? 1 : 0; U.uMirror.value = mirror ? 1 : 0;
  if (Math.abs(fov - camera.fov) > 1e-4) { camera.fov = fov; resize(); }
}
// ランドマーク(映像の正規化座標) → 画面の正規化座標
const toScreenN = (x, y) => ({ x: 0.5 + ((mirror ? 1 - x : x) - 0.5) / crop.cx, y: 0.5 + (y - 0.5) / crop.cy });
const pxScale = vw => innerWidth / (crop.cx * vw);   // 映像1pxが画面で何pxか

/* ---------- 負荷プリセット ---------- */

  const vis = i => (L2[i].visibility ?? 0) > 0.5;

  const n = s(0);
  let w;

  else if (vis(2) && vis(5)) { const a = s(2), b = s(5); w = Math.hypot(a.x - b.x, a.y - b.y) * 2.4; }

let actx, dest, micGain, bgmGain, monGain;
function initAudio() {
  actx = new (window.AudioContext || window.webkitAudioContext)();
  dest = actx.createMediaStreamDestination();
  micGain = actx.createGain(); micGain.connect(dest);
  monGain = actx.createGain(); monGain.gain.value = 0; micGain.connect(monGain); monGain.connect(actx.destination);
  bgmGain = actx.createGain(); bgmGain.gain.value = +$('bgmVol').value;
  const src = actx.createMediaElementSource($('bgm'));
  src.connect(bgmGain); bgmGain.connect(dest); bgmGain.connect(actx.destination);
}
// 効果音(シンセで生成。録画にも入る)
function sfx(kind) {
  if (!actx) return;
  const t = actx.currentTime, out = actx.createGain(); out.gain.value = 0.22;
  out.connect(actx.destination); out.connect(dest);
  const tone = (type, f0, f1, t0, dur, vol) => {
    const o = actx.createOscillator(), g = actx.createGain(); o.type = type;
    o.frequency.setValueAtTime(f0, t + t0); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + t0 + dur);
    g.gain.setValueAtTime(0.0001, t + t0); g.gain.exponentialRampToValueAtTime(vol, t + t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + t0 + dur);
    o.connect(g); g.connect(out); o.start(t + t0); o.stop(t + t0 + dur + 0.05);
  };
  if (kind === 'charge') {   // 上昇するキラキラ
    tone('triangle', 200, 1200, 0, 1.7, 0.25);
    for (let i = 0; i < 14; i++) tone('sine', 523.25 * 2 ** (i * 2 / 12), null, i * 0.115, 0.3, 0.28);
  } else if (kind === 'boom') {   // 変身の瞬間
    const n = actx.sampleRate, buf = actx.createBuffer(1, n, n), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 3;
    const s = actx.createBufferSource(), f = actx.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(3000, t); f.frequency.exponentialRampToValueAtTime(120, t + 0.9);
    s.buffer = buf; s.connect(f); f.connect(out); s.start(t);
    tone('sine', 150, 40, 0, 0.8, 0.9);
  } else if (kind === 'chime') {
    [1046.5, 1318.5, 1568, 2093].forEach((f, i) => tone('sine', f, null, i * 0.08, 1.0, 0.35));
  }
}

function ytId(u) {
  try {
    const x = new URL(u);
    if (x.hostname === 'youtu.be') return x.pathname.slice(1, 12);
    if (/(^|\.)youtube\.com$/.test(x.hostname)) {
      if (x.searchParams.get('v')) return x.searchParams.get('v');
      const m = x.pathname.match(/\/(embed|shorts|live)\/([\w-]{11})/); if (m) return m[2];
    }
  } catch {}
  return null;
}

    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);

const camSel = $('camSel'), micSel = $('micSel');
let camStream = null, micStream = null, micSrc = null;
async function refreshCams(camKeep, micKeep) {
  try {
    const all = await navigator.mediaDevices.enumerateDevices();
    const fill = (sel, kind, def, label, keep) => {
      const devs = all.filter(d => d.kind === kind && d.deviceId), k = keep ?? sel.value;
      sel.replaceChildren(new Option(def, ''));
      devs.forEach((d, i) => sel.add(new Option(d.label || label + (i + 1), d.deviceId)));
      sel.value = devs.some(d => d.deviceId === k) ? k : '';
    };
    fill(camSel, 'videoinput', '既定のカメラ', 'カメラ ', camKeep);
    fill(micSel, 'audioinput', '既定のマイク', 'マイク ', micKeep);
  } catch (e) { console.warn(e); }
}
async function startVideo(deviceId) {

  const v = { width: 640, height: 480, frameRate: { ideal: 30, max: 30 } };
  if (deviceId) v.deviceId = { exact: deviceId }; else v.facingMode = 'user';
  const vs = await navigator.mediaDevices.getUserMedia({ video: v, audio: false });
  camStream = vs; video.srcObject = vs; await video.play(); lastT = -1;
  await refreshCams(vs.getVideoTracks()[0].getSettings().deviceId || '');   // 許可後はカメラ名が取れる
}
let micAn = null, micBuf = null;
async function startMic(deviceId) {
  if (micSrc) { micSrc.disconnect(); micSrc = null; }
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = null; micAn = null;
  const base = { echoCancellation: true, noiseSuppression: false, autoGainControl: false };
  const gum = c => navigator.mediaDevices.getUserMedia({ audio: c });
  try { micStream = await gum(deviceId ? { ...base, deviceId: { exact: deviceId } } : base); }
  catch (e) {
    if (e.name === 'NotAllowedError' || e.name === 'SecurityError') throw e;   // 許可されていない場合はそのまま失敗
    micStream = await gum(true);   // 制約が原因の可能性 → 最小条件で再挑戦

function micRms() {
  if (!micAn) return 0;
  micAn.getByteTimeDomainData(micBuf);
  let s = 0; for (const v of micBuf) { const x = (v - 128) / 128; s += x * x; }
  return Math.sqrt(s / micBuf.length);
}

/* ---------- リターゲット ---------- */
const QI = new THREE.Quaternion(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
const X = new THREE.Vector3(1, 0, 0), NX = new THREE.Vector3(-1, 0, 0), DOWN = new THREE.Vector3(0, -1, 0);
// 映像を鏡のように表示するとき(既定)は、アバターも鏡写しで動かす。背景映像とアバターの左右がそろう
let mirror = $('mirror').checked; $('mirror').onchange = e => mirror = e.target.checked;
let LM = null;
const lm = i => LM[mirror && i >= 11 ? (i % 2 ? i + 1 : i - 1) : i];
const visOK = (t, ...ids) => ids.every(i => (lm(i).visibility ?? 0) > t);
const dirOf = (a, b) => V.set((lm(b).x - lm(a).x) * (mirror ? -1 : 1), -(lm(b).y - lm(a).y), -(lm(b).z - lm(a).z)).normalize().clone();

// 正規化ボーンの待機姿勢のワールド回転。VRM1なら単位回転、VRM0は rotateVRM0 により Y軸180°回転になっている。
// 「ワールド基準の回転」をボーンのローカル回転に直すとき、この分を補正しないと上下・前後が反転する。
const restQ = () => vrm.scene.getWorldQuaternion(new THREE.Quaternion());
// ワールド基準の回転 Qw(待機姿勢からの回転)をボーンに適用
function setWorldRot(name, Qw, k = 0.5) {
  const n = vrm.humanoid.getNormalizedBoneNode(name); if (!n) return;
  const parentW = n.parent.getWorldQuaternion(new THREE.Quaternion());
  n.quaternion.slerp(parentW.invert().multiply(Qw).multiply(restQ()), k);
  n.updateMatrixWorld(true);
}
// ボーンが rest 方向を向いている状態から dir 方向へ向ける
function setDir(name, rest, dir, k = 0.5) { setWorldRot(name, new THREE.Quaternion().setFromUnitVectors(rest, dir), k); }
// ワールド基準の累積回転 q をローカルに直して適用(hips→spine のように親子で使っても整合する)
function setRot(name, q, k = 0.5) {
  const n = vrm.humanoid.getNormalizedBoneNode(name); if (!n) return;
  const R0 = restQ();
  n.quaternion.slerp(R0.clone().invert().multiply(q).multiply(R0), k); n.updateMatrixWorld(true);
}
// ローカル回転をそのまま適用(指など)
function setLocal(name, q, k = 0.5) {
  const n = vrm.humanoid.getNormalizedBoneNode(name); if (n) n.quaternion.slerp(q, k);
}

function applyPose() {
  const I = () => new THREE.Quaternion();
  const armDown = (side) => {  // 未検出時は腕を下ろす
    const s = side === 'left' ? 1 : -1, rest = side === 'left' ? X : NX;
    const d = new THREE.Vector3(s * 0.18, -1, 0).normalize();
    setDir(side + 'UpperArm', rest, d, 0.15); setDir(side + 'LowerArm', rest, d, 0.15);
  };
  const resetLegs = k => { for (const s of ['left', 'right']) { setRot(s + 'UpperLeg', I(), k); setRot(s + 'LowerLeg', I(), k); } };
  // 肩が見えない → 待機姿勢(腰は判定に使わない: 上半身だけ映っていても腕を追従させるため)
  if (!LM || !visOK(0.5, 11, 12)) {
    setRot('hips', I(), 0.1); setRot('spine', I(), 0.1);
    armDown('left'); armDown('right'); resetLegs(0.1);
    return;
  }
  const useHips = mode === 'full' && visOK(0.5, 23, 24);
  if (useHips) {
    // 腰の向き(ヨー)
    const hv = dirOf(24, 23);
    const yaw = THREE.MathUtils.clamp(Math.atan2(-hv.z, hv.x), -1.2, 1.2);
    const hipsQ = new THREE.Quaternion().setFromAxisAngle(UP, yaw);
    setRot('hips', hipsQ, 0.4);
    // 上半身の傾き
    const mid = (a, b) => ({ x: (lm(a).x + lm(b).x) / 2, y: (lm(a).y + lm(b).y) / 2, z: (lm(a).z + lm(b).z) / 2 });
    const sh = mid(11, 12), hp = mid(23, 24), mx = mirror ? -1 : 1;
    const torso = new THREE.Vector3((sh.x - hp.x) * mx, -(sh.y - hp.y), -(sh.z - hp.z)).normalize();
    const tilt = new THREE.Quaternion().setFromUnitVectors(UP, torso);
    setRot('spine', hipsQ.clone().invert().multiply(tilt), 0.4);
  } else {
    // 上半身モード: 腰・脚は固定。肩のラインから胴体のひねり(ヨー)と傾き(ロール)だけ推定
    const sv = dirOf(12, 11);
    const yaw = THREE.MathUtils.clamp(Math.atan2(-sv.z, sv.x), -1.2, 1.2);
    const roll = THREE.MathUtils.clamp(Math.atan2(sv.y, Math.hypot(sv.x, sv.z)), -0.5, 0.5);
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, roll, 'YXZ'));
    setRot('hips', I(), 0.2);
    setRot('spine', I().slerp(q, 0.7), 0.4);
  }

  // 腕
  for (const [side, sh_, el, wr] of [['left', 11, 13, 15], ['right', 12, 14, 16]]) {
    const rest = side === 'left' ? X : NX;
    if (visOK(0.4, sh_, el)) setDir(side + 'UpperArm', rest, dirOf(sh_, el)); else armDown(side);
    if (visOK(0.4, el, wr)) setDir(side + 'LowerArm', rest, dirOf(el, wr));
  }
  // 脚(全身モードで映っているときだけ。上半身モードは常に直立)
  if (mode !== 'full') { resetLegs(0.2); return; }
  for (const [side, hi, kn, an] of [['left', 23, 25, 27], ['right', 24, 26, 28]]) {
    if (visOK(0.7, hi, kn, an)) {
      setDir(side + 'UpperLeg', DOWN, dirOf(hi, kn)); setDir(side + 'LowerLeg', DOWN, dirOf(kn, an));
    } else { setRot(side + 'UpperLeg', I(), .1); setRot(side + 'LowerLeg', I(), .1); }
  }
}

/* ---------- ハンドトラッキング ---------- */
// [指, 使うランドマーク(関節3つ), VRMのボーン名, 曲げの上限(rad)]
const FINGERS = [
  ['Thumb',  [1, 2, 3],    ['Metacarpal', 'Proximal', 'Distal'],      [0.8, 1.0, 1.3]],
  ['Index',  [5, 6, 7],    ['Proximal', 'Intermediate', 'Distal'],    [1.5, 1.9, 1.4]],
  ['Middle', [9, 10, 11],  ['Proximal', 'Intermediate', 'Distal'],    [1.5, 1.9, 1.4]],
  ['Ring',   [13, 14, 15], ['Proximal', 'Intermediate', 'Distal'],    [1.5, 1.9, 1.4]],
  ['Little', [17, 18, 19], ['Proximal', 'Intermediate', 'Distal'],    [1.5, 1.9, 1.4]]
];
const _s1 = new THREE.Vector3(), _s2 = new THREE.Vector3();
const seg = (W, i, j, out) => out.set(W[j].x - W[i].x, W[j].y - W[i].y, W[j].z - W[i].z).normalize();
const flexion = (W, p, a, b) => { seg(W, p, a, _s1); seg(W, a, b, _s2); return Math.acos(THREE.MathUtils.clamp(_s1.dot(_s2), -1, 1)); };

// 検出した手 → アバターの左右 に割り当て(手首の位置がポーズの手首に近い方。取れなければ MediaPipe のラベル)
function assignHands() {
  const out = {}, H = handRes;
  if (!H?.landmarks?.length) return out;
  const P = poseRes?.landmarks?.[0];
  H.landmarks.forEach((lmk, i) => {
    let person = null, dist = 1;
    if (P) {
      const dl = P[15] && (P[15].visibility ?? 0) > 0.2 ? Math.hypot(lmk[0].x - P[15].x, lmk[0].y - P[15].y) : 9;
      const dr = P[16] && (P[16].visibility ?? 0) > 0.2 ? Math.hypot(lmk[0].x - P[16].x, lmk[0].y - P[16].y) : 9;
      if (Math.min(dl, dr) < 0.25) { person = dl < dr ? 'left' : 'right'; dist = Math.min(dl, dr); }
    }
    if (!person) {   // ラベルは「鏡像入力」前提なので、反転していない映像では左右が逆
      const label = H.handedness?.[i]?.[0]?.categoryName;
      if (!label) return;
      person = label === 'Left' ? 'right' : 'left';
    }
    const side = mirror ? (person === 'left' ? 'right' : 'left') : person;
    if (!out[side] || dist < out[side].dist) out[side] = { i, dist };
  });
  return out;
}

function restBasis(side) {
  const f0 = side === 'left' ? X : NX, s0 = new THREE.Vector3(0, 0, -1);
  return new THREE.Matrix4().makeBasis(f0, s0, f0.clone().cross(s0));
}

function applyHands() {
  const assigned = (hand && $('handTrack').checked) ? assignHands() : {};
  const mx = mirror ? -1 : 1, R0inv = restQ().invert();
  for (const side of ['left', 'right']) {
    const a = assigned[side];
    if (!a) {   // 手が見えない → 手首と指をゆっくり戻す
      setRot(side + 'Hand', QI, 0.1);
      for (const [f, , bones] of FINGERS) for (const b of bones) setLocal(side + f + b, QI, 0.15);
      continue;
    }
    const W = handRes.worldLandmarks[a.i];
    // 手首の向き: 手首→中指の付け根(前方)と、人差し指側→小指側(横)から姿勢を作る
    const v = i => new THREE.Vector3(W[i].x * mx, -W[i].y, -W[i].z);
    const f = v(9).sub(v(0)).normalize();
    const s = v(17).sub(v(5)); s.addScaledVector(f, -s.dot(f)).normalize();
    const M = new THREE.Matrix4().makeBasis(f, s, f.clone().cross(s));
    const Qw = new THREE.Quaternion().setFromRotationMatrix(M.multiply(restBasis(side).invert()));
    setWorldRot(side + 'Hand', Qw, 0.4);

function onDetect(now) {
  const fresh = grabMask();
  if (hideOn()) {   // 人が映っていればマスクの外を、誰もいなければ(1秒以上)画面全体を背景として覚える
    if (poseRes?.landmarks?.length) { if (fresh) learnBg(false); }
    else if (now - trk.seenT > 1000) learnBg(true);
  }
  updateFace();
  const m = measureFrame();
  if (m) { if (now - trk.seenT > 1500) trk.has = false; trk.tgt = estimate(m); trk.seenT = now; }
  if (phase === 'calib') calibStep(m, now);
  autoMode(now);
}

/* ---------- メインループ ---------- */
const clock = new THREE.Clock();
refreshModeUI();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  if (P.frameMs && now - lastRender < P.frameMs - 1.5) return;   // 軽量モード: 描画を約30fpsに制限
  lastRender = now;
  const dt = Math.min(clock.getDelta(), 0.1);
  updateView();
  if (tracking && video.readyState >= 2 && video.currentTime !== lastT) {
    lastT = video.currentTime;
    if (++detN % P.skip === 0) {
      const ts = performance.now(), turn = (detN / P.skip) | 0, useHand = hand && $('handTrack').checked;
      try {
        faceRes = face.detectForVideo(video, ts);   // 表情・口パクは毎回
        // 標準/軽量: ポーズと手を交互に検出して1フレームあたりの負荷を半分に
        let poseRan = false;
        if (!P.alt || !useHand || (turn & 1) === 0) { poseRes = pose.detectForVideo(video, ts); LM = poseRes.worldLandmarks?.[0] || null; poseRan = true; }
        if (useHand) { if (!P.alt || (turn & 1) === 1) handRes = hand.detectForVideo(video, ts); } else handRes = null;
        drawOverlay();
        if (poseRan) onDetect(now);
      } catch (e) { console.warn(e); }
    }
  }
  if (vrm) {
    applyPose();
    applyHands(); applyFace();   // 検出結果が無いときは手・頭が待機姿勢へ戻る
    placeAvatar(dt);             // 映像の人の位置・大きさに合わせる
    vrm.update(dt);
    updateBody();
    updateAvatarBones();
  }
  updatePhase(dt, now);
  updateSinging(dt);
  updateParticles(dt);
  U.uTime.value = now / 1000;
  renderer.clear();
  renderer.render(scene, camera);
  if (flashMat.opacity > 0 || titleMat.opacity > 0) { renderer.clearDepth(); renderer.render(hud, hudCam); }
}
loop();
</script>
